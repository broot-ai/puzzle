    info: 'Картинку рисует сервис api.qrserver.com по вашей ссылке. Переменные {{…}} PuzzleBot подставит до загрузки — у каждого пользователя будет свой код.',
    defaults: { props: { url: '', size: 220, color: '#000000', bg: '#ffffff', margin: 10, caption: '' }, style: { self: 'center', radius: 'small' } },
    render(n, ctx) {
      const p = n.props;
      const s = clamp(parseInt(p.size) || 220, 80, 600);
      const hex = v => (/^#([0-9a-f]{6})$/i.exec(String(v || '')) || [])[1];
      const data = String(p.url || '').trim();
      if (!data) {
        if (ctx.mode !== 'edit') return '';
        return `<div ${at(n, ctx, 'ps-qr ps-edit-img-empty')} style="width:${s}px;max-width:100%;aspect-ratio:1/1">${svgI('qr', 28)}<span>Вставьте ссылку в панели свойств</span></div>`;
      }
      const q = ['size=' + s * 2 + 'x' + s * 2, 'data=' + encKeepVars(data)];
      if (hex(p.color)) q.push('color=' + hex(p.color));
      if (hex(p.bg)) q.push('bgcolor=' + hex(p.bg));
      q.push('margin=' + clamp(parseInt(p.margin) || 0, 0, 40));
      const src = 'https://api.qrserver.com/v1/create-qr-code/?' + q.join('&');
      return `<figure ${at(n, ctx, 'ps-qr')}><img src="${escAttr(src)}" width="${s}" height="${s}" alt="QR-код" loading="lazy" decoding="async" style="width:${s}px">${p.caption ? `<figcaption>${T(p.caption, ctx)}</figcaption>` : ''}</figure>`;
    },
  },

  sheet: {
    label: 'Шторка', icon: 'sheet', container: true, sheet: true,
    fields: [
      { k: 'title', label: 'Заголовок шторки', type: 'text' },
      { k: 'height', label: 'Высота', type: 'seg', options: [['auto', 'По содержимому'], ['half', 'Половина'], ['full', 'Весь экран']] },
      { k: 'x', label: 'Крестик для закрытия', type: 'toggle' },
      { k: 'tapOut', label: 'Закрывать касанием за пределами', type: 'toggle' },
      { k: 'handle', label: 'Чёлка: потянуть вниз, чтобы закрыть', type: 'toggle' },
    ],
    info: 'Шторка выезжает снизу по нажатию кнопки с действием «Открыть шторку». Наполняйте её блоками, как обычную страницу.',
    defaults: { props: { title: 'Шторка', height: 'auto', x: true, tapOut: true, handle: true }, style: { layout: 'stack', gap: 12, pt: 8, pr: 16, pb: 24, pl: 16 } },
    render(n, ctx) {
      const p = n.props;
      const open = ctx.mode === 'edit' && ctx.openSheet === n.id;
      if (ctx.mode === 'edit' && !open) return '';
      const hg = CSS.pick(p.height, ['auto', 'half', 'full']) || 'auto';
      const head = (p.handle ? '<div class="ps-sheet-h" data-ps-sheet-drag aria-hidden="true"><i></i></div>' : '<div class="ps-sheet-sp"></div>')
        + (p.x ? `<button type="button" class="ps-sheet-x" data-ps-sheet-close aria-label="Закрыть">${svgI('x', 18)}</button>` : '')
        + (p.title ? `<div class="ps-sheet-t">${T(p.title, ctx)}</div>` : '');
      return `<div class="ps-sheet-o${open ? ' ps-open' : ''}" data-ps-sheet="${n.id}" aria-hidden="${open ? 'false' : 'true'}"><div class="ps-sheet-bg"${p.tapOut ? ' data-ps-sheet-close' : ''}></div><div ${at(n, ctx, 'ps-sheet ps-sheet--' + hg, ` role="dialog" aria-modal="true"${ctx.mode === 'edit' ? ' data-pscont="column"' : ''}`)}>${head}${kids(n, ctx)}</div></div>`;
    },
  },

  stars: {
    label: 'Рейтинг', icon: 'star',
    fields: [{ k: 'value', label: 'Оценка', type: 'range', min: 0, max: 5, step: 0.5 }, { k: 'caption', label: 'Подпись', type: 'text' }],
    defaults: { props: { value: 5, caption: '' }, style: { color: '#f5b301' } },
    render(n, ctx) {
      const v = clamp(parseFloat(n.props.value) || 0, 0, 5);
      const stars = [1, 2, 3, 4, 5].map(i => `<span class="ps-star${i <= Math.round(v) ? ' is-on' : ''}">${iconSvg('star', 16)}</span>`).join('');
      return `<div ${at(n, ctx, 'ps-stars')} aria-label="Оценка ${v} из 5">${stars}${n.props.caption ? `<span class="ps-stars-c">${T(n.props.caption, ctx)}</span>` : ''}</div>`;
    },
  },
};

/* ---------- Создание узлов ---------- */
function mk(type, props = {}, style = {}, children, extra = {}) {
  const def = COMP[type];
  const d = def && def.defaults ? clone(def.defaults) : {};
  const n = {
    id: uid(), type,
    props: { ...(d.props || {}), ...props },
    style: { ...(d.style || {}), ...style },
  };
  if (d.action || extra.action) n.action = { ...(d.action || {}), ...(extra.action || {}) };
  if (def && def.container) n.children = children || [];
  for (const k of ['name', 'anchor', 'hover', 'press', 'anim', 'bp', 'hide']) if (extra[k]) n[k] = extra[k];
  return n;
}

function localDT(ts) {
  // формат для datetime-local в МЕСТНОМ времени (toISOString дал бы UTC)
  const d = new Date(ts);
  const pad = x => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function defaultTimerTarget() {
  const d = new Date(Date.now() + 3 * 864e5);

}

/* ---------- Генеративные демо-изображения (SVG data URI) ----------
   Внешние картинки могут быть недоступны, поэтому шаблоны используют
   встроенную графику. Пользователь заменяет её своими фото. */
function artImage(seed, colors, kind = 'blobs') {
  let s = seed * 9301 + 49297;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const [a, b, c] = colors;
  let shapes = '';
  if (kind === 'blobs') {
    for (let i = 0; i < 5; i++) shapes += `<circle cx="${(rnd() * 400).toFixed(0)}" cy="${(rnd() * 300).toFixed(0)}" r="${(60 + rnd() * 120).toFixed(0)}" fill="${[a, b, c][i % 3]}" opacity="${(0.5 + rnd() * 0.4).toFixed(2)}"/>`;
    shapes = `<g filter="url(#f)">${shapes}</g>`;
  } else if (kind === 'product') {
    shapes = `<rect x="130" y="70" width="140" height="170" rx="18" fill="${c}" opacity=".95"/><rect x="150" y="95" width="100" height="10" rx="5" fill="#fff" opacity=".7"/><rect x="150" y="115" width="70" height="10" rx="5" fill="#fff" opacity=".45"/><circle cx="200" cy="185" r="32" fill="#fff" opacity=".25"/>`;
  } else if (kind === 'portrait') {
    shapes = `<circle cx="200" cy="120" r="56" fill="${c}" opacity=".9"/><path d="M90 320c10-80 60-120 110-120s100 40 110 120z" fill="${c}" opacity=".9"/>`;
  } else if (kind === 'waves') {
    for (let i = 0; i < 4; i++) shapes += `<path d="M0 ${150 + i * 30} C 100 ${100 + i * 30 + rnd() * 40}, 300 ${200 + i * 20 - rnd() * 40}, 400 ${140 + i * 30} V300 H0Z" fill="${[a, b, c, a][i]}" opacity="${0.35 + i * 0.15}"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><filter id="f" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter></defs><rect width="400" height="300" fill="url(#g)"/>${shapes}</svg>`;
  return 'data:image/svg+xml;base64,' + btoa(svg);
}

        if (!p.alt) add('info', `«${L}»: нет описания (alt) — его читают программы для незрячих`, n.id);
        if (c.kind === 'data' && p.src.length > 300000) add('warn', `«${L}»: картинка встроена в код и весит ~${fmtBytes(p.src.length * 0.75)}. Лучше загрузить её на хостинг и указать ссылку`, n.id);
        if (c.insecure) add('warn', `«${L}»: ссылка http:// — внутри Telegram такие картинки могут не загрузиться, нужен https://`, n.id);
      }
    }
    if (n.type === 'video') {
      if (/youtu\.?be|vk\.com|rutube/i.test(p.src || '')) add('error', `«${L}»: ссылки YouTube/VK/Rutube не встраиваются как видеофайл`, n.id);
      else if (!p.src) add('warn', `«${L}»: нет ссылки на видео — блок не попадёт в код`, n.id);
    }
    if (n.type === 'gallery') (p.items || []).forEach((it, i) => { if (it.src && it.src.length > 300000) add('warn', `«${L}», фото ${i + 1}: встроенная картинка весит ~${fmtBytes(it.src.length * 0.75)}`, n.id); });
    if (COMP[n.type] && COMP[n.type].action) {
      const t = a.type === 'miniapp' ? 'tg' : (a.type || 'none');
      const d = ACT[t];
      if (n.type === 'button' && t === 'none' && !p.disabled) add('info', `«${L}»: у кнопки нет действия`, n.id);
      if (d && t !== 'none') {
        for (const f of d.params || []) if (f.req && !String(a[f.k] ?? '').trim()) add('error', `«${L}»: в действии «${d.label}» не заполнено «${f.label}»`, n.id);
        if (t === 'screen') {
          const sc = screensCtx(project, 'pages').list.find(x => x.id === a.value);
          if (!sc) add('error', `«${L}»: экран для перехода не найден`, n.id);
          else if (opts.screensMode !== 'single' && !sc.pbId) add('error', `«${L}»: у экрана, на который ведёт кнопка, не указана ссылка на страницу PuzzleBot`, n.id);
        } else if (t === 'sheet') {
          if (!(project.root.children || []).some(c => c.type === 'sheet' && c.id === a.value)) add('error', `«${L}»: шторка для открытия не найдена`, n.id);
          if (opts.js === false) add('error', `«${L}»: шторки работают только с JavaScript`, n.id);
        } else if (['show', 'hide', 'toggle'].includes(t)) {
          if (!findNode(project.root, a.value)) add('error', `«${L}»: блок для действия не найден`, n.id);
        } else if (t === 'app') {
          if (!parseGoto(a.value) && !a.bot) add('error', `«${L}»: не удалось найти ID Mini App — нужна ссылка с «startapp=»`, n.id);
          else add('info', `«${L}»: gotoWebPage — функция PuzzleBot, проверьте переход внутри мини-приложения`, n.id);
        } else if (t === 'goto') {
          if (a.value && !parseGoto(a.value)) add('error', `«${L}»: не удалось найти ID страницы Mini App`, n.id);
          add('info', `«${L}»: переход goto_web_page обрабатывает PuzzleBot — проверьте его внутри мини-приложения`, n.id);
        } else if (t === 'anchor') {
          if (!anchors.has(String(a.value || '').replace(/^#/, ''))) add('error', `«${L}»: блок с якорем «${a.value || '—'}» не найден`, n.id);
        } else if (d.link) {
          if ((a.value || a.bot) && !actionHref({ ...a, type: t })) add('error', `«${L}»: ссылка некорректна — проверьте поля действия`, n.id);
          if (t === 'url') { const c = checkUrl(a.value, { allowAnchor: false }); if (c.ok && c.insecure) add('warn', `«${L}»: ссылка http:// — внутри Telegram используйте https://`, n.id); }
        }
        for (const f of d.params || []) if (f.type === 'url' && a[f.k]) { const c = checkUrl(a[f.k], { allowAnchor: false }); if (!c.ok || !/^https:/.test(c.url)) add('error', `«${L}»: «${f.label}» — нужна ссылка https://`, n.id); }
        if (!JS_FREE_ACTIONS.has(t) && opts.js === false) add('warn', `«${L}»: действие «${d.label}» требует JavaScript, а он выключен в экспорте`, n.id);
        if (d.min && parseFloat(d.min) >= 8) add('info', `«${L}»: «${d.label}» работает в Telegram с Bot API ${d.min}+ — на старых версиях пользователь увидит просьбу обновиться`, n.id);
        if (['sharemsg', 'requestchat', 'invoice'].includes(t)) add('warn', `«${L}»: для «${d.label}» нужен свой сервер бота (Bot API), PuzzleBot сам это не создаёт`, n.id);
        if (t === 'senddata') add('warn', `«${L}»: sendData работает, только если Mini App открыт кнопкой обычной клавиатуры бота`, n.id);
        if (t === 'submit') {
          let inForm = false, cur = findNode(project.root, n.id);
          while (cur && cur.parent) { if (cur.parent.type === 'form') { inForm = true; break; } cur = findNode(project.root, cur.parent.id); }
          if (!inForm) add('error', `«${L}»: кнопка «Отправить форму» должна лежать внутри блока «Форма»`, n.id);
        }
        if (!JS_FREE_ACTIONS.has(t) && /\{\{[A-Za-z0-9_]+\}\}/.test(JSON.stringify(a))) add('info', `«${L}»: переменная внутри данных кнопки. Если значение переменной содержит кавычки, действие может не сработать`, n.id);
      }
    }
    if (n.type === 'navmenu' || n.type === 'bottomnav') (p.items || []).forEach((it, i) => {
      if (it.page) { if (!parseGoto(it.page)) add('error', `«${L}», пункт ${i + 1}: не найден ID страницы Mini App`, n.id); return; }
      if (!it.url) return;
      if (/^#/.test(it.url)) { if (!anchors.has(it.url.slice(1))) add('warn', `«${L}», пункт ${i + 1}: якорь ${it.url} не найден на странице`, n.id); }
      else if (!checkUrl(/^@?[A-Za-z0-9_]{4,64}$/.test(it.url) ? 'https://t.me/' + it.url : it.url).ok) add('error', `«${L}», пункт ${i + 1}: некорректная ссылка`, n.id);
    });
    if (n.type === 'form' && p.mode === 'webhook') {
      const c = checkUrl(p.webhook, { allowAnchor: false });
      if (!p.webhook) add('error', `«${L}»: режим «вебхук», но адрес не указан`, n.id);
      else if (!c.ok || !/^https:/.test(c.url)) add('error', `«${L}»: адрес вебхука должен начинаться с https://`, n.id);
      else add('info', `«${L}»: сервер вебхука должен разрешать запросы с веб-страниц (CORS) и проверять initData Telegram`, n.id);
    }
    if (n.type === 'form') {
      let hasSubmit = false;
      walk(n, c => { if (c.action && c.action.type === 'submit') hasSubmit = true; });
      if (!hasSubmit) add('warn', `«${L}»: в форме нет кнопки с действием «Отправить форму»`, n.id);
      if (p.mode === 'senddata') add('warn', `«${L}»: sendData работает, только если Mini App открыт кнопкой клавиатуры бота`, n.id);
      else if (p.mode !== 'webhook') add('info', `«${L}»: форма только показывает сообщение — данные никуда не отправляются`, n.id);
      if (opts.js === false) add('warn', `«${L}»: без JavaScript форма не покажет сообщение после отправки`, n.id);
    }
    if ((n.type === 'timer' || n.type === 'copyfield') && opts.js === false) add('warn', `«${L}»: без JavaScript работает в упрощённом виде`, n.id);
    if (COMP[n.type] && COMP[n.type].container && !(n.children || []).length) empties++;
    const scan = s => { if (typeof s === 'string') { let m; VAR_RE.lastIndex = 0; while ((m = VAR_RE.exec(s))) usedVars.add(m[1]); } };
    Object.values(p).forEach(v => Array.isArray(v) ? v.forEach(it => Object.values(it || {}).forEach(scan)) : scan(v));
  });
  if (empties) add('info', `Пустых контейнеров: ${empties}. В итоговом коде они займут место только за счёт отступов`);
  // переменные: свои (нужно создать в PuzzleBot) и варианты «ссылкой»
  const catalog = allVars(project);
  const ex = [...usedVars].filter(k => (catalog.find(v => v.key === k) || {}).example);
  if (ex.length) add('warn', `Создайте в PuzzleBot → Переменные: ${ex.map(k => '{{' + k + '}}').join(', ')}. Иначе вместо них останется текст в скобках`);
  const links = [...usedVars].filter(k => (catalog.find(v => v.key === k) || {}).link);
  if (links.length) add('info', `${links.map(k => '{{' + k + '}}').join(', ')} — вариант «ссылкой». Если в тексте появится лишняя разметка ссылки, замените на ${links.map(k => k + '_TEXT').join(', ')}`);
  // токен PuzzleBot не должен оказаться в странице
  const dump = JSON.stringify(project.root);
  if (PB.token && PB.token.length > 7 && dump.includes(PB.token)) add('error', 'В странице найден ваш API-токен PuzzleBot. Удалите его: код страницы видит любой пользователь');
  else if (/api\.puzzlebot\.top|[?&]token=/i.test(dump)) add('warn', 'В странице есть адрес API PuzzleBot или параметр token. Не размещайте токены в HTML — их может прочитать любой');
  for (const v of usedVars) if (!known.has(v)) add('info', `Переменная {{${v}}} не найдена в справочнике. Это не ошибка, если она есть в вашем боте`);
  if (usedVars.size) add('info', `Используется переменных: ${usedVars.size}. Синтаксис {{ИМЯ}} сохранён без изменений`);
  const tokens = themeTokens(project.page);
  const gf = googleFontsHref([tokens.font, tokens.headingFont]);
  if (gf) add('info', 'Шрифты загружаются с fonts.googleapis.com. Если хост заблокирует загрузку, браузер покажет системный шрифт');
  // NocoDB
  const ncUsed = ncUsage(project);
  if (ncUsed.size) {
    const c = ncConf(project) || {};
    if (!c.token) add('error', 'NocoDB: не указан API-токен — данные не загрузятся', null);
    else add('warn', 'NocoDB: токен виден в коде страницы. Используйте токен пользователя с ролью «Viewer» (только чтение)', null);
    if (opts.js === false) add('error', 'Данные NocoDB загружаются только с JavaScript', null);
  }
  walk(project.root, n => {
    if (n.hidden) return false;
    for (const v of Object.values(n.props || {})) if (typeof v === 'string' && v.includes('#{')) { NC_RE.lastIndex = 0; let m; while ((m = NC_RE.exec(v))) { const src = ncSrcByName(project, m[1]); if (!src) add('error', `«${nodeLabel(n)}»: нет источника NocoDB «${m[1]}»`, n.id); else if ((src.cols || []).length && !src.cols.some(c => c.title === m[2].trim())) add('warn', `«${nodeLabel(n)}»: в источнике «${src.name}» нет поля «${m[2]}»`, n.id); } }
    if ((n.type === 'ncList' || n.type === 'ncTable') && !ncSources(project).some(s => s.id === n.props.source)) add('error', `«${nodeLabel(n)}»: не выбран источник NocoDB`, n.id);
  });
  // сценарий при открытии и кнопка Telegram внизу
  const fl = project.root.flow;
  if (fl && fl.on) {
    if (!fl.ok || !fl.ok.type || fl.ok.type === 'none') add('warn', 'Сценарий при открытии: не выбрано действие для ветки «' + (fl.on === 'load' ? 'Действие' : 'Если успешно') + '»', null);
    if (fl.on === 'var' && !/^[A-Za-z0-9_]{1,40}$/.test(fl.varKey || '')) add('error', 'Сценарий при открытии: не указана переменная для проверки', null);
    if (opts.js === false) add('error', 'Сценарий при открытии работает только с JavaScript', null);
  }
  let mains = 0; walk(project.root, n => { if (n.type === 'button' && n.props && n.props.mainBtn && !n.hidden) mains++; });
  if (mains > 1) add('warn', `Закреплённых внизу кнопок: ${mains}. Telegram показывает одну — сработает первая`, null);
  if (mains) add('info', 'Кнопка внизу экрана — это MainButton Telegram: вне Telegram она остаётся обычной кнопкой на странице', null);
  return issues;
}

/* ============================================================
   07 · PUZZLEBOT ADAPTER И ЭКСПОРТ
   Режимы:
   A fragment  — только HTML-разметка (стили отдельно)
   B split     — HTML, CSS и JS по отдельности
   C document  — самостоятельная HTML-страница (для хостинга / Mini App по ссылке)
   D puzzlebot — один блок: <style> + разметка + <script>, всё изолировано
   ============================================================ */
const EXPORT_MODES = [
  { id: 'puzzlebot', short: 'D', label: 'PuzzleBot: один блок', desc: 'Стили, разметка и скрипт в одном куске кода. Для поля, куда вставляется HTML целиком.' },
  { id: 'pbhead', short: 'H', label: 'PuzzleBot: head + блок', desc: 'Стили и скрипт — в поле «HTML в head» настроек мини-приложения, в блок «HTML код» — только разметка. Блок короче, стили общие для всех страниц.' },
  { id: 'split', short: 'B', label: 'HTML + CSS + JS', desc: 'Три отдельные части. Для конструкторов, где стили и скрипты вставляются в разные поля.' },
  { id: 'fragment', short: 'A', label: 'Только HTML', desc: 'Разметка без стилей. Подходит, только если CSS уже подключён отдельно.' },
  { id: 'document', short: 'C', label: 'Полный документ', desc: 'Готовая страница index.html. Для размещения на хостинге и открытия как Mini App по ссылке.' },
];

/* Все экраны в одном блоке: каждый экран в обёртке data-ps-screen, переключение без перезагрузки */
function generateSingle(project, opt) {
  const scrs = allScreens(project);
  const list = scrs.map(r => ({ id: r.scr.id, pbId: r.scr.pbId || '' }));
  const gs = scrs.map((r, i) => generate({ ...projectForScreen(project, r), pid: project.pid + (i ? 's' + i : '') }, { ...opt, screens: { mode: 'single', list } }));
  const g0 = gs[0];
  return {
    ...g0,
    html: gs.map((g, i) => `<div data-ps-screen="${scrs[i].scr.id}"${i ? ' hidden' : ''}>\n${g.html}\n</div>`).join('\n'),
    css: gs.map(g => g.css).join('\n'),
    js: gs.map(g => g.js).filter(Boolean).join('\n'),
    feat: { ...g0.feat, tg: gs.some(g => g.feat.tg), links: gs.some(g => g.feat.links) },
  };
}
function buildExport(project, o = {}) {
  const mode = o.mode || 'puzzlebot';
  const js = o.js !== false;
  const many = allScreens(project).length > 1;
  const gopt = { mode: 'export', js, minify: !!o.minify, varMode: 'raw', embed: mode === 'document' ? 'doc' : undefined };
  let g;
  if (many && o.screensMode === 'single') g = generateSingle(project, gopt);
  else {
    const r = (o.screen && screenById(project, o.screen)) || project.root;
    project = projectForScreen(project, r);
    g = generate(project, gopt);
  }
  const fontImport = g.fontsHref ? `@import url("${g.fontsHref}");\n` : '';
  const head = `<!-- Puzzle Studio · ${project.name.replace(/--/g, '—')} · ${new Date().toLocaleDateString('ru-RU')} -->`;
  const parts = [];
  const notes = [];
  let single = '';
  const css = (o.minify ? fontImport.trim() : fontImport) + g.css;
  if (mode === 'fragment') {
    single = g.html;
    parts.push({ tab: 'HTML', lang: 'html', code: g.html, file: 'page.html' });
    notes.push('В этом режиме нет стилей. Без CSS страница будет выглядеть как обычный текст. CSS можно взять в режиме «HTML + CSS + JS».');
    if (g.js) notes.push('Интерактивные элементы (копирование, таймер, формы) без JavaScript работают в упрощённом виде.');
  } else if (mode === 'pbhead') {
    // Скрипт в head выполняется до появления блока — ждём DOMContentLoaded
    const jsHead = g.js ? `(function (f) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', f); else f(); })(function () {\n${g.js}\n});` : '';
    const headCode = `<!-- Puzzle Studio · стили и скрипт для «HTML в head» -->\n<style>\n${css}\n</style>${jsHead ? `\n<script>\n${jsHead}\n<\/script>` : ''}`;
    parts.push({ tab: 'HTML в head', lang: 'html', code: headCode, file: 'puzzlebot-head.html' });
    parts.push({ tab: 'Блок «HTML код»', lang: 'html', code: `${head}\n${g.html}`, file: 'puzzlebot-block.html' });
    single = `${headCode}\n${head}\n${g.html}`;
    notes.push('Код из первой вкладки вставьте один раз в настройках мини-приложения (поле HTML в head), разметку — в блок «HTML код» нужной страницы.');
    notes.push('Если в «HTML в head» уже есть код другой страницы Puzzle Studio, добавьте новый ниже: стили каждого проекта начинаются со своего .ps-p-' + project.pid + ' и не конфликтуют.');
    notes.push('Если PuzzleBot подгружает страницы без перезагрузки, скрипт из head может не увидеть новый блок. Тогда используйте режим «PuzzleBot: один блок».');
  } else if (mode === 'split') {
    parts.push({ tab: 'HTML', lang: 'html', code: g.html, file: 'page.html' });
    parts.push({ tab: 'CSS', lang: 'css', code: css, file: 'style.css' });
    if (g.js) parts.push({ tab: 'JS', lang: 'js', code: g.js, file: 'script.js' });
    single = `${head}\n<style>\n${css}\n</style>\n${g.html}${g.js ? `\n<script>\n${g.js}\n<\/script>` : ''}`;
  } else if (mode === 'document') {
    const bg = (THEMES[project.page.themeId] || THEMES.dark);
    const tokens = themeTokens(project.page);
    const docBg = CSS.color(tokens.bg) || bg.bg;
    const doc = `<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>${escHtml(project.name)}</title>
${g.fontsHref ? `<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="${escAttr(g.fontsHref)}">\n` : ''}${o.tgScript !== false && (g.feat.tg || g.feat.links) ? '<script src="https://telegram.org/js/telegram-web-app.js"><\/script>\n' : ''}<style>
html, body { margin: 0; padding: 0; background: ${docBg}; }
${g.css}
</style>
</head>
<body>
${g.html}${g.js ? `\n<script>\n${g.js}\n${o.tgScript !== false ? "if (window.Telegram && Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); }\n" : ''}<\/script>` : (o.tgScript !== false && (g.feat.tg || g.feat.links) ? "\n<script>if (window.Telegram && Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); }<\/script>" : '')}
</body>
</html>`;
    single = doc;
    parts.push({ tab: 'index.html', lang: 'html', code: doc, file: 'index.html' });
    notes.push('Это самостоятельная страница. Здесь допустимы стили для html и body, потому что страница не встраивается в чужую.');
    if (o.tgScript !== false && (g.feat.tg || g.feat.links)) notes.push('Подключён официальный скрипт Telegram (telegram-web-app.js). Он нужен для кнопок «Закрыть», «Передать данные» и открытия ссылок внутри Telegram.');
  } else {
    // puzzlebot
    single = `${head}\n<style>\n${css}\n</style>\n${g.html}${g.js ? `\n<script>\n${g.js}\n<\/script>` : ''}`;
    parts.push({ tab: 'Код для вставки', lang: 'html', code: single, file: 'puzzlebot-block.html' });
    notes.push('Все стили начинаются с .ps-p-' + project.pid + ' и не меняют остальную страницу' + (g.embed === 'fill' ? ', кроме фона: режим «На весь экран» намеренно перекрашивает фон страницы PuzzleBot.' : '.'));
    if (g.js) notes.push('В блоке есть <script>. Если поле PuzzleBot удаляет скрипты, выключите JavaScript выше: вкладки, аккордеон и модальные окна продолжат работать, копирование и таймер станут статичными.');
    if (g.feat.tg) notes.push('Действия Telegram (закрыть, передать данные) требуют, чтобы страница была открыта как Mini App и на ней был подключён telegram-web-app.js. Подключает ли его PuzzleBot — нужно проверить.');
  }
  if (o.minify && mode !== 'document') parts.forEach(p => { if (p.lang === 'html') p.code = p.code.replace(/\n\s*/g, ''); });
  return { parts, single, notes, gen: g };
}

/* ---------- ZIP без библиотек (метод STORE, без сжатия) ---------- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(buf) { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  for (const f of files) {
    const name = enc.encode(f.name);
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

/* ---------- Подсветка синтаксиса (лёгкая, без библиотек) ---------- */
function highlight(code, lang) {
  const out = [];
  let re;
  if (lang === 'css') re = /(\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*")|(@[a-z-]+)|([.#][a-zA-Z_][\w-]*)|([a-z-]+)(?=\s*:)|(#[0-9a-fA-F]{3,8}\b|-?\d*\.?\d+(?:px|%|rem|em|ms|s|vh|vw|dvh|deg)?)/g;
  else if (lang === 'js') re = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\b(var|function|return|if|else|for|new|typeof|true|false|null|document|window)\b|(\b\d+(?:\.\d+)?\b)/g;
  else re = /(<!--[\s\S]*?-->)|(<\/?[a-zA-Z][\w-]*)|(\s[\w-:]+)(?==)|("[^"]*")|(\/?>)|(\{\{[A-Za-z0-9_]+\}\})/g;
  const cls = lang === 'css' ? ['c', 's', 'k', 'sel', 'p', 'n'] : lang === 'js' ? ['c', 's', 'k', 'n'] : ['c', 't', 'a', 's', 't', 'v'];
  let last = 0, m;
  while ((m = re.exec(code))) {
    if (m.index > last) out.push(escHtml(code.slice(last, m.index)));
    let gi = 1; while (gi < m.length && m[gi] === undefined) gi++;
    out.push(`<span class="hl-${cls[gi - 1] || 'x'}">${escHtml(m[0])}</span>`);
    last = re.lastIndex;
    if (m[0] === '') re.lastIndex++;
  }
  out.push(escHtml(code.slice(last)));
  return out.join('');
}

/* ---------- Скачивание файлов ---------- */
function downloadBlob(blob, name) {
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) { console.error(e); return false; }
}
/* В артефакте Claude обычные ссылки на скачивание заблокированы — там используем
   разрешённую платформой возможность downloads (с подтверждением пользователя). */
let _dlCap;
async function dlCap() {
  if (_dlCap !== undefined) return _dlCap;
  try { _dlCap = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; } catch (e) { _dlCap = null; }
  return _dlCap;
}
async function saveFile(blob, name) {
  const dl = await dlCap();
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); return 'saved'; }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') return 'declined';
      if (c === 'rejected_extension' || c === 'extension_not_enabled') return 'ext';
      if (c === 'rate_limited') return 'busy';
      if (c !== 'unavailable' && c !== 'not_granted') return 'fail';
    }
  }
  return downloadBlob(blob, name) ? 'saved' : 'fail';
}
function saveMsg(st, name) {
  if (st === 'saved') return UI.toast('Скачивание: ' + name, { icon: 'download' });
  if (st === 'declined') return;
  if (st === 'ext') return UI.toast('Файл такого типа здесь не скачивается. Скопируйте код или скачайте ZIP-архив.', { err: true, ms: 5000 });
  if (st === 'busy') return UI.toast('Подтвердите предыдущее скачивание');
  UI.toast('Браузер заблокировал скачивание. Скопируйте код.', { err: true });
}

/* ============================================================
   08 · ХРАНИЛИЩЕ (IndexedDB с запасным режимом в памяти) и ИСТОРИЯ
   ============================================================ */
const Store = {
  db: null,
  mode: 'idb',
  error: '',
  mem: { projects: new Map(), media: new Map(), kv: new Map() },
  async init() {
    try {
      if (!('indexedDB' in window)) throw new Error('IndexedDB недоступен');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('puzzle-studio', 1);
        r.onupgradeneeded = () => {
          const db = r.result;
          if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('media')) db.createObjectStore('media', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'key' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error || new Error('Не удалось открыть базу'));
        r.onblocked = () => rej(new Error('База заблокирована другой вкладкой'));
        setTimeout(() => rej(new Error('Хранилище не ответило вовремя')), 4000);
      });
      // пробная запись — в некоторых встроенных окнах открытие проходит, а запись — нет
      await this.put('kv', { key: '_probe', value: Date.now() });
      this.mode = 'idb';
    } catch (e) {
      console.warn('Storage fallback:', e);
      this.mode = 'memory';
      this.error = e && e.message ? e.message : String(e);
      this.db = null;
    }
    return this.mode;
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode);
      const os = tx.objectStore(store);
      const req = fn(os);
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('Операция отменена'));
    });
  },
  async all(store) {
    if (this.mode === 'memory') return [...this.mem[store].values()].map(clone);
    return this._tx(store, 'readonly', os => os.getAll());
  },
  async get(store, id) {
    if (this.mode === 'memory') { const v = this.mem[store].get(id); return v ? clone(v) : undefined; }
    return this._tx(store, 'readonly', os => os.get(id));
  },
  async put(store, obj) {
    if (this.mode === 'memory') { this.mem[store].set(obj.id || obj.key, clone(obj)); return; }
    return this._tx(store, 'readwrite', os => os.put(obj));
  },
  async del(store, id) {
    if (this.mode === 'memory') { this.mem[store].delete(id); return; }
    return this._tx(store, 'readwrite', os => os.delete(id));
  },
  async kvGet(key, def) { try { const r = await this.get('kv', key); return r ? r.value : def; } catch (e) { return def; } },
  async kvSet(key, value) { try { await this.put('kv', { key, value }); } catch (e) { console.warn(e); } },
  async estimate() {
    try { if (navigator.storage && navigator.storage.estimate) return await navigator.storage.estimate(); } catch (e) {}
    return null;
  },
};

/* ---------- История изменений (Undo / Redo) ----------
   Хранит снимки {page, root}. Частые правки одного поля в течение
   ~0,9 с объединяются в один шаг, чтобы Undo не откатывал по букве. */
const History = {
  undo: [], redo: [], lastKey: null, lastTime: 0, limit: 120,
  reset() { this.undo = []; this.redo = []; this.lastKey = null; this.lastTime = 0; },
  snap(p) { return JSON.stringify({ page: p.page, root: p.root, name: p.name }); },
  before(project, label, key) {
    const now = Date.now();
    if (key && key === this.lastKey && now - this.lastTime < 900) { this.lastTime = now; return; }
    this.undo.push({ s: this.snap(project), label });
    if (this.undo.length > this.limit) this.undo.shift();
    this.redo = [];
    this.lastKey = key || null; this.lastTime = now;
  },
  breakGroup() { this.lastKey = null; },
  doUndo(project) {
    const e = this.undo.pop(); if (!e) return null;
    this.redo.push({ s: this.snap(project), label: e.label });
    this.lastKey = null;
    return { state: JSON.parse(e.s), label: e.label };
  },
  doRedo(project) {
    const e = this.redo.pop(); if (!e) return null;
    this.undo.push({ s: this.snap(project), label: e.label });
    this.lastKey = null;
    return { state: JSON.parse(e.s), label: e.label };
  },
};

const UI = {
  toast(text, opts = {}) {
    let host = $('.toasts');
    if (!host) { host = h('div', { class: 'toasts', role: 'status', 'aria-live': 'polite' }); document.body.append(host); }
    const t = h('div', { class: 'toast' + (opts.err ? ' err' : '') }, opts.err ? mascotImg('error', 30) : opts.icon === 'check' ? mascotImg('like', 30) : opts.icon === 'heart' ? mascotImg('heart', 30) : opts.icon ? ic(opts.icon, 16) : null, h('span', null, text),
      opts.action ? h('button', { onclick: () => { opts.action.fn(); t.remove(); } }, opts.action.label) : null);
    host.append(t);
    setTimeout(() => t.remove(), opts.ms || (opts.action ? 5000 : 2600));
  },

  dialog({ title, body, foot, cls = '', onClose, full }) {

  find(q, project) {

/* ---------- Медиатека ---------- */
const Media = {
  MAX_INPUT: 15 * 1024 * 1024,
  async add(file) {
    if (!file) return null;
    if (!/^image\/(png|jpeg|webp|gif|svg\+xml)$/.test(file.type)) { UI.toast('Поддерживаются PNG, JPG, WEBP, GIF и SVG', { err: true }); return null; }
    if (file.size > this.MAX_INPUT) { UI.toast('Файл больше 15 МБ — уменьшите его перед загрузкой', { err: true }); return null; }
    try {
      let dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
      let w = 0, hgt = 0;
      if (!/gif|svg/.test(file.type)) {
        const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Не удалось прочитать изображение')); i.src = dataUrl; });
        w = img.naturalWidth; hgt = img.naturalHeight;
        // уменьшаем большие фото: они попадут в код страницы
        const maxSide = 1600;
        if (w > maxSide || hgt > maxSide || file.size > 450 * 1024) {
          const k = Math.min(1, maxSide / Math.max(w, hgt));
          const c = document.createElement('canvas');
          c.width = Math.round(w * k); c.height = Math.round(hgt * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          let out = c.toDataURL('image/webp', 0.84);
          if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/jpeg', 0.85);
          if (out.length < dataUrl.length) { dataUrl = out; w = c.width; hgt = c.height; }
        }
      }
      const item = { id: 'm' + uid(9), name: file.name.slice(0, 80), type: file.type, size: Math.round(dataUrl.length * 0.75), w, h: hgt, dataUrl, createdAt: Date.now() };
      await Store.put('media', item);
      S.media.unshift(item);
      if (item.size > 300 * 1024) UI.toast(`Изображение весит ${fmtBytes(item.size)} — оно увеличит размер кода страницы`, { ms: 4500 });
      else UI.toast('Изображение добавлено', { icon: 'check' });
      return item;
    } catch (e) {
      console.error(e);
      UI.toast(e && e.name === 'QuotaExceededError' ? 'Нет места в хранилище браузера' : 'Не удалось загрузить изображение', { err: true });
      return null;
    }
  },
  async remove(id) {
    await Store.del('media', id);
    S.media = S.media.filter(m => m.id !== id);
  },
};

/* ---------- Миниатюры: настоящая страница в Shadow DOM (стили изолированы) ---------- */
function thumbInto(host, project, width = 390) {
  host.innerHTML = '';
  const inner = h('div', { class: 'thumb-host', style: { width: width + 'px' } });
  host.append(inner);
  const sr = inner.attachShadow ? inner.attachShadow({ mode: 'open' }) : null;
  const g = safe(() => generate(project, { mode: 'export', js: false, varMode: 'sample', noAnim: true, pretty: false, embed: 'doc' }), null);
  if (!g) { host.append(h('div', { class: 'empty' }, ic('alert', 20))); return; }
  App.ensureFonts(g.fonts);
  const html = `<style>${g.css} .ps-root{min-height:0!important} .ps-bnav--sticky{position:static!important}</style>${g.html}`;
  if (sr) sr.innerHTML = html; else inner.innerHTML = html;
  const fit = () => { const k = host.clientWidth / width; inner.style.transform = `scale(${k || 0.5})`; };
  fit();
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(host);
}

   Документация: https://help.puzzle.bot/vhodyaschie-zaprosy-api
   Адрес: https://api.puzzlebot.top/ , параметры token, method, platform.
   Токен запрашивается у пользователя, хранится только в этом браузере,
   отправляется только на api.puzzlebot.top и НИКОГДА не попадает в экспорт.
   ============================================================ */
const PB_ERR = {
  1: 'Неверный формат токена', 2: 'Неверный формат метода', 3: 'Токен не найден — проверьте ключ в PuzzleBot', 4: 'Неизвестный метод',
  40: 'Не передан ID чата или пользователя', 100: 'Внутренняя ошибка PuzzleBot', 102: 'Ошибка вычисления', 104: 'Переменная не найдена',
  200: 'Команда не найдена', 201: 'Пользователь не найден', 429: 'Превышен лимит запросов (120 в минуту)',
};
const PB = {
  token: '', platform: 'tg', remember: false, status: 'off', note: '',
  load() {
    try {
      const l = localStorage.getItem('ps-pb'), s = sessionStorage.getItem('ps-pb');
      const d = JSON.parse(s || l || 'null');
      if (d && d.token) { this.token = d.token; this.platform = d.platform === 'max' ? 'max' : 'tg'; this.remember = !!l; this.status = 'saved'; }
    } catch (e) {}
  },
  save() {
    const d = JSON.stringify({ token: this.token, platform: this.platform });
    try { sessionStorage.setItem('ps-pb', d); } catch (e) {}
    try { if (this.remember) localStorage.setItem('ps-pb', d); else localStorage.removeItem('ps-pb'); } catch (e) {}
  },
  forget() {
    this.token = ''; this.status = 'off'; this.note = '';
    try { sessionStorage.removeItem('ps-pb'); localStorage.removeItem('ps-pb'); } catch (e) {}
  },
  async call(method, params = {}) {
    if (!this.token) throw { code: 'no_token', message: 'Сначала подключите PuzzleBot (нужен API-токен)' };
    const body = new URLSearchParams({ token: this.token, method, platform: this.platform });
    for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== null && v !== '') body.set(k, String(v));
    let r;
    try {
      // POST с обычной формой: токен не попадает в адресную строку и журналы
      r = await fetch('https://api.puzzlebot.top/', { method: 'POST', body });
    } catch (e) {
      throw { code: 'network', message: 'Не удалось связаться с api.puzzlebot.top. Причины: нет интернета, сервер не разрешает запросы с веб-страниц (CORS) или окно, где открыт редактор, блокирует сеть (например, просмотр внутри Claude). Попробуйте открыть Puzzle Studio как отдельный файл.' };
    }
    if (r.status === 429) throw { code: 429, message: PB_ERR[429] };
    let j;
    try { j = await r.json(); } catch (e) { throw { code: 'bad', message: 'Ответ сервера не в формате JSON (HTTP ' + r.status + ')' }; }
    if (j && j.code !== undefined && j.code !== 0) throw { code: j.code, message: PB_ERR[j.code] || ('PuzzleBot вернул ошибку, код ' + j.code), raw: j };
    if (j && j.ok === false) throw { code: j.error_code || 'error', message: j.description || 'PuzzleBot вернул ошибку', raw: j };
    return j;
  },
};

/* Поиск списка товаров в ответе без предположений о точной схеме:
   формат ответа getShop2ItemsList в документации не описан. */
function pbExtractItems(j) {
  const cand = [j && j.data, j && j.result, j];
  for (const c of cand) {
    if (Array.isArray(c)) return c;
    if (c && typeof c === 'object') for (const v of Object.values(c)) if (Array.isArray(v) && v.length && typeof v[0] === 'object') return v;
  }
  return [];
}
function pbItemFields(it) {
  const pick = (...ks) => { for (const k of ks) if (it[k] !== undefined && it[k] !== null && it[k] !== '') return it[k]; return ''; };
  let img = pick('image', 'image_url', 'photo', 'photo_url', 'img', 'picture', 'preview');
  if (!img && Array.isArray(it.images) && it.images.length) img = typeof it.images[0] === 'string' ? it.images[0] : (it.images[0].url || '');
  if (img && typeof img === 'object') img = img.url || '';
  const price = pick('price', 'cost', 'sum', 'amount');
  const cur = pick('currency', 'currency_code');
  return { name: String(pick('name', 'title', 'item_name')).slice(0, 120), price: price === '' ? '' : String(price) + (cur ? ' ' + (cur === 'RUB' ? '₽' : cur) : ''), image: String(img || ''), desc: String(pick('description', 'desc', 'text')).slice(0, 300) };
}

/* ============================================================
   MCP-сервер PuzzleBot: https://cp.puzzlebot.top/mcp
   Документация: help.puzzle.bot (раздел «MCP»). Авторизация — Bearer <API-токен>.
   Протокол — MCP Streamable HTTP (JSON-RPC 2.0, ответ JSON или SSE).
   Схемы инструментов берём из tools/list, а не угадываем.
   ============================================================ */
const PBMCP = {
  url: 'https://cp.puzzlebot.top/mcp', sid: '', tools: null, seq: 1,
  parse(text, ctype) {
    if (/event-stream/.test(ctype || '') || /^\s*(event|data):/m.test(text)) {
      const msgs = [];
      for (const block of text.split(/\r?\n\r?\n/)) {
        const data = block.split(/\r?\n/).filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('\n');
        if (data) try { msgs.push(JSON.parse(data)); } catch (e) {}
      }
      return msgs.find(m => m && (m.result !== undefined || m.error)) || msgs[msgs.length - 1] || null;
    }
    try { return JSON.parse(text); } catch (e) { return null; }
  },
  async rpc(method, params, notify = false) {
    if (!PB.token) throw { code: 'no_token', message: 'Сначала укажите API-токен PuzzleBot' };
    const body = { jsonrpc: '2.0', method };
    if (params !== undefined) body.params = params;
    if (!notify) body.id = this.seq++;
    const headers = { 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream', Authorization: 'Bearer ' + PB.token };
    if (this.sid) headers['Mcp-Session-Id'] = this.sid;
    let r;
    try { r = await fetch(this.url, { method: 'POST', headers, body: JSON.stringify(body) }); }
    catch (e) { throw { code: 'network', message: 'Нет связи с cp.puzzlebot.top/mcp. Скорее всего сервер не разрешает запросы со сторонних страниц (CORS) — тогда подключайте MCP из Claude, Cursor или другого MCP-клиента. Также возможно: нет интернета или окно редактора блокирует сеть.' }; }
    const s = r.headers.get('Mcp-Session-Id'); if (s) this.sid = s;
    if (r.status === 401 || r.status === 403) throw { code: r.status, message: 'MCP отклонил токен (HTTP ' + r.status + '). Проверьте API-токен и что MCP включён в PuzzleBot.' };
    if (notify) return null;
    const txt = await r.text();
    const j = this.parse(txt, r.headers.get('Content-Type'));
    if (!r.ok && !j) throw { code: r.status, message: 'MCP ответил HTTP ' + r.status };
    if (!j) throw { code: 'bad', message: 'Не удалось разобрать ответ MCP' };
    if (j.error) throw { code: j.error.code, message: 'MCP: ' + (j.error.message || 'ошибка') };
    return j.result;
  },
  async connect() {
    this.sid = ''; this.tools = null;
    const init = await this.rpc('initialize', { protocolVersion: '2025-03-26', capabilities: {}, clientInfo: { name: 'puzzle-studio', version: '1.0' } });
    try { await this.rpc('notifications/initialized', undefined, true); } catch (e) {}
    const tl = await this.rpc('tools/list', {});
    this.tools = (tl && tl.tools) || [];
    return { server: (init && init.serverInfo) || {}, tools: this.tools };
  },
  tool(name) { return (this.tools || []).find(t => t.name === name); },
  /* Подбираем аргументы по inputSchema: известные значения + первый обязательный текстовый параметр для text */
  args(name, known = {}, text) {
    const t = this.tool(name); const sc = (t && t.inputSchema) || {};
    const props = sc.properties || {}, req = sc.required || [];
    const a = {};
    for (const [k, v] of Object.entries(known)) if (props[k] || !Object.keys(props).length) a[k] = v;
    if (text !== undefined) {
      const names = Object.keys(props);
      const pref = ['message', 'prompt', 'task', 'query', 'text', 'instruction', 'request', 'content'];
      const key = pref.find(p => props[p]) || req.find(k => (props[k] || {}).type === 'string' && !(k in a)) || names.find(k => (props[k] || {}).type === 'string' && !(k in a)) || 'message';
      a[key] = text;
    }
    const missing = req.filter(k => !(k in a));
    return { a, missing, schema: sc };
  },
  async call(name, known, text) {
    if (!this.tools) await this.connect();
    if (!this.tool(name)) throw { code: 'no_tool', message: `На сервере нет инструмента ${name}. Доступно: ${(this.tools || []).map(t => t.name).join(', ') || '—'}` };
    const { a, missing } = this.args(name, known, text);
    if (missing.length) throw { code: 'args', message: `Инструменту ${name} нужны параметры: ${missing.join(', ')}` };
    const r = await this.rpc('tools/call', { name, arguments: a });
    const txt = ((r && r.content) || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
    if (r && r.isError) throw { code: 'tool', message: txt || 'Инструмент вернул ошибку' };
    let data = r && r.structuredContent; if (!data) try { data = JSON.parse(txt); } catch (e) {}
    return { text: txt, data, raw: r };
  },
};
function pbFindKey(o, re, depth = 0) {
  if (!o || typeof o !== 'object' || depth > 4) return undefined;
  for (const [k, v] of Object.entries(o)) { if (re.test(k) && (typeof v === 'string' || typeof v === 'number')) return v; }
  for (const v of Object.values(o)) { const r = pbFindKey(v, re, depth + 1); if (r !== undefined) return r; }
  return undefined;
}
function pbVarList(data, text) {
  const arr = Array.isArray(data) ? data : (pbExtractItems(data) || []);
  const out = [];
  for (const it of arr) {
    const key = typeof it === 'string' ? it : (it.name || it.key || it.variable || it.title);
    if (key && /^[A-Za-z0-9_]{1,40}$/.test(String(key))) out.push({ key: String(key), desc: String((it && (it.description || it.desc || it.type)) || 'Переменная проекта PuzzleBot').slice(0, 120), sample: String((it && (it.value ?? it.default ?? '')) || '').slice(0, 200) });
  }
  if (!out.length && text) for (const m of text.matchAll(/\{\{\s*([A-Za-z0-9_]{1,40})\s*\}\}|^[\s\-•*]*([A-Za-z][A-Za-z0-9_]{1,39})\b/gm)) { const k = m[1] || m[2]; if (k && !out.some(x => x.key === k)) out.push({ key: k, desc: 'Переменная проекта PuzzleBot', sample: '' }); }
  return out;
}

          if (code.length > 900000) throw { message: 'Код больше 900 КБ — агент PuzzleBot принимает вёрстку до 1 МБ. Уменьшите картинки (загрузите их по ссылке).' };

          const task = `Добавь в мини-приложение${gid ? ` на страницу с ID ${gid}` : ''} ${mode.v === 'head' ? 'код из первой части в поле «HTML в head» настроек мини-приложения, а разметку из второй части — новым блоком «HTML код»' : 'новый блок «HTML код» с кодом ниже, без изменений'}. Переменные вида {{ИМЯ}} оставь как есть. Сохрани как черновик и ничего не публикуй.\n\nСтраница: «${S.project.name}» (сделано в Puzzle Studio).\n\n${code}`;
          const r = await PBMCP.call('puzzlebot_agent', {}, task);
          const turn = pbFindKey(r.data, /turn|task_?id|job/i);
          out(r.text || JSON.stringify(r.data, null, 2));
          if (!turn || !PBMCP.tool('get_turn_status')) { show('✓ Отправлено агенту PuzzleBot'); return; }
          for (let i = 0; i < 40; i++) {
            show(`Агент работает… (${i * 3} с)`);
            await new Promise(res => setTimeout(res, 3000));
            const k = Object.keys((PBMCP.tool('get_turn_status').inputSchema || {}).properties || {})[0] || 'turn_id';
            const s = await PBMCP.call('get_turn_status', { [k]: turn });
            const status = String(pbFindKey(s.data, /^status$|state/i) || '');
            out(s.text || JSON.stringify(s.data, null, 2));
            if (/done|complete|finish|success|ready|error|fail/i.test(status)) { const ok = !/error|fail/i.test(status); show(ok ? '✓ Агент закончил — черновик в PuzzleBot' : 'Агент сообщил об ошибке', !ok); if (ok) Puzzlo.mood && Puzzlo.mood('like'); return; }
          }
          show('Агент ещё работает — проверьте результат в PuzzleBot позже');
        }) }, ic('send', 14), 'Отправить в PuzzleBot'),
      ],
    });
  },
});

**Если успешно** и **Если нет** — любое действие: переход на другую страницу Mini App (\`goto_web_page\` или \`gotoWebPage\`), другой экран проекта, сообщение, шторка, показать блок.

Пример: проверить Face ID → успех: «Другая Mini App» с ID закрытого раздела → отказ: сообщение «Доступ только после подтверждения».

Вне Telegram проверки идут по ветке «Если нет».` },
  { id: 'backbtn', cat: 'telegram', title: 'Кнопка «Назад» Telegram', body: `У Telegram есть своя кнопка «Назад» в шапке Mini App (BackButton). Puzzle Studio умеет её включать.

## Как включить
1. Ничего не выбирайте на холсте → панель «Страница».
2. Раздел **«Кнопка «Назад» Telegram»** → включите переключатель.
3. Выберите, что она делает:
   - **Назад (предыдущая страница или экран)** — вернуться туда, откуда пришёл пользователь; если некуда — закрыть Mini App;
   - **Перейти на экран проекта**, **Страница Mini App PuzzleBot**, **Другая Mini App** — конкретное место;
   - любое другое действие: сообщение, шторка, закрыть Mini App.

## Как работает
- Если открыта шторка, «Назад» сначала закрывает её. Это работает даже без включения кнопки — пока шторка открыта, «Назад» появляется сам.
- В режиме «Все экраны в одном блоке» «Назад» возвращает на предыдущий экран без перезагрузки.
- На мокапе в шапке видно «‹ Назад».
- Нужен Telegram 6.1 или новее. Вне Telegram кнопки нет — используйте обычную кнопку с действием «Назад».

Такое же действие **«Назад (предыдущая страница или экран)»** есть у обычных кнопок в группе «Переходы».` },
  { id: 'mainbtn', cat: 'telegram', title: 'Кнопка внизу экрана (MainButton)', body: `Любую кнопку можно закрепить внизу: выберите её → «Контент» → **«Закрепить внизу экрана»**.

- В Telegram появится его кнопка MainButton с тем же текстом. Нажатие повторит действие вашей кнопки.
- «Скрыть эту кнопку на странице» — чтобы не было двух одинаковых кнопок.
- Цвет берётся у вашей кнопки или из темы Telegram.
- Telegram показывает одну такую кнопку — если закрепили несколько, сработает первая.

На мокапе кнопка видна внизу телефона. Вне Telegram она остаётся обычной кнопкой на странице.` },
  { id: 'sheets', cat: 'editor', title: 'Шторки, скрытые блоки и взаимодействия', body: `## Шторка
Панель, которая выезжает снизу. Блок «Кнопка + шторка» создаёт кнопку и шторку сразу.

- Шторка — **отдельная рабочая область**: вкладка с её названием над мокапом.
- Закрыть можно крестиком, касанием снаружи, потянув за чёлку вниз или кнопкой с действием «Закрыть шторку».

## Взаимодействие блоков
Действия группы «Элементы страницы»: открыть или закрыть шторку, показать, скрыть, показать/скрыть блок, прокрутить наверх.

Чтобы блок был скрыт до нажатия: выберите его → «Настройки» → «Дополнительно» → **«Скрыт, пока не покажут»**. Готовый пример — «Кнопка “Подробнее” + скрытый текст».` },
  { id: 'qr', cat: 'editor', title: 'QR-код', body: `Блок «QR-код» (раздел «Картинки и медиа»). После добавления вставьте ссылку — картинку построит сервис api.qrserver.com.

- Размер — ползунком от 80 до 600 px, ещё цвет, фон и поля.
- Можно вставить переменную: \`https://t.me/бот?start={{USER_ID}}\` — у каждого пользователя будет свой код.` },
  { id: 'emoji', cat: 'telegram', title: 'Эмодзи-статус и ID премиум-эмодзи', body: `Действие «Установить эмодзи-статус» просит ID премиум-эмодзи (custom_emoji_id).

Как его получить: отправьте нужный эмодзи боту **@premoji_puzzlebot** — он пришлёт ID. Вставьте его в поле действия.

[[Открыть @premoji_puzzlebot|url:https://t.me/premoji_puzzlebot]]` },
  { id: 'tgtheme', cat: 'telegram', title: 'Цвета под тему Telegram', body: `Тема **«Telegram (авто)»** берёт цвета из Telegram пользователя: светлая или тёмная тема, фирменный цвет кнопок. При смене темы в Telegram страница перекрашивается сама.

Тема **«Авто: светлая / тёмная»** переключается по настройке телефона.

Совет: с темой «Telegram (авто)» в PuzzleBot не включайте «Задать фон» — фон совпадёт автоматически.

[[Настройки страницы|page]]` },

  { id: 'cart', cat: 'shop', title: 'Корзина и оформление заказа', body: `## Быстрый старт
1. Каталог → «Магазин» → **«Корзина в шторке»**: появится счётчик корзины, который открывает шторку с корзиной.
2. Кнопкам товаров дайте действие **«Добавить в корзину»** (группа «Элементы страницы») или возьмите блок «Кнопка «В корзину»».
3. Если поля действия пустые, название берётся из заголовка карточки, а цена — из текста с ₽ / $ / €. Поэтому кнопка работает и в «Списке из NocoDB».

## Оформление заказа
Блок «Корзина» → «Что делать при оформлении»:
- **Передать заказ боту (sendData)** — JSON заказа придёт боту. Работает, если Mini App открыт кнопкой клавиатуры бота.
- **Вебхук** — POST JSON на ваш сервер.
- **Записать в таблицу NocoDB** — строка с колонками «Заказ», «Сумма», «Пользователь». [Подробнее](kb:ncwrite)
- **Открыть бота с кодом заказа** — t.me/бот?start=order_….

Корзина хранится в браузере пользователя и общая для всех экранов проекта. Сумма считается на странице — проверяйте её на стороне бота.` },
  { id: 'blocks-new', cat: 'shop', title: 'Квиз, слайдер, поиск, карта', body: `## Квиз / опрос
Каталог → «Формы» → «Квиз / опрос». Вопросы с 2–4 ответами; «Правильный ответ» 0 — опрос без правильных. Порог в % решает, какой результат показать. Результат можно передать боту (sendData).

## Слайдер баннеров
«Картинки и медиа» → «Слайдер баннеров». Слайды листаются пальцем и сами по таймеру, у каждого может быть ссылка.

## Поиск по списку
«Данные и списки» → «Поиск по списку». Выберите, какой контейнер или «Список из NocoDB» фильтровать. Категории через запятую — кнопки-фильтры по слову в карточке.

## Карта
«Картинки и медиа» → «Карта». Адрес (можно с переменной), Яндекс или Google, приближение, высота и кнопка «Проложить маршрут». На холсте показана заглушка, сама карта — в «Просмотре» и в Telegram.` },
  { id: 'langs', cat: 'shop', title: 'Несколько языков', body: `Пишите варианты прямо в любом текстовом поле:

\`[ru]Купить[en]Buy[uk]Купити\`

- Пользователь увидит язык своего Telegram. Если такого варианта нет — первый.
- На холсте язык выбирается в панели «Страница» → «Языки».
- Работает в текстах, кнопках, подсказках полей, пунктах списков.` },
  { id: 'cond', cat: 'shop', title: 'Условия показа по переменным', body: `Блок → «Настройки» → «Дополнительно» → **«Показывать, только если переменная PuzzleBot…»**.

Примеры:
- \`VIP\` равна «да» — блок только для VIP;
- \`BALANCE\` больше 0 — кнопка «Вывести»;
- \`PHONE\` пустая — форма «Оставьте телефон».

В редакторе такой блок обведён фиолетовым пунктиром. Значение подставляет PuzzleBot, проверка идёт на странице — для секретных данных это не защита, а удобство.` },
  { id: 'ncwrite', cat: 'integr', title: 'Запись в NocoDB из формы и корзины', body: `Форма → «Что делать с данными» → **«Записать строку в NocoDB»** → ID таблицы. Имена полей формы должны совпадать с названиями колонок. «Колонка для ID пользователя Telegram» — куда записать ID того, кто отправил.

Корзина в режиме NocoDB пишет колонки «Заказ» (JSON), «Сумма», «Пользователь».

## Важно
Для записи токену нужны права редактора — а токен виден в коде страницы. Любой пользователь сможет добавлять и менять строки. Используйте отдельную базу только для заявок и токен пользователя с ролью Editor только в ней. Надёжнее — вебхук на свой сервер или исходящий запрос PuzzleBot.` },
  { id: 'presets', cat: 'editor', title: 'Стиль-шаблоны', body: `Один стиль на много блоков — как классы в CSS.

1. Оформите блок (цвет, отступы, скругление, шрифт).
2. «Настройки» → **«Стиль-шаблон»** → «Создать из этого блока».
3. У других блоков выберите этот шаблон в том же списке.

Чтобы изменить все блоки сразу: поменяйте стиль у любого блока с шаблоном и нажмите «Обновить шаблон». «Отвязать» — блок сохранит вид, но перестанет зависеть от шаблона. Шаблоны общие для всех экранов проекта.` },
  { id: 'quality', cat: 'editor', title: 'Проверка качества и заметки', body: `## Проверка качества
Меню «⋯» → **«Проверка качества»** (или скажите Puzzlo «проверь страницу»). Проверяются все экраны: мелкий шрифт, плохой контраст, маленькие кнопки, кнопки без действия, картинки без описания, пустые ссылки, тяжёлые картинки, несколько H1. Оценка от 0 до 100. «Исправить автоматически» чинит то, что можно, — отменяется через Ctrl+Z.

## Заметки
Блок → «Контент» → **«Заметка»**. Видна только в редакторе: на холсте значок 💬. Все заметки — меню «⋯» → «Заметки».` },
  { id: 'versions', cat: 'projects', title: 'Версии, мои шаблоны и облако', body: `## История версий
Каждое «Применить» сохраняет версию (до 30 последних). Меню «⋯» → **«История версий»**: открыть версию как черновик или скачать её JSON.

## Мои шаблоны
Меню «⋯» → **«Сохранить как мой шаблон»**. Шаблон появится в «Шаблоны» → «Мои шаблоны». Его можно скачать файлом и отправить другому человеку.

## Облако NocoDB
Меню «⋯» → **«Облако NocoDB»**. Создайте таблицу «Проекты» с колонками project_id, name, data (длинный текст), updated. Укажите ID таблицы и токен — проект сохранится в NocoDB и откроется на любом устройстве. Можно включить отправку при каждом «Применить». Токен облака хранится только в браузере и не попадает в код страниц.` },
  { id: 'testkit', cat: 'puzzlebot', title: 'Тестовый набор для PuzzleBot', body: `Меню «⋯» → **«Тестовый набор для PuzzleBot»**. Создаётся проект из двух экранов, где каждый пункт проверяет одну функцию в настоящем мини-приложении:

1. данные пользователя Telegram и переменные PuzzleBot;
2. вибрация и окна Telegram;
3. шторка и закрытие кнопкой «Назад»;
4. переход между экранами и действие после перехода;
5. goto_web_page и gotoWebPage() (если указали ссылку на вторую страницу);
6. кнопка внизу экрана (MainButton) и кнопка «Назад» Telegram.

Экспортируйте, вставьте в PuzzleBot, откройте в Telegram и отметьте, что сработало. Это быстрый способ узнать, какие функции поддерживает ваш PuzzleBot.` },
  { id: 'vars-how', cat: 'vars', title: 'Переменные PuzzleBot', body: `Переменные пишутся в двойных фигурных скобках: \`{{FIRST_NAME_TEXT}}\`. PuzzleBot подставляет значения, когда показывает страницу.

- Начните вводить \`{{\` в любом поле или прямо на холсте — появится подсказка.
- Варианты с пометкой «ссылкой» PuzzleBot может подставить как ссылку. Для текста берите варианты \`_TEXT\`.
- Свои переменные (например, \`{{BALANCE}}\`) сначала создайте в PuzzleBot → «Переменные», затем добавьте в справочник редактора.

[[Справочник переменных|vars]]` },

  { id: 'export', cat: 'puzzlebot', title: 'Как вставить страницу в PuzzleBot', body: `1. В Puzzle Studio нажмите «Экспорт» → режим «PuzzleBot: один блок» → «Копировать код».
2. В PuzzleBot: Конструктор → мини-приложение → «Контент» → «Добавить новый блок» → **«HTML код»**.
3. Вставьте код и сохраните.
4. Откройте мини-приложение в Telegram на телефоне.

## Если страниц много
Режим **«PuzzleBot: head + блок»**: стили и скрипт вставьте один раз в настройках мини-приложения (HTML в head), а в блоки «HTML код» — только разметку. Код блока станет короче.

## Переход на другую страницу
Действие «Страница Mini App PuzzleBot» делает \`<a goto_web_page="ID">\`. Включите «Открыть в новом окне» — тогда используется функция PuzzleBot \`gotoWebPage("ID", true)\`.

PuzzleBot вставляет код блока внутрь \`<body>\` своей страницы — поэтому все стили Puzzle Studio изолированы классом \`.ps-p-…\`.

[[Открыть экспорт|export]] [[Фон и белые поля|kb:bg]]` },
  { id: 'bg', cat: 'puzzlebot', title: 'Фон и белые поля вокруг блока', body: `У страницы PuzzleBot свой фон и отступы. Чтобы не было «острова» на белом фоне, выберите режим в «Странице» → «Размещение в PuzzleBot»:
- **Без фона** — блок прозрачный. В PuzzleBot включите «Задать фон» и вставьте цвет, который покажет редактор.
- **Фон у блока** — блок как карточка.
- **На весь экран** — блок перекрашивает страницу PuzzleBot и шапку Telegram.

С темой «Telegram (авто)» фон обычно совпадает без настроек.

[[Настройки страницы|page]]` },
  { id: 'platforms', cat: 'puzzlebot', title: 'Отдельно для iOS и Android', body: `PuzzleBot умеет показывать элементы только на одной платформе с помощью классов \`block_ios\` и \`block_android\`.

В Puzzle Studio: блок → «Настройки» → «Дополнительно» → «Показывать на». Редактор добавит нужный класс: блок «Только iOS» получит \`block_android\` (скрыть на Android), и наоборот.

## Ещё в «Дополнительно»
- поворот и сдвиг, слой (z-index), пропорции;
- «прилипание» при прокрутке, обрезка или прокрутка содержимого;
- тень текста, режим наложения, запрет выделения;
- свой CSS для блока — только пары «свойство: значение».` },

  { id: 'connect', cat: 'integr', title: 'Подключение к PuzzleBot: API и MCP', body: `Подключение по желанию: страницы делаются и без него.

## Что даёт
- переменные проекта и товары магазина в редакторе;
- отправка готовой страницы агенту PuzzleBot — он создаёт черновик в боте;
- значения переменных для предпросмотра.

## Токен
PuzzleBot → Настройки → Интеграции → «Входящие запросы» → сгенерировать API-ключ. Если ключ уже используется, не генерируйте новый — старые интеграции перестанут работать.

Токен хранится только в браузере и никогда не попадает в код страницы.

## MCP
PuzzleBot даёт MCP-сервер \`cp.puzzlebot.top/mcp\` с тем же токеном. Puzzle Studio через него:
1. загружает переменные проекта (\`list_variables\`) в «Мои переменные»;
2. ищет ответы в справке PuzzleBot (\`help_search\`);
3. передаёт страницу агенту PuzzleBot (\`puzzlebot_agent\`) — он сохраняет изменения **как черновик**.

Если браузер не пускает запрос (CORS), подключите тот же MCP в Claude или Cursor и передайте агенту код из экспорта.

[[Подключить PuzzleBot|pb]] [[PuzzleBot MCP|mcp]]` },
  { id: 'nocodb', cat: 'integr', title: 'NocoDB: данные из таблиц на странице', body: `Выводите на страницу строки из NocoDB: товары, цены, картинки, заказы пользователя.

## Что понадобится
1. **Адрес NocoDB** — для NocoDB от PuzzleBot: \`https://nocodb.puzzlebot.top\`.
2. **API-токен** — NocoDB → аватар слева внизу → Account settings → Tokens → Create token.
3. **ID таблицы** — таблица → «⋯» → Copy table ID. Или нажмите «Выбрать из базы» — Puzzle Studio покажет базы и таблицы сам.

## Источник данных
Источник — это запрос к одной таблице: какие строки взять (условия), в каком порядке и сколько. В условиях можно писать переменные PuzzleBot: \`(Владелец = {{USER_ID}})\` — только строки этого пользователя.

Нажмите «Проверить запрос» — увидите первые строки, они же покажутся на холсте.

## Как вывести данные
- В любом тексте: \`#{Источник.Поле}\`. При вводе «#{» появится подсказка с названиями полей.
- Картинка: в поле «Изображение» вставьте \`#{Товары.Фото}\` (поле-вложение).
- **Список из NocoDB** — блоки внутри повторяются для каждой строки.
- **Таблица из NocoDB** — колонки из выбранных полей.
- Вкладка «NocoDB» слева: нажмите на поле — оно вставится в выбранный текст.

## Безопасность
Токен попадает в код страницы, и его может увидеть любой пользователь Mini App. Создайте в NocoDB отдельного пользователя с ролью **Viewer** (только чтение) и токен от его имени. Если данные секретные, лучше получать их на стороне PuzzleBot (исходящие запросы → переменные) и выводить через \`{{ПЕРЕМЕННАЯ}}\`.

Запрос в коде страницы: \`GET {адрес}/api/v2/tables/TABLE_ID/records\` с заголовком \`xc-token\`.` },
  { id: 'forms', cat: 'integr', title: 'Формы и вебхуки', body: `Блок «Форма» умеет:
- показать сообщение «Спасибо»;
- отправить данные на ваш вебхук (POST JSON) — поля формы, данные пользователя Telegram и initData;
- передать данные боту через sendData (только если Mini App открыт кнопкой клавиатуры).

Проверяйте initData на своём сервере: данные из браузера можно подделать.` },

  { id: 'ai-how', cat: 'ai', title: 'Что умеет Puzzlo AI', body: `Puzzlo — помощник внутри редактора. Он работает **без интернета и без нейросети**: понимает запросы по ключевым словам и собирает страницы из шаблонов и секций.

## Примеры запросов
- «Создай магазин с товарами в тёмном стиле»
- «Сделай страницу тарифов с FAQ и отзывами»
- «Добавь таймер и кнопку поделиться»
- «Сделай зелёным», «Поменяй тему на Telegram»
- «Добавь товары: Футболка 999 ₽, Кружка 490 ₽»
- «Удали FAQ», «Назови страницу Акция»

Каждое действие можно отменить кнопкой «Отменить» или Ctrl+Z.

## Как это выглядит
- Пока Puzzlo «думает», видны три точки.

const KBView = {

  },
  renderBody(src) {
    const wrap = h('div', { class: 'kb-body' });
    const inline = s => {
      const frag = [];
      const re = /\*\*(.+?)\*\*|`([^`]+)`|\[([^\]]+)\]\(kb:([a-z0-9-]+)\)/g;
      let last = 0, m;
      while ((m = re.exec(s))) {
        if (m.index > last) frag.push(s.slice(last, m.index));
        if (m[1]) frag.push(h('strong', null, m[1]));
        else if (m[2]) frag.push(h('code', null, m[2]));
        else frag.push(h('a', { href: '#', onclick: e => { e.preventDefault(); this.art = m[4]; Home.render(); } }, m[3]));
        last = re.lastIndex;
      }
      if (last < s.length) frag.push(s.slice(last));
      return frag;
    };
    let list = null, listTag = '';
    for (const raw of src.split('\n')) {
      const line = raw.trimEnd();
      const btns = [...line.matchAll(/\[\[([^|\]]+)\|([^\]]+)\]\]/g)];
      if (btns.length) {
        list = null;
        wrap.append(h('div', { class: 'kb-actions' }, btns.map(b => h('button', { class: 'btn ' + (b[2].startsWith('kb:') ? '' : 'primary'), onclick: () => App.go(b[2]) }, b[2].startsWith('kb:') ? ic('book', 15) : ic('arrow-right', 15), b[1]))));
        continue;
      }
      if (!line.trim()) { list = null; continue; }
      if (line.startsWith('## ')) { list = null; wrap.append(h('h2', null, inline(line.slice(3)))); continue; }
      const li = line.match(/^(- |\d+\. )(.*)$/);
      if (li) {
        const tag = li[1] === '- ' ? 'ul' : 'ol';
        if (!list || listTag !== tag) { list = h(tag); listTag = tag; wrap.append(list); }
        list.append(h('li', null, inline(li[2])));
        continue;
      }
      list = null;
      wrap.append(h('p', null, inline(line)));
    }
    return wrap;
  },

/* Текст ответа → абзацы и списки; caret — мигающий курсор печати */
function pzFill(body, text, caret) {
  body.innerHTML = '';
  let list = null, last = null;
  for (const line of String(text).split('\n')) {
    if (/^- /.test(line)) { if (!list) { list = h('ul'); body.append(list); } last = h('li', null, line.slice(2)); list.append(last); }
    else { list = null; if (line.trim()) { last = h('p', null, line); body.append(last); } }
  }
  if (caret) (last || body).append(h('span', { class: 'pz-caret' }));
}

const PuzzloAI = {
  norm(t) { return String(t || '').toLowerCase().replace(/ё/g, 'е'); },
  quoted(t) { const m = t.match(/[«"“„]([^»"”]{1,80})[»"”]/); return m ? m[1].trim() : ''; },
  products(t) {
    const out = [];
    const re = /([A-Za-zА-Яа-яЁё0-9][A-Za-zА-Яа-яЁё0-9 .\-«»"]{1,40}?)\s*[—\-:–,]?\s*(\d[\d\s]{0,8})\s*(₽|руб\.?|р\.|rub|\$|€|звезд|stars)/gi;
    let m;
    while ((m = re.exec(t))) {
      const name = m[1].replace(/^(товар[ыа]?|добавь|добавить|с|и)\s+/i, '').replace(/[«»"]/g, '').trim();
      if (name && !/^(за|по|от|до)$/i.test(name)) out.push({ name: name.charAt(0).toUpperCase() + name.slice(1), price: m[2].replace(/\s+/g, ' ').trim() + ' ' + (/\$|€/.test(m[3]) ? m[3] : /звезд|stars/i.test(m[3]) ? '⭐' : '₽') });
    }
    return out.slice(0, 24);
  },
  /* «магазин кроссовок», «школа английского» → заголовок страницы */
  subject(text) {
    const m = String(text).match(/(магазин|школ[аыу]|салон|клуб|курс|студи[яю]|кофейн[яю]|ресторан|бар|сервис|канал|бот|академи[яю]|центр|агентств[оа]|кабинет|лендинг|страниц[ау])\s+((?:[A-Za-zА-Яа-яЁё0-9-]+\s?){1,4})/i);
    if (!m) return '';
    const stop = /^(в|во|с|со|на|для|и|из|тёмн|темн|светл|зел|син|красн|фиолет|оранж|товар|тема|теме|цвет|с)$/i;
    const words = m[2].trim().split(/\s+/); const keep = [];
    for (const w of words) { if (stop.test(w) || /^(т[её]мн|светл|зел[её]н|син|красн|фиолет|оранж|розов|ж[её]лт)/i.test(w)) break; keep.push(w); }
    if (!keep.length) return '';
    const head = m[1].toLowerCase().replace(/[ыу]$/, 'а').replace(/ю$/, 'я').replace(/^страниц[ау]$/, '');
    return cap((head ? head + ' ' : '') + keep.join(' ')).trim();
  },
  findAll(list, t) { const r = []; for (const it of list) { const m = t.match(it[0]); if (m) r.push({ it, pos: m.index }); } return r.sort((a, b) => a.pos - b.pos).map(x => x.it); },
  productGrid(items) {
    const pal = [['#5b7cfa', '#8a5cf6', '#1d2340'], ['#22d3a5', '#5b7cfa', '#10302a'], ['#ffb84d', '#ff6a5c', '#3a1a10'], ['#5cc8ff', '#8a5cf6', '#0f2550']];
    return B.box({ gap: 12 }, [B.h('Каталог', 3), B.grid(2, { gap: 10 }, items.map((p, i) => productCard(p.name, p.price, '', 5 + i * 7, pal[i % pal.length])))], { name: 'Каталог', anchor: 'catalog' });
  },
  applyLook(p, t, done) {
    const th = this.findAll(PZ_THEMES, t)[0];
    if (th) { p.page.themeId = th[1]; p.page.tokens = {}; done.push('тема «' + th[2] + '»'); }
    const col = this.findAll(PZ_COLORS, t)[0];
    if (col) { p.page.tokens = { ...(p.page.tokens || {}), primary: col[1], primary2: col[2] }; done.push('основной цвет ' + col[1]); }
  },

  /* создать новую страницу по описанию */
  create(text) {
    const t = this.norm(text), done = [];
    const title = this.quoted(text);
    const secs = this.findAll(PZ_SECTIONS, t);
    const blocks = this.findAll(PZ_BLOCKS, t);
    const prods = this.products(text);
    const topic = this.findAll(PZ_TOPICS, t)[0];
    let p;
    if (topic && secs.length < 3) {
      const tpl = TEMPLATES.find(x => x.id === topic[1]);
      p = buildTemplateProject(tpl);
      done.push('взял шаблон «' + tpl.name + '»');
      for (const s of secs) {
        const sec = SECTIONS.find(x => x.id === s[1]);
        const has = JSON.stringify(p.root).includes('"name":"' + (sec.make().name || '@@'));
        if (!has && !(s[1] === 's-catalog' && topic[1] === 'digital-shop')) { p.root.children.push(sec.make()); done.push('добавил «' + s[2] + '»'); }
      }
    } else {
      const kids = [B.h(title || (topic ? 'Новая страница' : 'Добро пожаловать'), 1), B.muted('Собрано Puzzlo AI. Нажмите на любой блок, чтобы изменить его.')];
      const order = secs.length ? secs : [PZ_SECTIONS[0], PZ_SECTIONS[2], PZ_SECTIONS[10]];
      for (const s of order) { const sec = SECTIONS.find(x => x.id === s[1]); if (sec) kids.push(sec.make()); }
      p = newProject({ name: title || 'Страница от Puzzlo', themeId: 'telegram', root: newRoot(kids) });
      done.push('собрал страницу из секций: ' + order.map(s => s[2]).join(', '));
    }
    if (prods.length) {
      const old = p.root.children.findIndex(n => n.anchor === 'catalog' || n.name === 'Каталог');
      const grid = this.productGrid(prods);
      if (old >= 0) p.root.children.splice(old, 1, grid); else p.root.children.splice(Math.min(2, p.root.children.length), 0, grid);
