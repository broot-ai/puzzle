<!doctype html>
<html lang="ru" data-ui="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle Studio</title>
<meta name="description" content="Визуальный конструктор страниц для Telegram Mini Apps и PuzzleBot">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Puzzle Studio — интерфейс редактора.
   Раскладка: рабочая среда на всю высоту экрана; на телефоне — режимы и нижние листы. */
:root {
  --bg: #0d0e12;
  --panel: #14161c;
  --panel2: #1a1d25;
  --panel3: #21252f;
  --line: #252934;
  --line2: #323745;
  --text: #e9ebf1;
  --muted: #8e94a5;
  --faint: #5e6475;
  --accent: #6e6aff;
  --accent2: #9a7bff;
  --accent-ink: #ffffff;
  --accent-soft: rgba(110, 106, 255, 0.16);
  --accent-line: rgba(110, 106, 255, 0.45);
  --ok: #3ccf91;
  --warn: #f2b544;
  --err: #ff5d6e;
  --shadow: 0 18px 50px -12px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.3);
  --canvas-bg: #0a0b0e;
  --dot: rgba(255, 255, 255, 0.05);
  --font: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-d: "Unbounded", "Onest", system-ui, sans-serif;
  --font-m: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 10px;
  --r-sm: 7px;
  --r-lg: 14px;
  --t: 160ms cubic-bezier(.2, .7, .2, 1);
  --top-h: 52px;
  --bnav-h: 60px;
  color-scheme: dark;
}
:root[data-ui="light"] {
  --bg: #eef0f5;
  --panel: #ffffff;
  --panel2: #f4f5f9;
  --panel3: #eaecf2;
  --line: #e2e5ec;
  --line2: #d3d7e1;
  --text: #171923;
  --muted: #5d6377;
  --faint: #969cad;
  --accent: #5552f0;
  --accent2: #7f5cf2;
  --accent-soft: rgba(85, 82, 240, 0.1);
  --accent-line: rgba(85, 82, 240, 0.4);
  --ok: #17a26a;
  --warn: #b97a06;
  --err: #e0364a;
  --shadow: 0 18px 50px -14px rgba(20, 24, 40, 0.28), 0 2px 8px rgba(20, 24, 40, 0.08);
  --canvas-bg: #e3e6ed;
  --dot: rgba(20, 24, 40, 0.07);
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ic svg { display: block; }
::selection { background: var(--accent-soft); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-m); }

#app { height: 100%; display: flex; flex-direction: column; }

/* ---------- Кнопки ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 12px; border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--panel2); color: var(--text); font-size: 13px; font-weight: 500; white-space: nowrap; transition: background var(--t), border-color var(--t), color var(--t), transform var(--t); -webkit-tap-highlight-color: transparent; }
.btn:hover { background: var(--panel3); }
.btn:active { transform: scale(0.97); }
.btn[disabled] { opacity: 0.4; pointer-events: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--panel2); }
.btn.danger { color: var(--err); }
.btn.danger.solid { background: var(--err); border-color: var(--err); color: #fff; }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12px; }
.btn.lg { height: 42px; padding: 0 18px; font-size: 14px; }
.btn.icon { width: 34px; padding: 0; }
.btn.icon.sm { width: 28px; }
.btn.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--text); }
.btn.block { width: 100%; }
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-sm); background: var(--panel2); border: 1px solid var(--line); gap: 2px; }
.seg button { height: 28px; min-width: 30px; padding: 0 8px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--panel3); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
:root[data-ui="light"] .seg button.on { background: var(--panel); }
.seg.full { display: flex; width: 100%; }
.seg.full button { flex: 1; min-width: 0; }

/* ---------- Поля ---------- */
.inp, .sel, .ta { width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--bg); color: var(--text); font-size: 13px; transition: border-color var(--t), box-shadow var(--t); }
:root[data-ui="light"] .inp, :root[data-ui="light"] .sel, :root[data-ui="light"] .ta { background: var(--panel); }
.ta { height: auto; min-height: 64px; padding: 8px 10px; line-height: 1.45; resize: vertical; }
.inp:focus, .sel:focus, .ta:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp.bad { border-color: var(--err); }
.sel { appearance: none; -webkit-appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px; background-size: 5px 5px; background-repeat: no-repeat; }
.search { position: relative; }
.search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search .inp { padding-left: 32px; }
.chk { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; cursor: pointer; font-size: 13px; }
.sw { position: relative; flex: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line2); transition: background var(--t); }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform var(--t); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.chk input { position: absolute; opacity: 0; pointer-events: none; }
.chk input:checked + .sw { background: var(--accent); }
.chk input:checked + .sw::after { transform: translateX(14px); }
.chk input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Логотип ---------- */
.logo { display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-d); font-weight: 600; font-size: 14px; letter-spacing: -0.01em; white-space: nowrap; color: var(--text); text-decoration: none; }
.logo-mark { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
.logo b { font-weight: 600; color: var(--muted); }

/* ---------- Домашний экран ---------- */
.home { flex: 1; min-height: 0; display: grid; grid-template-columns: 232px 1fr; }
.side { display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; border-right: 1px solid var(--line); background: var(--panel); min-height: 0; }
.side .logo { padding: 4px 8px 18px; }
.side-btn { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; text-align: left; }
.side-btn:hover { background: var(--panel2); color: var(--text); }
.side-btn.on { background: var(--accent-soft); color: var(--text); }
.side-btn.on .ic { color: var(--accent); }
.side-sep { height: 1px; margin: 10px 4px; background: var(--line); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: var(--r); background: var(--panel2); font-size: 12px; color: var(--muted); }
.side-foot b { color: var(--text); font-weight: 600; }
.badge-local { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--warn); }
.badge-local i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.home-main { min-width: 0; min-height: 0; overflow-y: auto; padding: 28px 32px 48px; }
.home-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.home-head h1 { margin: 0; font-family: var(--font-d); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.home-head p { margin: 4px 0 0; color: var(--muted); }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.toolbar .search { flex: 1; min-width: 200px; max-width: 360px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip:hover { color: var(--text); border-color: var(--line2); }
.chip.on { background: var(--text); border-color: var(--text); color: var(--bg); }
.chips.scrollx { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); gap: 18px; }
.pcard { position: relative; display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); overflow: hidden; transition: border-color var(--t), transform var(--t), box-shadow var(--t); }
.pcard:hover { border-color: var(--line2); transform: translateY(-2px); box-shadow: var(--shadow); }
.pcard-thumb { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--canvas-bg); cursor: pointer; border: 0; padding: 0; display: block; width: 100%; }
.thumb-host { position: absolute; top: 0; left: 0; width: 390px; transform-origin: 0 0; pointer-events: none; }
.pcard-body { display: flex; flex-direction: column; gap: 2px; padding: 12px 12px 12px 14px; }
.pcard-row { display: flex; align-items: center; gap: 6px; }
.pcard-name { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard-meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.pcard-fav { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(0, 0, 0, 0.45); color: #fff; backdrop-filter: blur(6px); opacity: 0; transition: opacity var(--t); }
.pcard:hover .pcard-fav, .pcard-fav.on { opacity: 1; }
.pcard-fav.on { color: #ffcf4a; }
.pcard-fav.on svg { fill: currentColor; }
.pcard-new { align-items: center; justify-content: center; gap: 10px; min-height: 260px; border-style: dashed; background: transparent; color: var(--muted); cursor: pointer; font-weight: 500; }
.pcard-new:hover { color: var(--text); border-color: var(--accent-line); background: var(--accent-soft); }
.pcard-new .ic { width: 44px; height: 44px; border-radius: 50%; background: var(--panel2); color: var(--accent); }
.tcard-cat { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); }
.tcard-desc { font-size: 12px; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tcard-actions { display: flex; gap: 6px; margin-top: 10px; }
.tcard-actions .btn { flex: 1; }
.resume { display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 20px; border: 1px solid var(--accent-line); border-radius: var(--r-lg); background: var(--accent-soft); }
.resume > div { flex: 1; min-width: 0; }
.resume b { display: block; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 56px 16px; text-align: center; color: var(--muted); }
.empty .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--panel2); color: var(--faint); }
.empty h3 { margin: 4px 0 0; color: var(--text); font-size: 16px; }
.empty p { margin: 0; max-width: 380px; }
.section-title { margin: 28px 0 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.setting-list { display: flex; flex-direction: column; max-width: 640px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting > div:first-child { min-width: 0; }
.setting b { display: block; font-weight: 600; }
.setting span { font-size: 12px; color: var(--muted); }
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.media-item { position: relative; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.media-item img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: repeating-conic-gradient(var(--panel2) 0 25%, var(--panel3) 0 50%) 0 0 / 16px 16px; }
.media-item > div { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 10px; font-size: 11px; color: var(--muted); }
.media-item > div span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dropzone { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px; border: 1.5px dashed var(--line2); border-radius: var(--r-lg); color: var(--muted); text-align: center; transition: border-color var(--t), background var(--t); }
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- Нижняя навигация (телефон) ---------- */
.mnav { display: none; }

/* ---------- Редактор ---------- */
.ed { flex: 1; min-height: 0; display: grid; grid-template-rows: var(--top-h) 1fr; }
.top { display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.top .sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
.pname { min-width: 60px; max-width: 280px; height: 32px; padding: 0 8px; border: 1px solid transparent; border-radius: var(--r-sm); background: transparent; font-weight: 600; font-size: 14px; text-overflow: ellipsis; }
.pname:hover { border-color: var(--line); }
.pname:focus { outline: none; border-color: var(--accent); background: var(--bg); }
.save-st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.save-st i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.save-st.saving i { background: var(--warn); animation: pulse 1s infinite; }
.save-st.err { color: var(--err); } .save-st.err i { background: var(--err); }
.save-st.mem i { background: var(--warn); }
@keyframes pulse { 50% { opacity: .3; } }
.top-mid { flex: 1; display: flex; justify-content: center; gap: 8px; min-width: 0; }
.top-r { display: flex; align-items: center; gap: 6px; }
.ed-main { display: grid; grid-template-columns: 272px minmax(0, 1fr) 312px; min-height: 0; }
.pane { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.pane.left { border-right: 1px solid var(--line); }
.pane.right { border-left: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex: none; }
.tabs button { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 9px; border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
.tabs button:hover { color: var(--text); }
.tabs button.on { color: var(--text); }
.tabs button.on::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.pane-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
.grp-t { margin: 14px 2px 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.grp-t:first-child { margin-top: 4px; }
.comp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.comp { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 64px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel2); color: var(--text); font-size: 12px; font-weight: 500; line-height: 1.25; text-align: left; transition: border-color var(--t), background var(--t), transform var(--t); user-select: none; -webkit-user-select: none; }
.comp:hover { border-color: var(--accent-line); background: var(--panel3); }
.comp:active { transform: scale(0.97); }
.comp .ic { color: var(--muted); }
.comp:hover .ic { color: var(--accent); }
.comp[draggable="true"] { cursor: grab; }
.row-list { display: flex; flex-direction: column; gap: 4px; }
.row-item { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 6px 8px 6px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel2); font-size: 13px; text-align: left; }
.row-item:hover { border-color: var(--accent-line); }
.row-item .grow { flex: 1; min-width: 0; }
.row-item small { display: block; color: var(--muted); font-size: 11px; line-height: 1.3; }
.var-item code { font-family: var(--font-m); font-size: 12px; color: var(--accent2); }
:root[data-ui="light"] .var-item code { color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); line-height: 1.45; }
.hint.box { padding: 10px 12px; border-radius: var(--r-sm); background: var(--panel2); border: 1px solid var(--line); }
.hint.warn { color: var(--text); border-color: rgba(242, 181, 68, 0.4); background: rgba(242, 181, 68, 0.1); }
.hint.bad { color: var(--text); border-color: rgba(255, 93, 110, 0.4); background: rgba(255, 93, 110, 0.1); }

/* ---------- Слои ---------- */
.layers { display: flex; flex-direction: column; gap: 1px; }
.lyr { display: flex; align-items: center; gap: 4px; height: 32px; padding-right: 4px; border-radius: 6px; font-size: 12.5px; color: var(--text); cursor: pointer; user-select: none; -webkit-user-select: none; position: relative; }
.lyr:hover { background: var(--panel2); }
.lyr.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
.lyr.dim { opacity: 0.45; }
.lyr .tw { width: 18px; height: 18px; border: 0; padding: 0; background: none; color: var(--faint); display: grid; place-items: center; border-radius: 4px; }
.lyr .tw:hover { color: var(--text); }
.lyr .tw.leaf { visibility: hidden; }
.lyr .ln { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lyr .li { color: var(--muted); }
.lyr .la { display: flex; gap: 0; opacity: 0; }
.lyr:hover .la, .lyr.on .la, .lyr .la .keep { opacity: 1; }
.lyr .la button { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: none; color: var(--muted); display: grid; place-items: center; }
.lyr .la button:hover { color: var(--text); background: var(--panel3); }
.lyr.drop-before::before, .lyr.drop-after::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); border-radius: 2px; }
.lyr.drop-before::before { top: -1px; } .lyr.drop-after::after { bottom: -1px; }
.lyr.drop-in { box-shadow: inset 0 0 0 2px var(--accent); }

/* ---------- Холст ---------- */
.stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--canvas-bg); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 18px 18px; }
.stage-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; flex: none; }
.stage-info { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; justify-content: center; padding: 4px 16px 18px; }
.device { position: relative; flex: none; transform-origin: top center; border-radius: 30px; background: #000; padding: 10px; box-shadow: 0 30px 70px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,0.06); }
.device.tablet { border-radius: 24px; padding: 12px; }
.device.desktop { border-radius: 10px; padding: 0; background: var(--panel); box-shadow: var(--shadow); overflow: hidden; }
.device.desktop::before { content: ""; display: block; height: 26px; background: var(--panel2) radial-gradient(circle at 14px 13px, #ff5f57 4px, transparent 5px), radial-gradient(circle at 30px 13px, #febc2e 4px, transparent 5px), radial-gradient(circle at 46px 13px, #28c840 4px, transparent 5px); background-color: var(--panel2); border-bottom: 1px solid var(--line); }
.device.bare { padding: 0; border-radius: 0; background: transparent; box-shadow: none; }
.device iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 21px; background: #fff; }
.device.tablet iframe { border-radius: 14px; }
.device.desktop iframe, .device.bare iframe { border-radius: 0; }
.stage-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }

/* ---------- Инспектор ---------- */
.insp-head { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); flex: none; }
.insp-title { display: flex; align-items: center; gap: 8px; }
.insp-title .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
.insp-title input { flex: 1; min-width: 0; height: 30px; padding: 0 6px; border: 1px solid transparent; border-radius: 6px; background: none; font-weight: 600; font-size: 14px; }
.insp-title input:hover { border-color: var(--line); }
.insp-title input:focus { outline: none; border-color: var(--accent); background: var(--bg); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 11.5px; color: var(--muted); }
.crumbs button { border: 0; background: none; padding: 2px 4px; border-radius: 4px; color: var(--muted); font-size: 11.5px; }
.crumbs button:hover { color: var(--text); background: var(--panel2); }
.crumbs .ic { color: var(--faint); }
.insp-acts { display: flex; gap: 4px; flex-wrap: wrap; }
.bp-note { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: var(--r-sm); background: var(--accent-soft); border: 1px solid var(--accent-line); font-size: 12px; }
.sec { border-bottom: 1px solid var(--line); }
.sec-h { display: flex; align-items: center; gap: 8px; width: 100%; height: 40px; padding: 0 12px; border: 0; background: none; color: var(--text); font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-align: left; }
.sec-h .ic:last-child { margin-left: auto; color: var(--faint); transition: transform var(--t); }
.sec.open .sec-h .ic:last-child { transform: rotate(180deg); }
.sec-h .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.sec-b { display: none; flex-direction: column; gap: 12px; padding: 2px 12px 16px; }
.sec.open .sec-b { display: flex; }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > label, .fld-l { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 500; }
.fld-l .mini { border: 0; background: none; color: var(--faint); font-size: 11px; padding: 0 2px; }
.fld-l .mini:hover { color: var(--accent); }
.fld.ov > label, .fld.ov .fld-l { color: var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.rng { display: flex; align-items: center; gap: 8px; }
.rng input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 20px; }
.rng .inp { width: 64px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.unit { position: relative; }
.unit .inp { padding-right: 26px; font-variant-numeric: tabular-nums; }
.unit span { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--faint); pointer-events: none; }
.spacing { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.spacing .unit .inp { padding: 0 4px; text-align: center; }
.spacing small { display: block; text-align: center; font-size: 10px; color: var(--faint); margin-top: 3px; }
.colorf { display: flex; flex-direction: column; gap: 6px; }
.swatches { display: flex; flex-wrap: wrap; gap: 5px; }
.swatch { width: 24px; height: 24px; padding: 0; border: 1px solid var(--line2); border-radius: 6px; position: relative; }
.swatch.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
.swatch.none { background: linear-gradient(135deg, transparent 45%, var(--err) 45% 55%, transparent 55%), var(--panel2); }
.color-row { display: flex; gap: 6px; }
.color-row input[type=color] { flex: none; width: 34px; height: 32px; padding: 2px; border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--bg); }
.color-row .inp { font-family: var(--font-m); font-size: 12px; }
.icon-btn-pick { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--bg); text-align: left; font-size: 13px; }
:root[data-ui="light"] .icon-btn-pick { background: var(--panel); }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 4px; }
.icon-grid button { height: 38px; border: 1px solid transparent; border-radius: 8px; background: var(--panel2); color: var(--text); display: grid; place-items: center; }
.icon-grid button:hover { border-color: var(--accent-line); }
.icon-grid button.on { background: var(--accent); color: #fff; }
.imgf { display: flex; flex-direction: column; gap: 8px; }
.imgf-prev { position: relative; height: 112px; border-radius: var(--r-sm); border: 1px solid var(--line); background: repeating-conic-gradient(var(--panel2) 0 25%, var(--panel3) 0 50%) 0 0 / 16px 16px; overflow: hidden; display: grid; place-items: center; color: var(--faint); }
.imgf-prev img { width: 100%; height: 100%; object-fit: contain; }
.imgf-st { font-size: 11.5px; }
.imgf-st.ok { color: var(--ok); } .imgf-st.bad { color: var(--err); }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; }
.items { display: flex; flex-direction: column; gap: 6px; }
.item { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel2); }
.item-h { display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 10px; min-height: 36px; }
.item-h > span { flex: 1; min-width: 0; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.item-b { display: none; flex-direction: column; gap: 10px; padding: 4px 10px 12px; }
.item.open .item-b { display: flex; }
.item-h .btn.icon.sm { width: 24px; height: 24px; }
.var-btn { color: var(--accent); }
.status-line { font-size: 11.5px; }
.status-line.ok { color: var(--ok); } .status-line.bad { color: var(--err); } .status-line.warn { color: var(--warn); }

/* ---------- Всплывающие окна, листы, тосты ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 6, 10, 0.6); backdrop-filter: blur(3px); animation: fadeIn .15s ease; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes sheetIn { from { transform: translateY(100%); } }
.dlg { position: relative; width: 100%; max-width: 460px; max-height: calc(100% - 32px); display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); box-shadow: var(--shadow); animation: popIn .18s ease; }
.dlg.wide { max-width: 1060px; height: calc(100% - 32px); }
.dlg.mid { max-width: 720px; }
.dlg-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.dlg-h h2 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; }
.dlg-b { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.dlg-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.dlg-b p { margin: 0; }
.pop { position: fixed; z-index: 120; min-width: 200px; max-width: min(340px, calc(100vw - 16px)); max-height: min(440px, calc(100vh - 16px)); overflow-y: auto; padding: 6px; border: 1px solid var(--line2); border-radius: var(--r); background: var(--panel); box-shadow: var(--shadow); animation: popIn .12s ease; }
.pop.wide { width: 320px; padding: 10px; }
.menu-i { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--text); font-size: 13px; text-align: left; }
.menu-i:hover { background: var(--panel2); }
.menu-i.danger { color: var(--err); }
.menu-i .ic { color: var(--muted); }
.menu-i.danger .ic { color: var(--err); }
.menu-i kbd { margin-left: auto; font-family: var(--font-m); font-size: 10.5px; color: var(--faint); }
.menu-sep { height: 1px; margin: 4px 6px; background: var(--line); }
.toasts { position: fixed; z-index: 200; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; width: max-content; max-width: calc(100vw - 24px); }
.toast { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 500; box-shadow: var(--shadow); animation: popIn .18s ease; pointer-events: auto; }
.toast.err { background: var(--err); color: #fff; }
.toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }

/* ---------- Экспорт ---------- */
.exp { display: grid; grid-template-columns: 260px minmax(0, 1fr); flex: 1; min-height: 0; }
.exp-side { display: flex; flex-direction: column; gap: 14px; padding: 16px; border-right: 1px solid var(--line); overflow-y: auto; }
.exp-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.mode-opt { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel2); text-align: left; }
.mode-opt b { font-size: 13px; display: flex; align-items: center; gap: 8px; }
.mode-opt b i { font-style: normal; font-family: var(--font-m); font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--panel3); color: var(--muted); }
.mode-opt span { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.mode-opt.on { border-color: var(--accent); background: var(--accent-soft); }
.code { flex: 1; min-height: 0; margin: 0; padding: 14px 16px; overflow: auto; background: var(--bg); font-family: var(--font-m); font-size: 12px; line-height: 1.6; white-space: pre; tab-size: 2; color: var(--text); }
.code-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.code-bar .tabs { border: 0; padding: 0; flex: 1; }
.hl-c { color: var(--faint); font-style: italic; } .hl-t { color: #7aa2ff; } .hl-a { color: #c9a0ff; } .hl-s { color: #8fd694; } .hl-v { color: #ffcf6b; font-weight: 600; } .hl-k { color: #ff9e7a; } .hl-sel { color: #7aa2ff; } .hl-p { color: #c9a0ff; } .hl-n { color: #ffcf6b; }
:root[data-ui="light"] .hl-t, :root[data-ui="light"] .hl-sel { color: #2950c9; } :root[data-ui="light"] .hl-a, :root[data-ui="light"] .hl-p { color: #8034c4; } :root[data-ui="light"] .hl-s { color: #1f7a3a; } :root[data-ui="light"] .hl-v, :root[data-ui="light"] .hl-n { color: #9a5b00; } :root[data-ui="light"] .hl-k { color: #b4401a; }
.issues { display: flex; flex-direction: column; gap: 6px; }
.issue { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: var(--r-sm); background: var(--panel2); font-size: 12px; line-height: 1.4; border: 0; text-align: left; color: var(--text); width: 100%; }
.issue .ic { margin-top: 1px; }
.issue.error .ic { color: var(--err); } .issue.warn .ic { color: var(--warn); } .issue.info .ic { color: var(--muted); }
button.issue:hover { background: var(--panel3); }
.steps { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted); }
.steps li::marker { color: var(--accent); font-weight: 700; }
.prev-full { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; background: var(--canvas-bg); }
.prev-full .stage-bar { background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 12px calc(8px); padding-top: calc(8px + env(safe-area-inset-top, 0px)); }

/* ---------- Мобильная версия ---------- */
.sheet-scrim { display: none; }
.sel-chip { display: none; }
@media (max-width: 1180px) {
  .ed-main { grid-template-columns: 244px minmax(0, 1fr) 284px; }
  .top .hide-md { display: none; }
}
@media (max-width: 860px) {
  :root { --top-h: 50px; }
  .home { grid-template-columns: 1fr; padding-bottom: calc(var(--bnav-h) + env(safe-area-inset-bottom, 0px)); }
  .side { display: none; }
  .home-main { padding: 18px 16px 32px; }
  .home-head h1 { font-size: 19px; }
  .grid-cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .pcard-fav { opacity: 1; }
  .mnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; justify-content: space-around; height: calc(var(--bnav-h) + env(safe-area-inset-bottom, 0px)); padding: 6px 4px env(safe-area-inset-bottom, 0px); border-top: 1px solid var(--line); background: var(--panel); }
  .mnav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-size: 10.5px; font-weight: 600; -webkit-tap-highlight-color: transparent; }
  .mnav button.on { color: var(--accent); }
  .mnav button.on .ic { background: var(--accent-soft); }
  .mnav .ic { width: 44px; height: 26px; border-radius: 999px; }
  .ed { grid-template-rows: var(--top-h) 1fr; padding-bottom: calc(var(--bnav-h) + env(safe-area-inset-bottom, 0px)); }
  .top { padding: 0 6px; gap: 4px; }
  .top .hide-sm { display: none !important; }
  .pname { max-width: 46vw; padding: 0 4px; }
  .ed-main { grid-template-columns: minmax(0, 1fr); }
  .pane.left, .pane.right { position: fixed; left: 0; right: 0; bottom: calc(var(--bnav-h) + env(safe-area-inset-bottom, 0px)); z-index: 60; height: min(72vh, 620px); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; box-shadow: 0 -20px 50px -10px rgba(0,0,0,.5); transform: translateY(110%); visibility: hidden; transition: transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s .26s; }
  .pane.left.open, .pane.right.open { transform: none; visibility: visible; transition: transform .26s cubic-bezier(.2,.8,.2,1); }
  .pane .grabber { display: block; width: 40px; height: 4px; margin: 8px auto 0; border-radius: 4px; background: var(--line2); flex: none; }
  .sheet-scrim { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,0.35); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet-scrim.on { opacity: 1; pointer-events: auto; }
  .stage-bar { padding: 6px 8px; }
  .stage-bar .hide-sm { display: none; }
  .stage-wrap { padding: 0 0 8px; }
  .device.bare iframe { border-radius: 0; }
  .comp-grid { grid-template-columns: repeat(3, 1fr); }
  .sel-chip { position: fixed; left: 10px; right: 10px; bottom: calc(var(--bnav-h) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 40; display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 12px; border: 1px solid var(--line2); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); }
  .sel-chip[hidden] { display: none; }
  .sel-chip > span { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .toasts { bottom: calc(var(--bnav-h) + 76px + env(safe-area-inset-bottom, 0px)); }
  .exp-side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
  .dlg.wide { height: 100%; max-height: 100%; border-radius: 0; }
  .overlay.full-sm { padding: 0; }
  .overlay.full-sm .dlg { max-height: 100%; height: 100%; border-radius: 0; max-width: none; }
}
@media (min-width: 861px) { .pane .grabber { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
.pane.left > .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; padding: 6px 6px 0; overflow: visible; }
.pane.left > .tabs button { justify-content: center; height: 32px; padding: 0 4px; }

/* ================================================================
   ОФОРМЛЕНИЕ В СТИЛЕ PUZZLEBOT (светлая тема по умолчанию)
   ================================================================ */
:root { --font: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --r: 5px; --r-sm: 4px; --r-lg: 6px; --grid: rgba(255,255,255,.035); --tile: #4a4f5a; --tile-ink: #e9ebf1; --var-bg: rgba(154,123,255,.18); --var-ink: #d7c9ff; --insp-bg: var(--panel); }
:root[data-ui="light"] {
  --bg: #f4f6f9; --panel: #ffffff; --panel2: #f6f8fb; --panel3: #edf0f5;
  --line: #e1e6ee; --line2: #cfd6e1; --text: #2b2f36; --muted: #7b8494; --faint: #a9b0bc;
  --accent: #4b8df8; --accent2: #3578e5; --accent-soft: #e9f2fe; --accent-line: #b6d2fb;
  --ok: #3aa757; --warn: #c58a12; --err: #e5484d;
  --canvas-bg: #f4f6f9; --grid: #e3e7ee; --dot: transparent;
  --tile: #9b9b9b; --tile-ink: #ffffff; --var-bg: #e6ddf8; --var-ink: #3f2d6b; --insp-bg: #e9ebee;
  --shadow: 0 10px 30px -10px rgba(30, 40, 60, .25), 0 1px 3px rgba(30, 40, 60, .08);
}
body { font-size: 13.5px; }
.btn { font-weight: 600; border-radius: var(--r-sm); }
:root[data-ui="light"] .btn { background: #fff; border-color: var(--line2); color: #4a5160; }
:root[data-ui="light"] .btn:hover { background: var(--panel2); border-color: var(--accent-line); color: var(--accent); }
:root[data-ui="light"] .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-ui="light"] .btn.primary:hover { background: var(--accent2); border-color: var(--accent2); color: #fff; filter: none; }
:root[data-ui="light"] .btn.ghost { background: transparent; border-color: transparent; }
:root[data-ui="light"] .btn.ghost:hover { background: var(--panel3); color: var(--text); }
:root[data-ui="light"] .btn.danger { color: var(--err); }
:root[data-ui="light"] .btn.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }

/* Логотип в духе «PuzzleBot ://» */
.logo-text { color: var(--accent); font-family: var(--font); font-weight: 700; font-size: 15px; letter-spacing: 0; }
.logo-sl { color: #f0a020; font-weight: 700; margin-left: 2px; }
.crumb { border: 0; background: none; padding: 0 2px; color: var(--muted); font-size: 14px; white-space: nowrap; }
.crumb:hover { color: var(--accent); }
.crumb-sep { color: var(--faint); }
.top .pname { color: var(--accent); font-weight: 600; }
:root[data-ui="light"] .top, :root[data-ui="light"] .side { box-shadow: 0 1px 0 var(--line); }

/* Квадратные галочки как в PuzzleBot */
.chk { justify-content: flex-start; gap: 10px; }
.chk .sw { width: 20px; height: 20px; border-radius: 3px; background: var(--panel); border: 2px solid var(--accent); transition: background var(--t); }
.chk .sw::after { width: 10px; height: 5px; top: 4px; left: 3px; border-radius: 0; background: transparent; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; box-shadow: none; transform: rotate(-45deg) scale(0); }
.chk input:checked + .sw { background: var(--accent); }
.chk input:checked + .sw::after { transform: rotate(-45deg) scale(1); }

/* Боковое меню главного экрана */
:root[data-ui="light"] .side-btn { color: #6b7383; font-weight: 500; font-size: 14px; }
:root[data-ui="light"] .side-btn .ic { color: #9aa1ad; }
:root[data-ui="light"] .side-btn:hover { background: transparent; color: var(--accent); }
:root[data-ui="light"] .side-btn.on { background: transparent; color: var(--accent); font-weight: 600; }
:root[data-ui="light"] .side-btn.on .ic { color: var(--accent); }
:root[data-ui="light"] .home-head h1 { font-family: var(--font); font-weight: 700; font-size: 30px; color: #1f2329; letter-spacing: -0.01em; }
:root[data-ui="light"] .pcard { border-radius: var(--r-lg); box-shadow: 0 1px 2px rgba(30,40,60,.06); }
:root[data-ui="light"] .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-ui="light"] .tcard-cat { color: var(--accent); }

/* Плитки блоков как в палитре PuzzleBot */
.comp { align-items: center; justify-content: flex-start; text-align: center; gap: 6px; min-height: 0; padding: 0 0 4px; border: 0; background: transparent; font-size: 11.5px; font-weight: 500; color: var(--muted); }
.comp .ic { width: 100%; height: 50px; border-radius: 4px; background: var(--tile); color: var(--tile-ink) !important; transition: background var(--t); }
.comp:hover { background: transparent; border: 0; color: var(--text); }
.comp:hover .ic { background: var(--accent); }
.comp-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; }
.comp { min-width: 0; overflow-wrap: anywhere; }
.grp-t { color: var(--muted); font-size: 12px; text-transform: none; letter-spacing: 0; font-weight: 600; }

/* Переменные — сиреневые метки */
.var-item code, .var-sug code { display: inline-block; padding: 1px 6px; border-radius: 3px; background: var(--var-bg); color: var(--var-ink); font-family: var(--font-m); font-size: 11.5px; }
.var-tag { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 3px; font-size: 10px; font-weight: 600; background: var(--panel3); color: var(--muted); vertical-align: 1px; }
.var-tag.warn { background: rgba(242,181,68,.2); color: var(--warn); }
.var-sug { position: fixed; z-index: 300; max-height: 280px; overflow-y: auto; padding: 4px; border: 1px solid var(--line2); border-radius: var(--r); background: var(--panel); box-shadow: var(--shadow); }
.var-sug[hidden] { display: none; }
.var-sug-i { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
.var-sug-i span { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.var-sug-i em { font-style: normal; font-size: 10px; color: var(--muted); justify-self: end; }
.var-sug-i.on, .var-sug-i:hover { background: var(--accent-soft); }

/* Холст: сетка как в конструкторе PuzzleBot */
.stage { background-color: var(--canvas-bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 120px 120px; }

/* Панель свойств: серый фон и белые карточки */
.pane.right { background: var(--insp-bg); }
.insp-head { background: var(--panel); margin: 10px 10px 0; border: 1px solid var(--line); border-radius: var(--r); }
.insp-tabs { display: grid; grid-template-columns: repeat(3, 1fr); margin: 10px 10px 0; padding: 3px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.insp-tabs button { height: 32px; border: 0; border-radius: 3px; background: transparent; color: #5a6170; font-size: 13px; font-weight: 600; }
:root:not([data-ui="light"]) .insp-tabs button { color: var(--muted); }
.insp-tabs button.on { background: var(--accent-soft); color: var(--accent); }
.pane.right .pane-body { padding: 0 0 16px !important; }
.pane.right .sec { margin: 10px 10px 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.pane.right .sec-h { height: 42px; font-size: 13px; color: #4a5160; }
:root:not([data-ui="light"]) .pane.right .sec-h { color: var(--text); }
.hex-row { display: flex; align-items: center; gap: 8px; }
.hex-sw { width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--line2); flex: none; }
.hex-row code { flex: 1; font-family: var(--font-m); font-size: 13px; font-weight: 600; }
.empty-tab { padding: 18px 14px; color: var(--muted); font-size: 13px; text-align: center; }

</style>

(function () {
"use strict";
/* ===== 01-util.js ===== */
/* ============================================================
   01 · УТИЛИТЫ: DOM, ID, экранирование, проверка URL и CSS
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const ID_ALPHABET = 'abcdefghijkmnpqrstuvwxyz23456789';
function uid(n = 7) {
  let s = '';
  try {
    const b = crypto.getRandomValues(new Uint8Array(n));
    for (const x of b) s += ID_ALPHABET[x % ID_ALPHABET.length];
  } catch (e) {
    for (let i = 0; i < n; i++) s += ID_ALPHABET[Math.floor(Math.random() * ID_ALPHABET.length)];
  }
  // ID всегда начинается с буквы — безопасно для CSS-классов
  return /[a-z]/.test(s[0]) ? s : 'n' + s.slice(1);
}

function clone(o) {
  try { return structuredClone(o); } catch (e) { return JSON.parse(JSON.stringify(o)); }
}

const HTML_ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c => HTML_ESC[c]);
const escAttr = escHtml;

function debounce(fn, ms) {
  let t;
  const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  d.flush = (...a) => { clearTimeout(t); fn(...a); };
  d.cancel = () => clearTimeout(t);
  return d;
}

function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

function fmtDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  if (sameDay) return 'сегодня, ' + time;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'вчера, ' + time;
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}

function fmtBytes(n) {
  if (n < 1024) return n + ' Б';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' КБ';
  return (n / 1024 / 1024).toFixed(1) + ' МБ';
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

/* ---------- DOM-конструктор для интерфейса редактора ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'html') el.innerHTML = v; // только для доверенной разметки (иконки редактора)
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

/* ---------- Проверка URL с учётом контекста ----------
   Возвращает { ok, url, reason }. Не даёт пройти javascript:, vbscript:, data:text/html и т. п. */
const SAFE_DATA_IMG = /^data:image\/(png|jpe?g|gif|webp|svg\+xml|avif);base64,[a-z0-9+/=\s]+$/i;
const SAFE_DATA_VIDEO = /^data:video\/(mp4|webm|ogg);base64,[a-z0-9+/=\s]+$/i;

function checkUrl(raw, opt = {}) {
  const { allowData = false, allowVideoData = false, allowAnchor = true, allowRelative = false } = opt;
  let u = String(raw ?? '').trim();
  if (!u) return { ok: true, url: '', empty: true };
  // Удаляем управляющие символы, которыми пытаются обмануть проверку схемы
  const probe = u.replace(/[\u0000- \u007f-\u009f]/g, '').toLowerCase();
  if (allowAnchor && /^#[a-z0-9_-]+$/i.test(u)) return { ok: true, url: u, kind: 'anchor' };
  if (probe.startsWith('data:')) {
    if (allowData && SAFE_DATA_IMG.test(u)) return { ok: true, url: u, kind: 'data' };
    if (allowVideoData && SAFE_DATA_VIDEO.test(u)) return { ok: true, url: u, kind: 'data' };
    return { ok: false, url: '', reason: 'Этот тип data-ссылки запрещён' };
  }
  const m = probe.match(/^([a-z][a-z0-9+.-]*):/);
  if (m) {
    const scheme = m[1];
    if (['https', 'http', 'tg', 'mailto', 'tel'].includes(scheme)) {
      if ((scheme === 'https' || scheme === 'http') && !/^https?:\/\/[^\s/?#]+/i.test(u))
        return { ok: false, url: '', reason: 'После https:// должен идти адрес сайта' };
      if (/\s/.test(u)) return { ok: false, url: '', reason: 'В ссылке есть пробелы' };
      return { ok: true, url: u, kind: scheme, insecure: scheme === 'http' };
    }
    return { ok: false, url: '', reason: 'Схема «' + scheme + ':» запрещена' };
  }
  if (/^\{\{[A-Za-z0-9_]+\}\}/.test(u)) return { ok: true, url: u, kind: 'variable' };
  if (allowRelative && /^[\w./-]+$/.test(u)) return { ok: true, url: u, kind: 'relative' };
  if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(u)) return { ok: false, url: '', reason: 'Добавьте https:// в начало', fix: 'https://' + u };
  return { ok: false, url: '', reason: 'Это не похоже на ссылку' };
}

/* ---------- Санитайзеры CSS-значений ----------
   Пользовательские значения никогда не попадают в CSS «как есть». */
const CSS = {
  len(v, { auto = false, neg = false, units = ['px', '%', 'rem', 'em', 'vw', 'vh', 'dvh'] } = {}) {
    if (v === '' || v == null) return null;
    if (auto && v === 'auto') return 'auto';
    if (typeof v === 'number' && isFinite(v)) return (neg ? v : Math.max(0, v)) + 'px';
    const m = String(v).trim().match(/^(-?\d*\.?\d+)\s*([a-z%]*)$/i);
    if (!m) return null;
    const n = parseFloat(m[1]);
    if (!neg && n < 0) return null;
    const unit = (m[2] || 'px').toLowerCase();
    if (!units.includes(unit)) return null;
    return n + unit;
  },
  num(v, min = -1e6, max = 1e6) {
    const n = parseFloat(v);
    return isFinite(n) ? clamp(n, min, max) : null;
  },
  color(v) {
    if (v == null || v === '') return null;
    v = String(v).trim();
    if (v.startsWith('token:')) {
      const k = v.slice(6);
      return /^[a-z][a-zA-Z0-9]*$/.test(k) ? 'var(--ps-' + k + ')' : null;
    }
    if (/^#([0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(v)) return v;
    if (/^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(,\s*(0|1|0?\.\d+)\s*)?\)$/i.test(v)) return v;
    if (v === 'transparent' || v === 'currentColor') return v;
    return null;
  },
  url(v) {
    const c = checkUrl(v, { allowData: true, allowAnchor: false });
    if (!c.ok || !c.url || c.kind === 'variable' || c.kind === 'mailto' || c.kind === 'tel' || c.kind === 'tg') return null;
    // в CSS-строке запрещаем кавычки, обратный слэш и переводы строк
    if (/["\\\n\r]/.test(c.url)) return null;
    return 'url("' + c.url + '")';
  },
  pick(v, list) { return list.includes(v) ? v : null; },
};

function hexToRgb(hex) {
  const m = String(hex).replace('#', '');
  const f = m.length === 3 ? m.split('').map(c => c + c).join('') : m.slice(0, 6);
  const n = parseInt(f, 16);
  if (isNaN(n)) return null;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgba(hex, a) {
  const c = hexToRgb(hex);
  return c ? `rgba(${c[0]},${c[1]},${c[2]},${a})` : hex;
}

/* Безопасная обработка ошибок, чтобы сбой одной функции не ронял весь редактор */
function safe(fn, fallback) {
  try { return fn(); } catch (e) { console.error(e); return fallback; }
}

function iconSvg(name, size = 18, extraAttr = '') {
  const p = ICONS[name];
  if (!p) return '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extraAttr}>${p}</svg>`;
}
function ic(name, size = 18) {
  const s = h('span', { class: 'ic', html: iconSvg(name, size) });
  return s;
}

/* ============================================================
   04 · РЕЕСТР КОМПОНЕНТОВ
   Каждый тип: label, icon, container?, fields (схема панели свойств),
   defaults (props/style), render(node, ctx) → HTML-строка.
   Один и тот же render используется на холсте и при экспорте —
   поэтому предпросмотр совпадает с итоговым кодом.
   ============================================================ */

/* ---------- помощники рендера ---------- */
function T(s, ctx) {
  // Текст с переменными {{KEY}}. Всегда экранируется.
  let out = escHtml(s ?? '');
  out = out.replace(VAR_RE, (m, k) => {
    if (ctx.varMode === 'sample') return escHtml(varSample(ctx.project, k));
    if (ctx.mode === 'edit') return `<span class="ps-edit-var">{{${k}}}</span>`;
    return '{{' + k + '}}';
  });
  return out.replace(/\r?\n/g, '<br>');
}
function TA(s, ctx) {
  // Текст для атрибута (alt, placeholder, aria-label): только экранирование
  let v = String(s ?? '');
  if (ctx.varMode === 'sample') v = v.replace(VAR_RE, (m, k) => varSample(ctx.project, k));
  return escAttr(v);
}
function rich(src, ctx) {
  // Мини-разметка: **жирный**, *курсив*, [текст](https://…), строки с "- " — список, пустая строка — новый абзац
  const blocks = String(src ?? '').split(/\n\s*\n/);
  const inline = line => {
    let s = T(line, { ...ctx, _noBr: true });
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => {
      const c = checkUrl(u.replace(/&amp;/g, '&'));
      if (!c.ok || !c.url) return t;
      const ext = /^https?:/.test(c.url);
      return `<a href="${escAttr(c.url)}"${ext ? ' target="_blank" rel="noopener noreferrer"' : ''}>${t}</a>`;
    });
    return s;
  };
  return blocks.map(b => {
    const lines = b.split(/\r?\n/).filter(l => l.trim() !== '');
    if (!lines.length) return '';
    if (lines.every(l => /^\s*[-•]\s+/.test(l))) return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-•]\s+/, '')) + '</li>').join('') + '</ul>';
    return '<p>' + lines.map(inline).join('<br>') + '</p>';
  }).join('');
}
function at(n, ctx, cls, extra = '') {
  let a = `class="${cls} ps-${n.id}${ctx.mode !== 'edit' && n.anim && n.anim.in && n.anim.in !== 'none' ? ' ps-anim-' + n.anim.in : ''}"`;
  if (n.anchor && /^[a-z0-9_-]+$/i.test(n.anchor)) a += ` id="ps-${n.anchor}"`;
  if (ctx.mode === 'edit') a += ` data-psid="${n.id}"`;
  return a + extra;
}
function kids(n, ctx) { return (n.children || []).map(c => renderNode(c, ctx)).join(''); }
function renderNode(n, ctx) {
  if (!n || n.hidden) return '';
  const def = COMP[n.type];
  if (!def) return ctx.mode === 'edit' ? `<div class="ps-edit-unknown" data-psid="${n.id}">Неизвестный блок: ${escHtml(n.type)}</div>` : '';
  try { return def.render(n, ctx); }
  catch (e) { console.error(e); return ctx.mode === 'edit' ? `<div class="ps-edit-unknown" data-psid="${n.id}">Ошибка блока</div>` : ''; }
}
function svgI(name, size) { return iconSvg(name, size || 18, 'class="ps-ic"'); }

function actionParts(act, ctx) {
  // → { tag, attrs, js } для кнопки/ссылки
  const a = act || { type: 'none' };
  const v = String(a.value ?? '');
  switch (a.type) {
    case 'url': {
      const c = checkUrl(v, { allowAnchor: false });
      if (!c.ok || !c.url) return { tag: 'button', attrs: ' type="button"' };
      const tgJs = ctx.js ? ' data-ps-act="link"' : '';
      return { tag: 'a', attrs: ` href="${escAttr(c.url)}"${a.newTab === false ? '' : ' target="_blank" rel="noopener noreferrer"'}${tgJs}`, js: !!ctx.js };
    }
    case 'tg': {
      let u = v.trim();
      if (/^@?[A-Za-z0-9_]{4,64}$/.test(u)) u = 'https://t.me/' + u.replace('@', '');
      const c = checkUrl(u, { allowAnchor: false });
      if (!c.ok || !c.url) return { tag: 'button', attrs: ' type="button"' };
      return { tag: 'a', attrs: ` href="${escAttr(c.url)}" target="_blank" rel="noopener noreferrer"${ctx.js ? ' data-ps-act="tglink"' : ''}`, js: !!ctx.js };
    }
    case 'bot': {
      const bot = String(a.bot || '').replace('@', '').trim();
      const p = String(a.value || '').trim();
      if (!/^[A-Za-z0-9_]{4,64}$/.test(bot)) return { tag: 'button', attrs: ' type="button"' };
      const okP = /^[A-Za-z0-9_{}-]{0,64}$/.test(p);
      const url = 'https://t.me/' + bot + (p && okP ? '?start=' + p : '');
      return { tag: 'a', attrs: ` href="${escAttr(url)}" target="_blank" rel="noopener noreferrer"${ctx.js ? ' data-ps-act="tglink"' : ''}`, js: !!ctx.js };
    }
    case 'anchor': {
      const an = String(a.value || '').replace(/^#/, '');
      if (!/^[a-z0-9_-]+$/i.test(an)) return { tag: 'button', attrs: ' type="button"' };
      return { tag: 'a', attrs: ` href="#ps-${an}"` };
    }
    case 'copy': return { tag: 'button', attrs: ` type="button" data-ps-act="copy" data-ps-val="${TA(v, ctx)}"`, js: true };
    case 'close': return { tag: 'button', attrs: ' type="button" data-ps-act="close"', js: true };
    case 'senddata': return { tag: 'button', attrs: ` type="button" data-ps-act="senddata" data-ps-val="${TA(v, ctx)}"`, js: true };
    case 'submit': return { tag: 'button', attrs: ' type="submit"' };
    default: return { tag: 'button', attrs: ' type="button"' };
  }
}

/* ---------- Создание узлов ---------- */
function mk(type, props = {}, style = {}, children, extra = {}) {
  const def = COMP[type];
  const d = def && def.defaults ? clone(def.defaults) : {};
  const n = {
    id: uid(), type,
    props: { ...(d.props || {}), ...props },
    style: { ...(d.style || {}), ...style },
  };
  if (d.action || extra.action) n.action = { ...(d.action || {}), ...(extra.action || {}) };
  if (def && def.container) n.children = children || [];
  for (const k of ['name', 'anchor', 'hover', 'press', 'anim', 'bp', 'hide']) if (extra[k]) n[k] = extra[k];
  return n;
}

function localDT(ts) {
  // формат для datetime-local в МЕСТНОМ времени (toISOString дал бы UTC)
  const d = new Date(ts);
  const pad = x => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function defaultTimerTarget() {
  const d = new Date(Date.now() + 3 * 864e5);
  d.setHours(23, 59, 0, 0);
  return localDT(d.getTime());
}

/* ---------- Генеративные демо-изображения (SVG data URI) ----------
   Внешние картинки могут быть недоступны, поэтому шаблоны используют
   встроенную графику. Пользователь заменяет её своими фото. */
function artImage(seed, colors, kind = 'blobs') {
  let s = seed * 9301 + 49297;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const [a, b, c] = colors;
  let shapes = '';
  if (kind === 'blobs') {
    for (let i = 0; i < 5; i++) shapes += `<circle cx="${(rnd() * 400).toFixed(0)}" cy="${(rnd() * 300).toFixed(0)}" r="${(60 + rnd() * 120).toFixed(0)}" fill="${[a, b, c][i % 3]}" opacity="${(0.5 + rnd() * 0.4).toFixed(2)}"/>`;
    shapes = `<g filter="url(#f)">${shapes}</g>`;
  } else if (kind === 'product') {
    shapes = `<rect x="130" y="70" width="140" height="170" rx="18" fill="${c}" opacity=".95"/><rect x="150" y="95" width="100" height="10" rx="5" fill="#fff" opacity=".7"/><rect x="150" y="115" width="70" height="10" rx="5" fill="#fff" opacity=".45"/><circle cx="200" cy="185" r="32" fill="#fff" opacity=".25"/>`;
  } else if (kind === 'portrait') {
    shapes = `<circle cx="200" cy="120" r="56" fill="${c}" opacity=".9"/><path d="M90 320c10-80 60-120 110-120s100 40 110 120z" fill="${c}" opacity=".9"/>`;
  } else if (kind === 'waves') {
    for (let i = 0; i < 4; i++) shapes += `<path d="M0 ${150 + i * 30} C 100 ${100 + i * 30 + rnd() * 40}, 300 ${200 + i * 20 - rnd() * 40}, 400 ${140 + i * 30} V300 H0Z" fill="${[a, b, c, a][i]}" opacity="${0.35 + i * 0.15}"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><filter id="f" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter></defs><rect width="400" height="300" fill="url(#g)"/>${shapes}</svg>`;
  return 'data:image/svg+xml;base64,' + btoa(svg);
}

  if (/^#[0-9a-f]{3,8}$/i.test(c)) return rgba(c, a);
  const m = String(c).match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
  if (m) return `rgba(${m[1]},${m[2]},${m[3]},${a})`;

/* ---------- Стиль узла → CSS-декларации ---------- */
const ALIGN = { start: 'flex-start', center: 'center', end: 'flex-end', stretch: 'stretch', baseline: 'baseline' };
const JUSTIFY = { start: 'flex-start', center: 'center', end: 'flex-end', between: 'space-between', around: 'space-around', evenly: 'space-evenly' };

function radiusVal(v) {
  if (v === 'theme') return 'var(--ps-radius)';

}
function shadowVal(v) {

function styleDecls(st, node, tokens) {
  const d = {};

  const def = COMP[node.type] || {};
  // Раскладка (для контейнеров)
  if (def.container && node.type !== 'page') {

    else if (lay === 'row') { d.display = 'flex'; d['flex-direction'] = 'row'; }
    else if (lay === 'grid') { d.display = 'grid'; d['grid-template-columns'] = `repeat(${clamp(parseInt(st.cols) || 2, 1, 6)}, minmax(0, 1fr))`; }
    else d.display = 'block';
    if (st.wrap && lay === 'row') d['flex-wrap'] = 'wrap';

  if (node.type === 'page') {
    if (ALIGN[st.align]) d['align-items'] = ALIGN[st.align];

  if (st.w === 'full') d.width = '100%';

  else if (st.w != null && st.w !== '' && st.w !== 'auto') { const w = CSS.len(st.w); if (w) d.width = w; }
  if (st.maxW != null && st.maxW !== '') { const v = CSS.len(st.maxW); if (v) d['max-width'] = v; }
  if (st.h != null && st.h !== '' && st.h !== 'auto') { const v = CSS.len(st.h); if (v) d.height = v; }
  if (st.minH != null && st.minH !== '') { const v = CSS.len(st.minH); if (v) d['min-height'] = v; }
  if (st.center) { d['margin-left'] = 'auto'; d['margin-right'] = 'auto'; }
  // Отступы
  for (const [k, p] of [['pt', 'padding-top'], ['pr', 'padding-right'], ['pb', 'padding-bottom'], ['pl', 'padding-left']]) {
    if (st[k] != null && st[k] !== '') { const v = CSS.len(st[k]); if (v) d[p] = v; }
  }

  if (st.font && FONTS[st.font]) d['font-family'] = fontStack(st.font);
  if (st.fs != null && st.fs !== '') { const v = CSS.len(st.fs); if (v) d['font-size'] = v; }
  if (st.fw) { const v = CSS.pick(String(st.fw), ['300', '400', '500', '600', '700', '800', '900']); if (v) d['font-weight'] = v; }
  if (st.lh != null && st.lh !== '') { const v = CSS.num(st.lh, 0.8, 3); if (v != null) d['line-height'] = v; }

  if (st.tt) { const v = CSS.pick(st.tt, ['none', 'uppercase', 'lowercase', 'capitalize']); if (v) d['text-transform'] = v; }
  if (st.italic) d['font-style'] = 'italic';

}

function declStr(d, ind = '  ') {
  return Object.entries(d).map(([k, v]) => `${ind}${k}: ${v};`).join('\n');
}

/* ---------- CSS корня и базовых компонентов ---------- */
function rootVars(tokens) {
  const v = {};
  for (const [k] of TOKEN_COLORS) {
    const c = CSS.color(tokens[k]) || THEMES.dark[k];
    v['--ps-' + k] = c;
  }
  v['--ps-on-primary'] = v['--ps-onPrimary'];
  v['--ps-grad'] = `linear-gradient(135deg, ${v['--ps-primary']}, ${v['--ps-primary2']})`;
  v['--ps-primary-t'] = tint(tokens.primary, 0.14);
  v['--ps-success-t'] = tint(tokens.success, 0.14);
  v['--ps-danger-t'] = tint(tokens.danger, 0.14);
  v['--ps-warn'] = '#e8a317';
  v['--ps-warn-t'] = 'rgba(232,163,23,0.14)';
  v['--ps-glow'] = tint(tokens.primary, 0.5);
  v['--ps-radius'] = clamp(parseInt(tokens.radius) || 0, 0, 40) + 'px';
  v['--ps-radius-sm'] = Math.round(clamp(parseInt(tokens.radius) || 0, 0, 40) * 0.65) + 'px';
  v['--ps-btn-radius'] = clamp(isNaN(parseInt(tokens.btnRadius)) ? 12 : parseInt(tokens.btnRadius), 0, 999) + 'px';
  v['--ps-shadow'] = SHADOWS[tokens.shadow] || 'none';
  v['--ps-font'] = fontStack(tokens.font);
  v['--ps-font-h'] = fontStack(tokens.headingFont || tokens.font);
  v['--ps-gap'] = clamp(parseInt(tokens.gap) || 12, 0, 64) + 'px';
  v['--ps-cw'] = clamp(parseInt(tokens.contentWidth) || 480, 280, 1400) + 'px';
  return v;
}

/* Как блок ведёт себя внутри HTML-блока PuzzleBot.
   transparent — без фона: фон задаёт PuzzleBot («Задать фон»), отступов страницы нет
   block       — фон только у самого блока, со скруглением
   fill        — фон на весь экран: CSS «на всю ширину» + скрипт, который перекрашивает
                 страницу вокруг и шапку Telegram (обход системного фона)
   doc         — самостоятельный документ (экспорт «Полный документ», миниатюры) */
const EMBED_MODES = [
  ['transparent', 'Без фона', 'Блок прозрачный и без внешних отступов. Фон всей страницы задаётся в PuzzleBot: «Настройки мини-приложения → Задать фон». Самый надёжный вариант.'],
  ['block', 'Фон у блока', 'Фон и скругление только у этого HTML-блока. Вокруг остаётся фон PuzzleBot — как карточка внутри страницы.'],
  ['fill', 'На весь экран', 'Фон растягивается на всю ширину экрана, а скрипт пытается перекрасить страницу PuzzleBot вокруг и шапку Telegram. Экспериментально: зависит от того, как PuzzleBot выводит блок.'],
];
function embedRootCss(page, rootBg) {
  const bg = rootBg || 'var(--ps-bg)';
  const minH = page.fullHeight !== false ? '  min-height: 100vh;\n  min-height: 100dvh;' : '';
  switch (page.embedMode) {
    case 'transparent': return '  background: transparent;';
    case 'block': return `  background: ${bg};\n  border-radius: calc(var(--ps-radius) + 4px);\n  overflow: hidden;`;
    case 'fill': return `  background: ${bg};\n${minH}\n  /* на всю ширину экрана, даже если у обёртки PuzzleBot есть отступы */\n  width: 100vw;\n  max-width: 100vw;\n  margin-left: calc(50% - 50vw);\n  margin-right: calc(50% - 50vw);`;
    default: return `  background: ${bg};\n${minH}`;
  }
}
function fillJs(pid, hex) {
  return `/* Puzzle Studio: обход системного фона PuzzleBot (режим «На весь экран») */
(function () {
  var root = document.querySelector('.ps-p-${pid}');
  if (!root) return;
  var bg = '${hex}';
  function clearUp(el, stop, win) {
    while (el && el !== stop) {
      try { var c = win.getComputedStyle(el).backgroundColor; if (c && c !== 'rgba(0, 0, 0, 0)' && c !== 'transparent') el.style.setProperty('background', 'transparent', 'important'); } catch (e) {}
      el = el.parentElement;
    }
  }
  function paint(doc) {
    try { doc.documentElement.style.setProperty('background', bg, 'important'); doc.body.style.setProperty('background', bg, 'important'); } catch (e) {}
  }
  paint(document);
  clearUp(root.parentElement, document.body, window);
  /* блок внутри iframe с той же страницы — красим и внешнюю страницу */
  try { if (window.frameElement) { var pd = window.parent.document; paint(pd); clearUp(window.frameElement.parentElement, pd.body, window.parent); window.frameElement.style.setProperty('background', 'transparent', 'important'); } } catch (e) {}
  /* шапка и фон Telegram Mini App */
  try {
    var tg = (window.Telegram && window.Telegram.WebApp) || (window.parent && window.parent.Telegram && window.parent.Telegram.WebApp);
    if (tg && /^#[0-9a-f]{6}$/i.test(bg)) { if (tg.setBackgroundColor) tg.setBackgroundColor(bg); if (tg.setHeaderColor) tg.setHeaderColor(bg); if (tg.setBottomBarColor) tg.setBottomBarColor(bg); }
  } catch (e) {}
})();`;
}
function embedHex(project) {
  const t = themeTokens(project.page);
  const own = (project.root.style || {}).bg;
  const c = own && /^#[0-9a-f]{6}$/i.test(own) ? own : t.bg;
  return /^#[0-9a-f]{6}$/i.test(c) ? c : (/^#[0-9a-f]{3}$/i.test(c) ? '#' + c.slice(1).split('').map(x => x + x).join('') : '#000000');
}

/* ---------- Правила для конкретных узлов ---------- */
function nodeRules(n, R, tokens, out) {
  if (n.hidden) return;
  const def = COMP[n.type];
  if (!def) return;
  const sel = `${R} .ps-${n.id}`;
  const st = n.style || {};
  let base;
  if (n.type === 'page') {
    // фон страницы — на корень, отступы и gap — на внутренний контейнер
    const bgPart = {};
    const pick = ['bg', 'grad', 'bgImg', 'bgSize', 'bgPos', 'overlay'];
    for (const k of pick) if (st[k] != null) bgPart[k] = st[k];
    const rootD = styleDecls(bgPart, { type: 'box', props: {} }, tokens);
    if (Object.keys(rootD).length) out.base.push(`${R} {\n${declStr(rootD)}\n}`);
    const rest = { ...st }; for (const k of pick) delete rest[k];
    base = styleDecls(rest, n, tokens);
  } else {
    base = styleDecls(st, n, tokens);
  }
  const hasHover = n.hover && Object.values(n.hover).some(v => v !== '' && v != null && v !== false && v !== 0);
  const hasPress = n.press && parseFloat(n.press.scale) && parseFloat(n.press.scale) !== 100;
  if (hasHover || hasPress) base.transition = 'transform .2s ease, box-shadow .2s ease, background-color .2s ease, color .2s ease, border-color .2s ease, filter .2s ease';
  if (n.anim && n.anim.in && n.anim.in !== 'none' && n.anim.delay) base['animation-delay'] = clamp(parseInt(n.anim.delay) || 0, 0, 5000) + 'ms';
  if (Object.keys(base).length) out.base.push(`${sel} {\n${declStr(base)}\n}`);
  // Hover / active
  if (hasHover) {
    const hv = n.hover, d = {};
    const bg = CSS.color(hv.bg); if (bg) d['background-color'] = bg;
    const c = CSS.color(hv.color); if (c) d.color = c;
    const bc = CSS.color(hv.bc); if (bc) d['border-color'] = bc;
    const tr = [];
    if (parseFloat(hv.lift)) tr.push(`translateY(${-clamp(parseFloat(hv.lift), 0, 20)}px)`);
    if (parseFloat(hv.scale) && parseFloat(hv.scale) !== 100) tr.push(`scale(${clamp(parseFloat(hv.scale), 80, 130) / 100})`);
    if (tr.length) d.transform = tr.join(' ');
    if (hv.glow) d['box-shadow'] = '0 10px 30px -8px var(--ps-glow), 0 0 0 1px var(--ps-primary-t)';
    else if (hv.shadow && SHADOWS[hv.shadow]) d['box-shadow'] = SHADOWS[hv.shadow];
    if (hv.bright && parseInt(hv.bright) !== 100) d.filter = `brightness(${clamp(parseInt(hv.bright), 50, 160)}%)`;
    if (Object.keys(d).length) out.hover.push(`  ${sel}:hover {\n${declStr(d, '    ')}\n  }`);
  }
  if (hasPress) out.base.push(`${sel}:active {\n  transform: scale(${clamp(parseFloat(n.press.scale), 80, 110) / 100});\n}`);
  // Адаптивные переопределения
  for (const bp of ['tablet', 'desktop']) {
    const ov = n.bp && n.bp[bp];
    if (ov && Object.keys(ov).length) {
      const eff = styleDecls({ ...st, ...(bp === 'desktop' ? (n.bp.tablet || {}) : {}), ...ov }, n, tokens);
      const prev = bp === 'desktop' ? styleDecls({ ...st, ...(n.bp.tablet || {}) }, n, tokens) : base;
      const diff = {};
      for (const [k, v] of Object.entries(eff)) if (prev[k] !== v) diff[k] = v;
      if (Object.keys(diff).length) out[bp].push(`  ${sel} {\n${declStr(diff, '    ')}\n  }`);
    }
  }
  // Скрытие на устройствах
  const hide = n.hide || {};
  if (hide.mobile) out.hideMobile.push(sel);
  if (hide.tablet) out.hideTablet.push(sel);
  if (hide.desktop) out.hideDesktop.push(sel);
  for (const c of (n.children || [])) nodeRules(c, R, tokens, out);
}

/* ---------- Нужен ли JavaScript ---------- */
function scanFeatures(root) {
  const f = { js: false, copy: false, timer: false, form: false, tg: false, tgSend: false, tgClose: false, links: false, fonts: new Set(), images: [], vars: new Set(), nodes: 0 };
  const visit = n => {
    if (!n || n.hidden) return;
    f.nodes++;
    const a = n.action || {};
    if (a.type === 'copy') { f.copy = true; f.js = true; }
    if (a.type === 'close') { f.tgClose = true; f.tg = true; f.js = true; }
    if (a.type === 'senddata') { f.tgSend = true; f.tg = true; f.js = true; }
    if (a.type === 'url' || a.type === 'tg' || a.type === 'bot') f.links = true;
    if (n.type === 'copyfield') { f.copy = true; f.js = true; }
    if (n.type === 'timer') { f.timer = true; f.js = true; }
    if (n.type === 'form') { f.form = true; f.js = true; if (n.props.mode === 'senddata') { f.tgSend = true; f.tg = true; } }
    if (n.style && n.style.font) f.fonts.add(n.style.font);
    const scanStr = s => { if (typeof s === 'string') { let m; VAR_RE.lastIndex = 0; while ((m = VAR_RE.exec(s))) f.vars.add(m[1]); } };
    for (const v of Object.values(n.props || {})) {
      if (Array.isArray(v)) v.forEach(it => Object.values(it || {}).forEach(scanStr)); else scanStr(v);
    }
    if (a.value) scanStr(a.value);
    for (const c of (n.children || [])) visit(c);
  };
  visit(root);
  return f;
}

/* ---------- Форматирование HTML ---------- */
const BLOCK_CONT = new Set(['div', 'section', 'header', 'footer', 'nav', 'article', 'form', 'ul', 'ol', 'table', 'thead', 'tbody', 'details']);
const BLOCK_LEAF = new Set(['h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'p', 'li', 'a', 'button', 'label', 'summary', 'tr', 'span', 'img', 'input', 'video', 'hr', 'textarea', 'select', 'code', 'b', 'strong', 'em', 'i']);

function beautifyHtml(html) {
  const tokens = html.split(/(<[^>]+>)/).filter(t => t !== '');
  const lines = [];
  let depth = 0, cur = null, leafTag = null, leafDepth = 0;
  const push = s => lines.push('  '.repeat(Math.max(0, depth)) + s);
  for (const t of tokens) {
    const m = t.match(/^<(\/)?([a-zA-Z0-9]+)/);
    if (leafTag) {
      cur += t;
      if (m) {
        if (m[2].toLowerCase() === leafTag && !VOID.has(leafTag)) leafDepth += m[1] ? -1 : 1;
        if (leafDepth === 0) { push(cur); cur = null; leafTag = null; }
      }
      continue;
    }
    if (!m) { if (t.trim()) push(t.trim()); continue; }
    const tag = m[2].toLowerCase(), closing = !!m[1];
    if (BLOCK_CONT.has(tag)) {

    } else push(t);
  }
  if (cur) push(cur);
  return lines.join('\n');
}

  return css.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\s+/g, ' ').replace(/\s*([{};:,>~])\s*/g, '$1').replace(/;}/g, '}').trim();

/* ---------- Главная функция генерации ---------- */
function generate(project, opts = {}) {
  const mode = opts.mode || 'export';
  const pid = project.pid || 'x';
  const R = '.ps-p-' + pid;
  const tokens = themeTokens(project.page);
  const page = { ...project.page, pageBg: (project.page.tokens && project.page.tokens.pageBg !== undefined) ? project.page.tokens.pageBg : (THEMES[project.page.themeId] || {}).pageBg };
  page.embedMode = opts.embed || project.page.embed || 'transparent';
  const feat = scanFeatures(project.root);
  feat.fill = page.embedMode === 'fill' && mode !== 'edit';
  const includeJs = opts.js !== false && (feat.js || feat.fill);
  const ctx = { mode, pid, project, js: includeJs || mode === 'edit', varMode: opts.varMode || 'raw', now: opts.now };
  if (mode !== 'edit' && opts.noAnim) ctx.mode = 'export';

  nodeRules(project.root, R, tokens, out);

  if (out.hover.length) css += `\n@media (hover: hover) {\n${out.hover.join('\n')}\n}`;
  if (out.tablet.length) css += `\n/* ---- Планшет (от ${BP.tablet}px) ---- */\n@media (min-width: ${BP.tablet}px) {\n${out.tablet.join('\n')}\n}`;
  if (out.desktop.length) css += `\n/* ---- Компьютер (от ${BP.desktop}px) ---- */\n@media (min-width: ${BP.desktop}px) {\n${out.desktop.join('\n')}\n}`;
  if (out.hideMobile.length) css += `\n@media (max-width: ${BP.tablet - 0.02}px) { ${out.hideMobile.join(', ')} { display: none !important; } }`;
  if (out.hideTablet.length) css += `\n@media (min-width: ${BP.tablet}px) and (max-width: ${BP.desktop - 0.02}px) { ${out.hideTablet.join(', ')} { display: none !important; } }`;
  if (out.hideDesktop.length) css += `\n@media (min-width: ${BP.desktop}px) { ${out.hideDesktop.join(', ')} { display: none !important; } }`;
  const fonts = new Set([tokens.font, tokens.headingFont, ...feat.fonts].filter(Boolean));
  const js = includeJs ? [feat.js ? runtimeJs(pid, feat) : '', feat.fill ? fillJs(pid, embedHex(project)) : ''].filter(Boolean).join('\n') : '';

  if (opts.minify) css = minifyCss(css);

/* ============================================================
   06 · МОДЕЛЬ ПРОЕКТА: создание, обход дерева, импорт со схемой, проверки
   ============================================================ */
const PROJECT_VERSION = 1;

function newRoot(children = [], style = {}) {
  return { id: 'page', type: 'page', props: {}, style: { ...style }, children };
}
function newProject({ name = 'Новая страница', themeId = 'dark', root, tokens, templateId, customVars } = {}) {
  const now = Date.now();
  return {
    id: 'p' + uid(10), pid: uid(6), version: PROJECT_VERSION,
    name, createdAt: now, updatedAt: now, openedAt: now, favorite: false, templateId: templateId || null,
    page: { themeId, tokens: tokens || {}, customVars: customVars || [], fullHeight: true },
    root: root || newRoot(),

}

/* ---------- обход дерева ---------- */
function walk(n, fn, parent = null, idx = 0, depth = 0) {

  return res;
}
function countNodes(root) { let c = 0; walk(root, () => { c++; }); return c - 1; }
function isAncestor(root, ancestorId, id) {
  const a = findNode(root, ancestorId);
  if (!a) return false;
  let found = false;
  walk(a.node, n => { if (n.id === id) { found = true; return false; } });
  return found;
}
function reId(node) {
  const n = clone(node);
  walk(n, x => { if (x.type !== 'page') x.id = uid(); });
  return n;
}
function nodeLabel(n) {
  if (!n) return '';
  if (n.name) return n.name;
  const def = COMP[n.type];
  const base = def ? def.label : n.type;
  const t = n.props && (n.props.text || n.props.title || n.props.label || n.props.buttonText);
  if (t && typeof t === 'string') return base + ': ' + t.replace(/\s+/g, ' ').slice(0, 28);
  if (n.type === 'container') {
    const lay = (n.style || {}).layout;
    return lay === 'row' ? 'Строка' : lay === 'grid' ? 'Сетка' : 'Контейнер';

}

  const list = [];
  walk(root, (n, p, i, depth) => {
    if (excludeId && (n.id === excludeId || isAncestor(root, excludeId, n.id))) return;
    if (COMP[n.type] && COMP[n.type].container) list.push({ node: n, depth });
  });
  return list;
}

  const a = [];
  walk(root, n => { if (n.anchor) a.push({ anchor: n.anchor, label: nodeLabel(n) }); });

/* ---------- Импорт JSON со строгой проверкой схемы ---------- */
const LIMITS = { nodes: 3000, depth: 24, str: 200000, items: 200 };

}

  }

  const rootIn = data.root || (data.type === 'page' ? data : null);
  if (!rootIn || rootIn.type !== 'page') return { ok: false, errors: ['Не найден корневой блок страницы (root с type: "page")'] };
