    } else {
      const cnt = t.match(/(\d{1,2})\s*(товар|карточ|позици)/);
      if (cnt) { const n = clamp(+cnt[1], 1, 24); p.root.children.push(this.productGrid(Array.from({ length: n }, (_, i) => ({ name: 'Товар ' + (i + 1), price: (290 + i * 200) + ' ₽' })))); done.push('сетка из ' + n + ' товаров'); }
    }
    for (const b of blocks) { const it = catalogFind(b[1]); if (it) { p.root.children.push(it.make()); done.push('добавил ' + b[2]); } }
    this.applyLook(p, t, done);
    const name = title || this.subject(text);
    if (name) {
      p.name = name;
      let hd = null; walk(p.root, n => { if (!hd && n.type === 'heading' && !String(n.props.text || '').includes('{{')) hd = n; });
      if (hd) { hd.props.text = name; if (!title) done.push('заголовок «' + name + '»'); }
    }
    return { project: p, done };
  },

  /* изменить открытый проект */
  modify(text) {
    const t = this.norm(text), done = [];
    const prods = this.products(text);
    const title = this.quoted(text);
    if (/удали|убери|скрой/.test(t)) {
      const targets = this.findAll(PZ_SECTIONS, t).concat(this.findAll(PZ_BLOCKS, t));
      const word = targets.length ? targets[0][2] : (t.match(/(?:удали|убери|скрой)\s+([а-яa-z0-9]+)/) || [])[1];
      if (!word) return { done, msg: 'Уточните, что удалить: например, «удали FAQ».' };
      let found = null;
      walk(S.project.root, n => { if (!found && n.type !== 'page' && this.norm(nodeLabel(n) + ' ' + (n.name || '') + ' ' + n.type).includes(this.norm(word).slice(0, 5))) found = n; });
      if (!found && /faq|вопрос/.test(t)) walk(S.project.root, n => { if (!found && n.type === 'accordion') found = n; });
      if (!found) return { done, msg: 'Не нашёл на странице блок «' + word + '». Откройте «Слои», чтобы посмотреть, что есть на странице.', mood: 'error' };
      Editor.remove(found.id);
      done.push('удалил «' + nodeLabel(found) + '»');
      return { done };
    }
    const look = [];
    const th = this.findAll(PZ_THEMES, t)[0], col = this.findAll(PZ_COLORS, t)[0];
    if (th || col) {
      Editor.act('Puzzlo: оформление', pr => this.applyLook(pr, t, look), { panel: true, struct: false });
      done.push(...look);
    }
    if (/назови|название|переименуй/.test(t) && title) { Editor.act('Puzzlo: название', pr => { pr.name = title; }, { struct: false }); if (Editor.els.name) Editor.els.name.value = title; done.push('назвал проект «' + title + '»'); }
    else if (/заголов/.test(t) && title) {
      const hd = (() => { let r = null; walk(S.project.root, n => { if (!r && n.type === 'heading') r = n; }); return r; })();
      if (hd) { Editor.setProp(hd.id, ['props', 'text'], title, null, { panel: true }); done.push('поменял главный заголовок'); }
    }
    if (prods.length) { Editor.insert(this.productGrid(prods), { parent: 'page', index: null }); done.push('добавил каталог: ' + prods.map(p => p.name).join(', ')); }
    if (/добав|встав|постав|нужн|сделай/.test(t)) {
      for (const s of this.findAll(PZ_SECTIONS, t)) {
        if (prods.length && s[1] === 's-catalog') continue;
        const sec = SECTIONS.find(x => x.id === s[1]);
        if (sec) { Editor.insert(sec.make(), { parent: 'page', index: null }); done.push('добавил «' + s[2] + '»'); }
      }
      for (const b of this.findAll(PZ_BLOCKS, t)) { const it = catalogFind(b[1]); if (it) { if (it.after && it.after !== 'qr') Editor.addFromCatalog(b[1], { parent: 'page', index: null }); else Editor.insert(it.make(), { parent: 'page', index: null }); done.push('добавил ' + b[2]); } }
    }
    return { done };
  },

  answer(text) {
    const t = this.norm(text);
    if (!t.trim()) return { text: 'Напишите, что сделать.' };
    if (/^(привет|здравствуй|хай|добр)/.test(t) && t.length < 25) return { text: 'Привет! Я Puzzlo. Опишите страницу, которую нужно собрать, — например, «магазин с товарами в тёмном стиле».', mood: 'wave' };
    if (/что ты умеешь|помощ|help|команды|как пользоват/.test(t)) return {
      text: 'Могу помочь собрать страницу:\n- создать страницу по описанию: магазин, тарифы, профиль, игра, курс, FAQ, заявка, промо и другие;\n- добавить секции: баннер, каталог, тарифы, отзывы, контакты, форму, таймер, кнопку «Поделиться»;\n- добавить товары списком: «Футболка 999 ₽, Кружка 490 ₽»;\n- сменить тему и цвет: «сделай тёмным», «зелёный цвет», «тема Telegram»;\n- удалить блок, переименовать проект, открыть экспорт или просмотр;\n- добавить корзину, квиз, слайдер, карту, поиск, QR-код, шторку, кнопку внизу экрана;\n- «проверь страницу» и «исправь всё», «примени изменения», «новый экран», «версии», «облако», «тестовый набор».\n\nЯ работаю на правилах, без интернета и нейросети: понимаю простые фразы. Любое действие можно отменить.',
      btns: [['Открыть базу знаний', 'kb:ai-how']], mood: 'wave',
    };
    if (S.view === 'editor') {
      if (/провер(ь|ка|ить).{0,12}(страниц|качеств|ошибк)|аудит/.test(t)) { const list = QA.run(S.project); QA.dialog(); return { text: list.length ? `Нашёл замечаний: ${list.length}. Открыл список — нажмите на замечание, чтобы перейти к блоку, или «Исправить автоматически».` : 'Проверил все экраны — замечаний нет. Отличная страница!', mood: list.length ? 'error' : 'like' }; }
      if (/исправ(ь|и|ить).{0,10}(вс[её]|ошибк|замечан)/.test(t)) { const n = QA.fixAll(S.project); return { text: n ? 'Исправил автоматически: ' + n + '. Остальное нужно поправить вручную — скажите «проверь страницу».' : 'Автоматически исправлять нечего.', mood: 'like', btns: [['Отменить', 'undo']] }; }
      if (/примени(ть)?|опубликуй/.test(t) && /изменени|правк|вс[её]/.test(t)) { Editor.applyAsk(); return { text: 'Открыл подтверждение — нажмите ✓, чтобы применить изменения.' }; }
      if (/верси/.test(t)) { Versions.dialog(); return { text: 'Открыл историю версий. Версия сохраняется при каждом «Применить».' }; }
      if (/нов(ый|ого) экран|добав(ь|ить) экран/.test(t)) { Editor.addScreen(); return { text: 'Добавил экран рядом. Свяжите экраны кнопкой с действием «Перейти на экран проекта».', mood: 'like' }; }
      if (/сохрани.{0,12}шаблон|мой шаблон/.test(t)) { MyTpl.saveCurrent(); return { text: 'Введите название — шаблон появится в «Шаблоны» → «Мои шаблоны».' }; }
    }
    if (/облак/.test(t)) { Cloud.dialog(); return { text: 'Открыл облако NocoDB: там можно сохранить проект и открыть его на другом устройстве.' }; }
    if (/тестов(ый|ую)? (набор|страниц)|протестир/.test(t)) { TestKit.create(); return { text: 'Создаю тестовый набор: он проверит в PuzzleBot переходы, кнопки Telegram, шторки и экраны.', mood: 'like' }; }
    if (/отмени|верни как было|undo/.test(t)) { if (S.view === 'editor') { Editor.undo(); return { text: 'Отменил последнее действие.', mood: 'like' }; } return { text: 'Сейчас нечего отменять: проект не открыт.' }; }
    if (/экспорт|дай код|скопир.* код|html.?код/.test(t)) { if (S.view === 'editor') { ExportUI.open(); return { text: 'Открыл экспорт. Режим «PuzzleBot: один блок» подходит для блока «HTML код».', mood: 'like' }; } return { text: 'Сначала откройте проект — тогда покажу код.', btns: [['Мои проекты', 'projects']] }; }
    if (/просмотр|предпросмотр|покажи как/.test(t) && S.view === 'editor') { Editor.preview(); return { text: 'Открыл просмотр. Закрыть — кнопка «Редактор» или Esc.' }; }
    if (/переменн/.test(t) && !/добав/.test(t)) return { text: 'Переменные пишутся так: {{FIRST_NAME_TEXT}}. Начните вводить {{ в любом поле — я подскажу варианты.', btns: [['Справочник переменных', 'vars'], ['Статья о переменных', 'kb:vars-how']] };
    if (/вставить в puzzle|в пазлбот|в puzzlebot|разместить/.test(t)) return { text: 'Экспорт → «Копировать код» → в PuzzleBot добавьте блок «HTML код» и вставьте. Подробности — в статье.', btns: [['Как вставить в PuzzleBot', 'kb:export']] };

    const wantsNew = /созда|собери|сгенер|нов(ую|ая|ый) (страниц|проект)|с нуля/.test(t) || (S.view !== 'editor' && /сделай|нужн|хочу/.test(t));
    if (wantsNew || S.view !== 'editor') {
      const r = this.create(text);
      Home.persist(r.project).then(() => { Editor.open(r.project); Canvas.build(); });
      return { text: 'Готово! ' + cap(r.done.join(', ')) + '.\n\nТеперь можно менять тексты на холсте или попросить меня: «добавь отзывы», «сделай зелёным», «удали FAQ».', mood: 'like', btns: [['Открыть экспорт', 'export'], ['Просмотр', 'preview']] };
    }
    const r = this.modify(text);
    if (r.msg) return { text: r.msg, mood: r.mood || 'error' };
    if (r.done.length) return { text: 'Сделал: ' + r.done.join(', ') + '. Если что-то не так — нажмите «Отменить».', mood: 'like', btns: [['Отменить', 'undo']] };
    return { text: 'Не совсем понял. Попробуйте так:\n- «добавь отзывы и контакты»\n- «сделай тёмным» или «зелёный цвет»\n- «создай страницу тарифов»\n- «добавь товары: Футболка 999 ₽, Кружка 490 ₽»', mood: 'error' };
  },
};
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

/* ---------- Окно Puzzlo слева ---------- */
const Puzzlo = {
  open: false, expanded: false, history: false, chats: [], cur: null, el: null,
  async load() {
    const c = await Store.kvGet('puzzloChats', []);
    this.chats = Array.isArray(c) ? c : [];
    this.cur = this.chats[0] || null;
  },
  save() { Store.kvSet('puzzloChats', this.chats.slice(0, 20)); },
  newChat() { this.cur = { id: 'c' + uid(8), title: 'Новый чат', ts: Date.now(), msgs: [] }; this.chats.unshift(this.cur); this.history = false; this.save(); this.render(); },
  mount() {
    if (this.el) this.el.remove();

  },
  toggle(v) { this.open = v === undefined ? !this.open : v; if (this.open) this.mood('wave', 2600); this.render(); if (this.open) setTimeout(() => { const i = this.el.querySelector('.pz-input textarea'); if (i && !isMobile()) i.focus(); }, 60); },
  moodTimer: 0, curMood: 'logo',
  mood(m, ms) {
    this.curMood = m;
    $$('.pz-mascot img', this.el || document).forEach(i => { i.src = MASCOT[m] || MASCOT.logo; });
    clearTimeout(this.moodTimer);
    if (ms) this.moodTimer = setTimeout(() => this.mood('logo'), ms);
  },
  tasks() {
    return [
      { done: S.projects.length > 0, text: 'Создать первую страницу', route: 'templates' },
      { done: !!S.flags.exported, text: 'Скопировать код для PuzzleBot', route: 'kb:export' },
      { done: !!PB.token, text: 'Подключить PuzzleBot', route: 'pb' },
    ];
  },
  render() {
    if (!this.el) return;
    const el = this.el;
    el.innerHTML = '';
    el.classList.toggle('open', this.open);
    el.classList.toggle('in-editor', S.view === 'editor');
    const mascot = h('button', { class: 'pz-mascot', 'aria-label': this.open ? 'Скрыть Puzzlo AI' : 'Открыть Puzzlo AI', title: 'Puzzlo AI', onclick: () => this.toggle() }, mascotImg(this.curMood, 72));
    if (!this.open) { el.append(mascot); return; }
    // верхняя часть: шапка и карточки
    const top = h('div', { class: 'pz-top' },
      h('div', { class: 'pz-head' }, h('b', null, 'Puzzlo Studio House'), h('button', { class: 'pz-x', 'aria-label': 'Закрыть', onclick: () => this.toggle(false) }, ic('x', 20))),
      h('div', { class: 'pz-card' }, h('div', { class: 'pz-row' }, h('span', { class: 'pz-dia' }), h('span', { class: 'grow' }, 'Шаблоны'), h('b', null, TEMPLATES.length + ' шт.')), h('button', { class: 'pz-gray', onclick: () => App.go('templates') }, 'Подробнее')),
      h('div', { class: 'pz-card pz-promo' }, h('b', null, 'База знаний'), h('span', null, 'Ответы о редакторе и PuzzleBot'), h('button', { class: 'pz-gray sm', onclick: () => App.go('kb') }, 'Открыть'), h('i', { class: 'pz-cloud', 'aria-hidden': 'true' })),
      ...this.tasks().map(tk => h('button', { class: 'pz-card pz-task' + (tk.done ? ' done' : ''), onclick: () => App.go(tk.route) }, h('span', { class: 'pz-cb' }, tk.done ? ic('check', 14) : null), h('span', { class: 'grow' }, tk.text), h('span', { class: 'pz-pts' }, tk.done ? 'готово' : '→'))));
    // чат
    if (!this.cur) { this.cur = { id: 'c' + uid(8), title: 'Новый чат', ts: Date.now(), msgs: [] }; this.chats.unshift(this.cur); }
    const msgs = h('div', { class: 'pz-msgs scroll' });
    if (this.history) {
      msgs.append(h('div', { class: 'pz-hist-t' }, 'История чатов'));
      for (const c of this.chats) msgs.append(h('button', { class: 'pz-hist' + (c === this.cur ? ' on' : ''), onclick: () => { this.cur = c; this.history = false; this.render(); } }, h('b', null, c.title), h('small', null, fmtDate(c.ts) + ' · ' + c.msgs.length + ' сообщ.')));
    } else {
      if (!this.cur.msgs.length) msgs.append(h('div', { class: 'pz-empty' }, h('p', null, 'Напишите, что хотите создать или изменить — соберу это в редакторе.'), h('div', { class: 'pz-sugs' }, ['Создай магазин с товарами', 'Что ты умеешь?', 'Сделай страницу тарифов с FAQ'].map(s => h('button', { onclick: () => this.send(s) }, s)))));
      else msgs.append(h('div', { class: 'pz-day' }, h('span', null, 'Сегодня')));
      for (const m of this.cur.msgs) {
        if (m.role === 'user') msgs.append(h('div', { class: 'pz-u' }, m.text));
        else {
          const body = h('div', { class: 'pz-a-t' });
          const typing = this.typing && this.typing.msg === m;
          if (typing) { this.typing.el = body; pzFill(body, m.text.slice(0, this.typing.i), true); msgs.append(h('div', { class: 'pz-a' }, body)); continue; }
          pzFill(body, m.text);
          const btns = (m.btns || []).length ? h('div', { class: 'pz-btns' }, m.btns.map(([l, r]) => h('button', { onclick: () => App.go(r) }, l))) : null;
          msgs.append(h('div', { class: 'pz-a' }, body, btns, h('div', { class: 'pz-tools' },
            h('button', { 'aria-label': 'Копировать', title: 'Копировать', onclick: () => UI.copy(m.text) }, ic('copy', 15)),
            h('button', { 'aria-label': 'Не понравилось', title: 'Не понравилось', class: m.rate === -1 ? 'on' : '', onclick: () => { m.rate = -1; this.save(); this.mood('error', 2500); this.render(); } }, ic('arrow-down', 15)),
            h('button', { 'aria-label': 'Понравилось', title: 'Понравилось', class: m.rate === 1 ? 'on' : '', onclick: () => { m.rate = 1; this.save(); this.mood('heart', 2800); this.render(); } }, ic('heart', 15)))));
        }
      }
    }
    if (!this.history && this.thinking) msgs.append(h('div', { class: 'pz-a' }, h('div', { class: 'pz-dots', 'aria-label': 'Puzzlo печатает' }, h('i'), h('i'), h('i'))));
    this._msgs = msgs;
    const ta = h('textarea', { rows: 1, placeholder: 'Введите сообщение...', 'aria-label': 'Сообщение для Puzzlo', 'data-novar': '' });
    const sendBtn = h('button', { class: 'pz-send', 'aria-label': 'Отправить', disabled: true, onclick: () => { this.send(ta.value); } }, ic('send', 18));
    ta.addEventListener('input', () => { sendBtn.disabled = !ta.value.trim(); ta.style.height = 'auto'; ta.style.height = Math.min(120, ta.scrollHeight) + 'px'; });
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (ta.value.trim()) this.send(ta.value); } });
    const file = h('input', { type: 'file', accept: '.json,image/*', hidden: true });
    file.addEventListener('change', async () => {
      const f = file.files[0]; if (!f) return;
      if (/json/.test(f.type) || /\.json$/i.test(f.name)) { const v = validateImport(await f.text()); if (v.ok) { await Home.persist(v.project); Editor.open(v.project); this.push('assistant', 'Открыл проект из файла «' + f.name + '».', null, 'like'); } else this.push('assistant', 'Не смог открыть файл: ' + v.errors.join('; '), null, 'error'); }
      else { const m = await Media.add(f); if (m) { if (S.view === 'editor') { Editor.insert(mk('image', { src: m.dataUrl, alt: m.name })); this.push('assistant', 'Добавил картинку на страницу и в медиатеку.', null, 'like'); } else this.push('assistant', 'Сохранил картинку в медиатеку.', null, 'like'); } }
      file.value = '';
    });
    const chat = h('div', { class: 'pz-chat' + (this.expanded ? ' expanded' : '') },
      h('div', { class: 'pz-chat-h' },
        h('button', { class: 'pz-ic', 'aria-label': this.expanded ? 'Свернуть чат' : 'Развернуть чат', onclick: () => { this.expanded = !this.expanded; this.render(); } }, ic(this.expanded ? 'chevron-down' : 'chevron-up', 20)),
        h('b', null, 'Puzzlo AI'),
        h('button', { class: 'pz-ic', 'aria-label': 'Новый чат', title: 'Новый чат', onclick: () => this.newChat() }, ic('plus', 19)),
        h('button', { class: 'pz-ic' + (this.history ? ' on' : ''), 'aria-label': 'История чатов', title: 'История чатов', onclick: () => { this.history = !this.history; this.render(); } }, ic('clock', 19))),
      msgs,
      h('div', { class: 'pz-input' }, ta, h('div', { class: 'pz-input-b' }, h('button', { class: 'pz-ic', 'aria-label': 'Прикрепить файл', title: 'Картинка или проект .json', onclick: () => file.click() }, ic('link', 17)), sendBtn), file));
    if (!this.expanded) chat.append(mascot);
    const panel = h('section', { class: 'pz-panel', role: 'dialog', 'aria-label': 'Puzzlo AI' }, top, chat);
    el.append(panel);
    msgs.scrollTop = msgs.scrollHeight;
  },
  /* эффект печати: текст появляется по нескольку символов, кнопки — в конце */
  typeOut(m) {
    clearInterval(this._tt);
    this.typing = { msg: m, i: 0, el: null };
    const total = m.text.length;
    const per = Math.max(1, Math.ceil(total / 110)); // длинные ответы печатаются быстрее (~2 сек максимум)
    this._tt = setInterval(() => {
      const t = this.typing;
      if (!t || t.msg !== m) { clearInterval(this._tt); return; }
      t.i = Math.min(total, t.i + per + (Math.random() < 0.3 ? 1 : 0));
      if (t.el && t.el.isConnected) {
        pzFill(t.el, m.text.slice(0, t.i), true);
        const box = this._msgs; if (box && box.scrollHeight - box.scrollTop - box.clientHeight < 80) box.scrollTop = box.scrollHeight;
      }
      if (t.i >= total) { clearInterval(this._tt); this.typing = null; this.render(); }
    }, 18);
  },
  push(role, text, btns, mood) {
    if (!this.cur) this.newChat();
    const msg = { role, text, btns: btns || null, ts: Date.now() };
    this.cur.msgs.push(msg);
    if (role === 'assistant' && this.open) this.typeOut(msg);
    if (role === 'user' && this.cur.title === 'Новый чат') this.cur.title = text.slice(0, 40);
    this.cur.ts = Date.now();
    this.save();
    if (mood) this.mood(mood, 2800);
    this.render();
  },
  send(text) {
    text = String(text || '').trim();
    if (!text) return;
    this.expanded = true;
    if (this.typing) { clearInterval(this._tt); this.typing = null; }
    this.thinking = true;
    this.push('user', text);
    setTimeout(() => {
      let r;
      try { r = PuzzloAI.answer(text); } catch (e) { console.error(e); r = { text: 'Что-то пошло не так. Попробуйте сформулировать иначе.', mood: 'error' }; }
      this.thinking = false;
      this.push('assistant', r.text, r.btns, r.mood);
    }, 650 + Math.random() * 350);
  },
};

/* ===== 14d-nocodb.js ===== */
/* ============================================================
   14d · ИНТЕГРАЦИЯ С NocoDB (REST API v2)
   Подключение: адрес сервера + API-токен (заголовок xc-token).
   Источник: таблица (TABLE_ID), необязательный вид (VIEW_ID),
   фильтры (поле / условие / значение или {{переменная}}), сортировка, лимит.
   Документация: https://nocodb.com/docs/product-docs/developer-resources/rest-apis
   ============================================================ */
const NC = {
  conf() { const p = S.project; if (!p.page.nocodb) p.page.nocodb = { host: NC_HOST_DEFAULT, token: '', sources: [], cache: {} }; const c = p.page.nocodb; c.sources = c.sources || []; c.cache = c.cache || {}; return c; },
  async api(path, opt = {}) {
    const c = opt.conf || ncConf(S.project) || {};
    const host = String(c.host || NC_HOST_DEFAULT).replace(/\/+$/, '');
    if (!c.token) throw { message: 'Укажите API-токен NocoDB' };
    let r;
    try { r = await fetch(host + path, { headers: { 'xc-token': c.token, Accept: 'application/json' } }); }
    catch (e) { throw { message: `Нет связи с ${host}. Проверьте адрес. Ещё причины: сервер не разрешает запросы со сторонних страниц (CORS) или окно редактора закрывает сеть — тогда откройте файл puzzle-studio.html в браузере.` }; }
    if (r.status === 401 || r.status === 403) throw { message: 'NocoDB отклонил токен (HTTP ' + r.status + '): токен неверный или у него нет доступа к этой базе' };
    if (r.status === 404) throw { message: 'Не найдено (HTTP 404): проверьте ID таблицы или вида' };
    let j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok) throw { message: 'NocoDB вернул ошибку HTTP ' + r.status + (j && (j.msg || j.message) ? ': ' + (j.msg || j.message) : '') };
    return j;
  },
  async bases(conf) { const j = await this.api('/api/v2/meta/bases', { conf }); return (j && j.list) || []; },
  async tables(baseId, conf) { const j = await this.api('/api/v2/meta/bases/' + encodeURIComponent(baseId) + '/tables', { conf }); return (j && j.list) || []; },
  async columns(tableId, conf) {
    const j = await this.api('/api/v2/meta/tables/' + encodeURIComponent(tableId), { conf });
    const cols = ((j && j.columns) || []).filter(c => !c.system || c.pv).map(c => ({ title: c.title, uidt: c.uidt || '', pv: !!c.pv }));
    return { title: (j && j.title) || '', cols };
  },
  sampleVars(s) { return s.replace(VAR_RE, (m, k) => varSample(S.project, k) || ''); },
  async rows(src, conf) {
    const q = [];
    const w = ncWhere(src, v => this.sampleVars(v));
    if (w) q.push('where=' + encodeURIComponent(w));
    if (src.view) q.push('viewId=' + encodeURIComponent(src.view));
    if (src.sort) q.push('sort=' + encodeURIComponent((src.sortDir === 'desc' ? '-' : '') + src.sort));
    q.push('limit=' + clamp(parseInt(src.limit) || 25, 1, 1000));
    const j = await this.api('/api/v2/tables/' + encodeURIComponent(src.table) + '/records?' + q.join('&'), { conf });
    return { rows: (j && j.list) || [], total: j && j.pageInfo ? j.pageInfo.totalRows : null };
  },
  /* строки для показа на холсте: не больше 10, длинные значения обрезаны */
  slim(rows) {
    const cut = v => typeof v === 'string' ? v.slice(0, 400) : Array.isArray(v) ? v.slice(0, 3).map(cut) : (v && typeof v === 'object') ? Object.fromEntries(Object.entries(v).slice(0, 12).map(([k, x]) => [k, cut(x)])) : v;
    return rows.slice(0, 10).map(r => Object.fromEntries(Object.entries(r).slice(0, 40).map(([k, v]) => [k, cut(v)])));
  },
};

  /* окно источника: таблица, поля, фильтры, сортировка, проверка */
  source(id, onDone) {
    const c = NC.conf();
    const orig = id ? c.sources.find(s => s.id === id) : null;
    const s = orig ? clone(orig) : { id: 'nc' + uid(5), name: '', table: '', view: '', one: false, limit: 25, filters: [], sort: '', sortDir: 'asc', cols: [] };

    const say = (t, cls) => { st.className = 'status-line ' + (cls || ''); st.textContent = t; };

    const colOpts = () => [['', '— поле —'], ...s.cols.map(f => [f.title, f.title])];
    const drawCols = () => {
      colsBox.innerHTML = '';
      if (!s.cols.length) { colsBox.append(h('div', { class: 'hint' }, 'Нажмите «Загрузить поля», чтобы увидеть названия колонок таблицы.')); return; }
      const nm = ncSafeName(name.value) || 'Источник';
      colsBox.append(h('div', { class: 'hint' }, 'Нажмите на поле, чтобы скопировать его для вставки в текст:'),
        h('div', { class: 'nc-chips' }, s.cols.map(f => h('button', { class: 'nc-chip' + (f.pv ? ' pv' : ''), title: (f.uidt || '') + (f.pv ? ' · основное поле' : ''), onclick: () => UI.copy('#{' + nm + '.' + f.title + '}', 'Скопировано: #{' + nm + '.' + f.title + '}') }, f.title))));
    };
    const drawFilters = () => {
      filtersBox.innerHTML = '';
      s.filters.forEach((f, i) => {
        const val = h('input', { class: 'inp', value: f.value || '', placeholder: 'значение или {{USER_ID}}' });

        const noVal = ['blank', 'notblank', 'checked', 'notchecked'].includes(f.op);
        filtersBox.append(h('div', { class: 'nc-filter' },
          s.cols.length ? selectEl(colOpts(), f.field || '', v => { f.field = v; }) : (() => { const x = h('input', { class: 'inp', value: f.field || '', placeholder: 'Поле', 'data-novar': '' }); x.addEventListener('input', () => { f.field = x.value; }); return x; })(),
          selectEl(NC_OPS, f.op || 'eq', v => { f.op = v; drawFilters(); }),
          noVal ? h('span', { class: 'muted' }, '—') : val,
          h('button', { class: 'btn icon sm ghost danger', title: 'Убрать условие', 'aria-label': 'Убрать условие', onclick: () => { s.filters.splice(i, 1); drawFilters(); } }, ic('x', 14))));
      });
      filtersBox.append(h('button', { class: 'btn sm', onclick: () => { s.filters.push({ field: (s.cols[0] || {}).title || '', op: 'eq', value: '' }); drawFilters(); } }, ic('plus', 14), 'Условие'),
        h('div', { class: 'hint' }, 'Значение может быть переменной PuzzleBot: {{USER_ID}} — строки только этого пользователя, {{START_PAYLOAD}} — товар из ссылки. Условия соединяются через «И».'));
    };
    const drawSort = () => {
      sortBox.innerHTML = '';
      sortBox.append(h('div', { class: 'nc-filter' },
        s.cols.length ? selectEl([['', 'Без сортировки'], ...s.cols.map(f => [f.title, f.title])], s.sort || '', v => { s.sort = v; }) : (() => { const x = h('input', { class: 'inp', value: s.sort || '', placeholder: 'Поле для сортировки', 'data-novar': '' }); x.addEventListener('input', () => { s.sort = x.value; }); return x; })(),
        selectEl([['asc', 'по возрастанию'], ['desc', 'по убыванию']], s.sortDir || 'asc', v => { s.sortDir = v; })));
    };
    const drawPreview = (rows, total) => {
      preview.innerHTML = '';
      if (!rows || !rows.length) { if (rows) preview.append(h('div', { class: 'hint box' }, 'Запрос выполнен, но строк нет. Проверьте условия (переменные в проверке заменены примерами).')); return; }
      const keys = s.cols.length ? s.cols.map(f => f.title).filter(k => rows.some(r => k in r)).slice(0, 6) : Object.keys(rows[0]).slice(0, 6);
      const host = String(c.host || NC_HOST_DEFAULT).replace(/\/+$/, '');
      preview.append(h('div', { class: 'hint' }, `Получено строк: ${rows.length}${total != null ? ' из ' + total : ''}. Первые строки:`),
        h('div', { class: 'nc-tbl-w' }, h('table', { class: 'nc-tbl' },
          h('thead', null, h('tr', null, keys.map(k => h('th', null, k)))),
          h('tbody', null, rows.slice(0, 5).map(r => h('tr', null, keys.map(k => h('td', null, ncFormat(r[k], host).slice(0, 60)))))))));
    };
    const loadCols = async () => {
      s.table = table.value.trim();
      if (!/^[A-Za-z0-9_-]{3,64}$/.test(s.table)) { say('Укажите ID таблицы (латиница и цифры)', 'bad'); return; }
      say('Загружаю поля…');
      try { const r = await NC.columns(s.table); s.cols = r.cols; if (!name.value.trim() && r.title) name.value = ncSafeName(r.title); say('✓ Таблица «' + (r.title || s.table) + '», полей: ' + r.cols.length, 'ok'); drawCols(); drawFilters(); drawSort(); }
      catch (e) { say(e.message, 'bad'); }
    };
    const test = async () => {
      s.table = table.value.trim(); s.view = view.value.trim();
      if (!s.table) { say('Сначала укажите ID таблицы', 'bad'); return; }
      say('Запрашиваю строки…');
      try { const r = await NC.rows(s); rowsCache = NC.slim(r.rows); drawPreview(r.rows, r.total); say('✓ Запрос работает', 'ok'); }
      catch (e) { say(e.message, 'bad'); drawPreview(null); }
    };
    const pickTable = async () => {
      picker.hidden = false; picker.innerHTML = ''; picker.append(h('div', { class: 'hint' }, 'Загружаю базы…'));
      try {
        const bases = await NC.bases();
        picker.innerHTML = '';
        if (!bases.length) { picker.append(h('div', { class: 'hint box' }, 'Баз не найдено — у токена нет доступа ни к одной базе.')); return; }
        const tbls = h('div', { class: 'nc-pick-list' });
        picker.append(field('База', selectEl([['', '— выберите базу —'], ...bases.map(b => [b.id, b.title])], '', async v => {
          tbls.innerHTML = ''; if (!v) return;
          tbls.append(h('div', { class: 'hint' }, 'Загружаю таблицы…'));
          try { const ts = await NC.tables(v); tbls.innerHTML = ''; ts.forEach(t => tbls.append(h('button', { class: 'row-item', onclick: () => { table.value = t.id; if (!name.value.trim()) name.value = ncSafeName(t.title); picker.hidden = true; loadCols(); } }, ic('table', 14), h('span', { class: 'grow' }, t.title), h('code', { class: 'mono' }, t.id)))); }
          catch (e) { tbls.innerHTML = ''; tbls.append(h('div', { class: 'status-line bad' }, e.message)); }
        })), tbls);
      } catch (e) { picker.innerHTML = ''; picker.append(h('div', { class: 'status-line bad' }, e.message)); }
    };
    const limit = h('input', { class: 'inp', type: 'number', min: 1, max: 1000, value: s.limit || 25 });
    limit.addEventListener('input', () => { s.limit = clamp(parseInt(limit.value) || 25, 1, 1000); });
    const d = UI.dialog({
      title: orig ? 'Источник «' + orig.name + '»' : 'Новый источник NocoDB', cls: 'wide',
      body: [
        field('Название источника', name, { hint: 'Используется в тексте: #{Название.Поле}. Без точек и скобок.' }),
        h('div', { class: 'grp-t' }, 'Таблица'),
        field('ID таблицы (TABLE_ID)', h('div', { class: 'fld' }, table, h('div', { class: 'btn-row' },
          h('button', { class: 'btn sm', onclick: pickTable }, ic('search', 14), 'Выбрать из базы'),
          h('button', { class: 'btn sm', onclick: loadCols }, ic('refresh', 14), 'Загрузить поля'))), { hint: 'ID видно в NocoDB: таблица → «⋯» → Copy table ID, или в адресе запроса …/api/v2/tables/TABLE_ID/records.' }),
        picker,
        field('ID вида (VIEW_ID)', view, { hint: 'Если указать вид, NocoDB применит его фильтры, сортировку и скрытые поля.' }),
        colsBox,
        h('div', { class: 'grp-t' }, 'Какие строки взять'),
        segmented([['list', 'Список строк'], ['one', 'Одна строка']], s.one ? 'one' : 'list', v => { s.one = v === 'one'; if (s.one) { s.limit = 1; limit.value = 1; } }),
        filtersBox,
        field('Сортировка', sortBox),
        field('Сколько строк максимум', limit),
        h('div', { class: 'btn-row' }, h('button', { class: 'btn sm primary', onclick: test }, ic('play', 14), 'Проверить запрос')),
        st, preview,
      ],
      foot: [
        h('button', { class: 'btn', onclick: () => d.close() }, 'Отмена'),
        h('button', { class: 'btn primary', onclick: () => {
          s.name = ncSafeName(name.value); s.table = table.value.trim(); s.view = view.value.trim();
          if (!s.name) { say('Введите название источника', 'bad'); return; }
          if (ncSources(S.project).some(x => x.id !== s.id && x.name.toLowerCase() === s.name.toLowerCase())) { say('Источник с таким названием уже есть', 'bad'); return; }
          if (!/^[A-Za-z0-9_-]{3,64}$/.test(s.table)) { say('Укажите ID таблицы', 'bad'); return; }
          if (s.view && !/^[A-Za-z0-9_-]{3,64}$/.test(s.view)) { say('ID вида: только латиница и цифры', 'bad'); return; }
          s.filters = s.filters.filter(f => f.field);
          const oldName = orig && orig.name;
          Editor.act(orig ? 'Источник NocoDB' : 'Новый источник NocoDB', p => {
            const cc = p.page.nocodb;
            const i = cc.sources.findIndex(x => x.id === s.id);
            if (i >= 0) cc.sources[i] = s; else cc.sources.push(s);
            cc.cache = cc.cache || {}; cc.cache[s.id] = rowsCache;
            // переименование: обновляем #{Старое.Поле} во всех текстах
            if (oldName && oldName !== s.name) for (const r of allScreens(p)) walk(r, n => { for (const [k, v] of Object.entries(n.props || {})) if (typeof v === 'string' && v.includes('#{')) n.props[k] = v.split('#{' + oldName + '.').join('#{' + s.name + '.'); });

  /* быстро вывести данные источника на страницу */
  insertMenu(id) {
    const s = ncSources(S.project).find(x => x.id === id); if (!s) return;
    const d = UI.dialog({
      title: 'Вывести «' + s.name + '» на страницу', cls: 'mid',
      body: [
        h('p', { class: 'hint' }, 'Выберите, как показать данные. Всё можно поменять потом: тексты, порядок, оформление.'),
        h('div', { class: 'nc-ins' },
          h('button', { class: 'nc-ins-b', onclick: () => { d.close(); this.insert(id, 'list'); } }, ic('grid', 22), h('b', null, 'Карточки'), h('small', null, 'Повторяются для каждой строки: картинка, название, поля')),
          h('button', { class: 'nc-ins-b', onclick: () => { d.close(); this.insert(id, 'table'); } }, ic('table', 22), h('b', null, 'Таблица'), h('small', null, 'Колонки — выбранные поля')),
          h('button', { class: 'nc-ins-b', onclick: () => { d.close(); this.insert(id, 'one'); } }, ic('text', 22), h('b', null, 'Значения одной строки'), h('small', null, 'Тексты с полями первой строки'))),
      ],
      foot: [h('button', { class: 'btn', onclick: () => d.close() }, 'Позже')],
    });
  },
  insert(id, kind) {
    const s = ncSources(S.project).find(x => x.id === id); if (!s) return;
    const cols = s.cols || [];
    const isImg = c => /attachment/i.test(c.uidt);
    const img = cols.find(isImg);
    const title = cols.find(c => c.pv && !isImg(c)) || cols.find(c => /SingleLineText|LongText/i.test(c.uidt)) || cols[0];
    const rest = cols.filter(c => c !== img && c !== title && !/^(ID|CreatedTime|LastModifiedTime|CreatedBy|LastModifiedBy|Links|LinkToAnotherRecord|Lookup|Rollup|Formula|Button)$/i.test(c.uidt)).slice(0, 3);
    const ref = c => '#{' + s.name + '.' + c.title + '}';
    if (kind === 'table') {
      Editor.insert(mk('ncTable', { source: id, cols: [title, ...rest].filter(Boolean).slice(0, 4).map(c => ({ field: c.title, title: c.title })) }, {}, null, { name: 'Таблица: ' + s.name }));
    } else if (kind === 'one') {
      Editor.insert(B.card({}, [
        img ? mk('image', { src: ref(img), ratio: '16/9' }) : null,
        title ? B.h(ref(title), 3) : null,
        ...rest.map(c => B.t(c.title + ': ' + ref(c))),

/* ===== 14e-quality.js ===== */
/* ============================================================
   14e · ПРОВЕРКА КАЧЕСТВА СТРАНИЦЫ + ЗАМЕТКИ
   Читаемость, контраст, размеры касания, подписи картинок, пустые ссылки.
   Часть замечаний можно исправить одной кнопкой.
   ============================================================ */
function hexRgb(c) { const m = /^#([0-9a-f]{6})$/i.exec(String(c || '').trim()); if (!m) return null; const n = parseInt(m[1], 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function relLum(rgb) { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]); }
function contrast(a, b) { const l1 = relLum(a), l2 = relLum(b); return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05); }

const QA = {
  /* цвет из стиля: #hex или токен темы */
  color(v, tokens) { if (!v) return null; const s = String(v); if (s.startsWith('token:')) return hexRgb(tokens[s.slice(6)]); return hexRgb(s); },
  run(project) {
    const out = [];
    const tokens = themeTokens(project.page);
    let curScr = null;
    const add = (level, text, scr, id, fix) => out.push({ level, text, scr: curScr, id, fix });
    for (const r of allScreens(project)) {
      const sn = r.scr.name; curScr = r.scr.id;
      let h1 = 0;
      const pageBg = this.color(tokens.bg, tokens) || [255, 255, 255];
      walk(r, (n, par) => {
        if (n.hidden || n.type === 'page') return n.hidden ? false : undefined;
        const st = { ...(((project.page.presets || {})[n.preset] || {}).style || {}), ...(n.style || {}) };
        const L = nodeLabel(n);
        const fs = parseFloat(st.fs);
        if (fs && fs < 12) add('warn', `«${L}»: шрифт ${fs}px — мелко для телефона`, sn, n.id, x => { x.style.fs = 13; });
        const fg = this.color(st.color, tokens), bg = this.color(st.bg, tokens) || pageBg;
        if (fg && contrast(fg, bg) < 3) add('warn', `«${L}»: текст плохо видно на фоне (контраст ${contrast(fg, bg).toFixed(1)})`, sn, n.id, x => { delete x.style.color; });
        if (n.type === 'button') {
          const hh = parseFloat(st.h);
          if (hh && hh < 40) add('warn', `«${L}»: кнопка ниже 40px — по ней трудно попасть пальцем`, sn, n.id, x => { x.style.h = 44; });
          if (!String(n.props.text || '').trim() && n.props.variant !== 'icon') add('warn', `«${L}»: у кнопки нет текста`, sn, n.id);
          if (!n.action || !n.action.type || n.action.type === 'none') if (!n.props.mainBtn) add('info', `«${L}»: кнопка ничего не делает`, sn, n.id);
        }
        if (n.type === 'image' && n.props.src && !String(n.props.alt || '').trim()) add('info', `«${L}»: нет описания картинки (alt) для незрячих`, sn, n.id, x => { x.props.alt = x.name || 'Изображение'; });
        if (n.type === 'heading' && (parseInt(n.props.level) || 2) === 1) h1++;
        if (n.type === 'link' && n.action && n.action.type === 'url' && !String(n.action.value || '').trim()) add('warn', `«${L}»: пустая ссылка`, sn, n.id);
        if ((n.type === 'text' || n.type === 'heading') && !String(n.props.text || '').trim()) add('info', `«${L}»: пустой текст`, sn, n.id);
        if (n.type === 'image' && /^data:/.test(n.props.src || '') && n.props.src.length > 700000) add('warn', `«${L}»: картинка весит больше 500 КБ — страница будет грузиться медленно`, sn, n.id);
      });
      if (h1 > 1) add('info', `${sn}: заголовков H1 — ${h1}. Обычно H1 один на страницу`, sn, null);
    }
    return out;
  },
  fixAll(project) {
    let n = 0;
    const list = this.run(project).filter(i => i.fix && i.id);
    Editor.act('Исправление по проверке качества', p => {
      for (const it of list) { const r = allScreens(p).find(x => x.scr.id === it.scr); const f = r && findNode(r, it.id); if (f) { f.node.style = f.node.style || {}; it.fix(f.node); n++; } }
    }, { panel: true });
    return n;
  },
  dialog() {
    const body = h('div', { class: 'qa' });
    const draw = () => {
      body.innerHTML = '';
      const list = this.run(S.project);
      const fixable = list.filter(i => i.fix).length;
      const score = Math.max(0, 100 - list.reduce((s, i) => s + (i.level === 'warn' ? 8 : 3), 0));
      body.append(h('div', { class: 'qa-score' }, h('b', { class: score >= 85 ? 'ok' : score >= 60 ? 'mid' : 'bad' }, String(score)), h('span', null, score >= 85 ? 'Страница в хорошем состоянии' : score >= 60 ? 'Есть что улучшить' : 'Много замечаний — стоит поправить')));
      if (!list.length) body.append(h('div', { class: 'issue info' }, ic('check', 15), h('span', null, 'Замечаний нет')));
      for (const it of list) body.append(h('button', { class: 'issue ' + it.level, onclick: () => { d.close(); const r = allScreens(S.project).find(x => x.scr.id === it.scr); if (r && it.id) Editor.switchScreen(r.scr.id, it.id); } }, ic(it.level === 'warn' ? 'info' : 'help', 15), h('span', { class: 'grow' }, it.text), it.fix ? h('small', { class: 'qa-fix' }, 'исправимо') : null));
      fixBtn.disabled = !fixable; fixBtn.textContent = fixable ? 'Исправить автоматически (' + fixable + ')' : 'Нечего исправлять автоматически';
    };
    const fixBtn = h('button', { class: 'btn primary', onclick: () => { const n = this.fixAll(S.project); UI.toast('Исправлено: ' + n + '. Отменить — Ctrl+Z', { icon: 'check' }); draw(); } });
    const d = UI.dialog({ title: 'Проверка качества', cls: 'mid', body: [h('p', { class: 'hint' }, 'Проверяю все экраны: размер шрифта, контраст, размер кнопок, подписи картинок, пустые ссылки и тексты. Нажмите на замечание, чтобы перейти к блоку.'), body], foot: [h('button', { class: 'btn', onclick: () => d.close() }, 'Закрыть'), fixBtn] });
    draw();
  },
  notes() {
    const list = [];
    for (const r of allScreens(S.project)) walk(r, n => { if (n.note) list.push({ r, n }); });
    const d = UI.dialog({ title: 'Заметки · ' + list.length, cls: 'mid', body: list.length ? list.map(({ r, n }) => h('button', { class: 'row-item note-row', onclick: () => { d.close(); Editor.switchScreen(r.scr.id, n.id); S.inspTab = 'content'; Inspector.render(); } }, h('span', { class: 'note-pin' }, '💬'), h('span', { class: 'grow' }, h('b', null, nodeLabel(n)), h('small', null, r.scr.name + ' · ' + n.note)))) : [h('div', { class: 'empty' }, h('p', null, 'Заметок пока нет. Выберите блок → «Контент» → «Заметка».'))] });
  },
};

/* ---------- Облако: проекты в таблице NocoDB ----------
   Таблица: колонки project_id (SingleLineText), name (SingleLineText), data (LongText), updated (SingleLineText).
   Токен облака хранится только в этом браузере и никогда не попадает в код страниц. */
const Cloud = {
  conf() { try { return JSON.parse(localStorage.getItem('ps-cloud') || 'null') || {}; } catch (e) { return {}; } },
  save(c) { try { localStorage.setItem('ps-cloud', JSON.stringify(c)); } catch (e) {} },
  ready() { const c = this.conf(); return !!(c.token && c.table); },
  async req(method, path, body) {
    const c = this.conf(), host = String(c.host || NC_HOST_DEFAULT).replace(/\/+$/, '');
    let r;
    try { r = await fetch(host + path, { method, headers: { 'xc-token': c.token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }); }
    catch (e) { throw { message: 'Нет связи с ' + host + ' (сеть или CORS). Откройте файл puzzle-studio.html в браузере.' }; }
    if (r.status === 401 || r.status === 403) throw { message: 'Токен облака не подходит или у него нет прав на запись' };
    if (r.status === 404) throw { message: 'Таблица не найдена — проверьте ID' };
    let j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok) throw { message: 'NocoDB: HTTP ' + r.status + (j && (j.msg || j.message) ? ' — ' + (j.msg || j.message) : '') };
    return j;
  },
  async list() { const c = this.conf(); const j = await this.req('GET', `/api/v2/tables/${encodeURIComponent(c.table)}/records?fields=${encodeURIComponent('Id,project_id,name,updated')}&limit=200&sort=-updated`); return (j && j.list) || []; },
  async push(p = S.project) {
    const c = this.conf();
    const data = projectFileJson(p);
    if (data.length > 4.5e6) throw { message: 'Проект больше 4,5 МБ — уберите встроенные картинки (используйте ссылки)' };
    const found = await this.req('GET', `/api/v2/tables/${encodeURIComponent(c.table)}/records?where=${encodeURIComponent('(project_id,eq,' + p.id + ')')}&limit=1&fields=Id`);
    const row = { project_id: p.id, name: p.name, data, updated: new Date().toISOString() };
    const ex = found && found.list && found.list[0];
    if (ex) await this.req('PATCH', `/api/v2/tables/${encodeURIComponent(c.table)}/records`, [{ Id: ex.Id, ...row }]);
    else await this.req('POST', `/api/v2/tables/${encodeURIComponent(c.table)}/records`, row);
    c.last = Date.now(); this.save(c);
  },
  async pull(id) {
    const c = this.conf();
    const j = await this.req('GET', `/api/v2/tables/${encodeURIComponent(c.table)}/records/${encodeURIComponent(id)}`);
    const v = validateImport(j && j.data || '');
    if (!v.ok) throw { message: 'Проект в облаке повреждён: ' + v.errors.join('; ') };
    let orig = null; try { orig = JSON.parse(j.data).project; } catch (e) {}
    if (orig && /^p[a-z0-9]{6,16}$/i.test(orig.id || '')) v.project.id = orig.id; // тот же проект — перезапишется локальная копия
    return v.project;
  },
  dialog() {
    const c = this.conf();
    const host = h('input', { class: 'inp', value: c.host || NC_HOST_DEFAULT, 'data-novar': '' });
    const token = h('input', { class: 'inp', type: 'password', value: c.token || '', placeholder: 'Токен с правом записи', 'data-novar': '', autocomplete: 'off' });
    const table = h('input', { class: 'inp mono', value: c.table || '', placeholder: 'ID таблицы проектов', 'data-novar': '' });
    const st = h('div', { class: 'status-line' });
    const listBox = h('div', { class: 'ver-list' });
    const say = (t, cls) => { st.className = 'status-line ' + (cls || ''); st.textContent = t; };
    let autoOn = !!c.auto;
    const store = () => this.save({ ...this.conf(), host: host.value.trim() || NC_HOST_DEFAULT, token: token.value.trim(), table: table.value.trim(), auto: autoOn });
    const refresh = async () => {
      store(); listBox.innerHTML = '';
      if (!this.ready()) { say('Укажите токен и ID таблицы', 'bad'); return; }
      say('Загружаю список…');
      try {
        const rows = await this.list();
        say('✓ Облако подключено. Проектов: ' + rows.length, 'ok');
        for (const r of rows) listBox.append(h('div', { class: 'ver' }, h('span', { class: 'ver-dot' }), h('span', { class: 'grow' }, h('b', null, r.name || r.project_id), h('small', null, r.updated ? new Date(r.updated).toLocaleString('ru-RU') : '')),

const ExportUI = {
  opts: { mode: 'puzzlebot', js: true, minify: false, tgScript: true },

  open(params = {}) {
    if (!S.project) return;
    // как в PuzzleBot: в код попадает применённая версия; перед экспортом предлагаем применить правки
    if (!params.ready && Editor.isDirty()) {
      Editor.applyConfirm('Есть неприменённые изменения. Применить их перед экспортом кода?').then(ok => {
        if (ok) { Editor.applyNow(); this.open({ ...params, ready: true }); }
        else this.open({ ...params, ready: true, project: Editor.appliedProject() });
      });
      return;
    }
    this.P = params.project || S.project;
    Editor.saveNow();
    const o = this.opts;
    const scrs = allScreens(this.P);
    o.screen = params.screen || this.P.root.scr.id;
    if (!o.screensMode) o.screensMode = 'pages';
    let current = null, tab = 0;
    const side = h('div', { class: 'exp-side' });
    const main = h('div', { class: 'exp-main' });
    const codeBar = h('div', { class: 'code-bar' });
    const pre = h('pre', { class: 'code', tabindex: '0', 'aria-label': 'Итоговый код' });
    main.append(codeBar, pre);
    const rebuild = () => {
      current = safe(() => buildExport(this.P, o), null);
      if (!current) { pre.textContent = 'Не удалось собрать код. Проверьте проект.'; return; }
      if (tab >= current.parts.length) tab = 0;
      drawSide(); drawCode();
    };
    const drawCode = () => {
      codeBar.innerHTML = '';
      const tabs = h('div', { class: 'tabs', role: 'tablist' });
      current.parts.forEach((p, i) => tabs.append(h('button', { class: i === tab ? 'on' : '', role: 'tab', onclick: () => { tab = i; drawCode(); } }, p.tab)));
      const part = current.parts[tab];
      const size = new Blob([part.code]).size;
      codeBar.append(tabs, h('span', { class: 'muted', style: { fontSize: '12px' } }, fmtBytes(size)),
        h('button', { class: 'btn sm', onclick: () => this.download(part.code, part.file, 'text/' + (part.lang === 'js' ? 'javascript' : part.lang)) }, ic('download', 14), 'Файл'),
        h('button', { class: 'btn sm primary', onclick: () => { S.flags.exported = true; Store.kvSet('flags', S.flags); UI.copy(part.code, 'Код скопирован в буфер обмена'); } }, ic('copy', 14), current.parts.length > 1 ? 'Копировать ' + part.tab : 'Копировать код'));
      pre.innerHTML = part.code.length > 400000 ? escHtml(part.code) : highlight(part.code, part.lang);
      pre.scrollTop = 0;
    };
    const drawSide = () => {
      side.innerHTML = '';
      if (scrs.length > 1) {
        side.append(h('div', { class: 'grp-t' }, 'Экраны проекта · ' + scrs.length),
          segmented([['pages', 'Отдельные страницы'], ['single', 'Всё в одном блоке']], o.screensMode, v => { o.screensMode = v; tab = 0; rebuild(); }),
          h('div', { class: 'hint' }, o.screensMode === 'single' ? 'Все экраны в одном HTML-блоке: кнопки переключают экраны без перезагрузки. Ссылки PuzzleBot не нужны.' : 'Каждый экран — своя страница Mini App в PuzzleBot со своим блоком «HTML код». Кнопки переходят через goto_web_page по ссылкам экранов.'));
        if (o.screensMode === 'pages') side.append(field('Код какого экрана', selectEl(scrs.map((r, i) => [r.scr.id, (i + 1) + '. ' + r.scr.name + (r.scr.pbId ? ' · ' + r.scr.pbId : '')]), o.screen, v => { o.screen = v; tab = 0; rebuild(); })));
      }
      side.append(h('div', { class: 'grp-t' }, 'Куда вставлять'));
      for (const m of EXPORT_MODES) {
        side.append(h('button', { class: 'mode-opt' + (o.mode === m.id ? ' on' : ''), 'aria-pressed': String(o.mode === m.id), onclick: () => { o.mode = m.id; tab = 0; rebuild(); } }, h('b', null, h('i', null, m.short), m.label), h('span', null, m.desc)));
      }
      if (o.mode === 'puzzlebot' || o.mode === 'pbhead' || o.mode === 'split' || o.mode === 'fragment') side.append(h('div', { class: 'grp-t' }, 'Фон в PuzzleBot'), ...Inspector.embedCtl(() => rebuild()));
      side.append(h('button', { class: 'btn sm block', onclick: () => PBUI.mcpDialog() }, ic('send', 14), 'Отправить в PuzzleBot (MCP)'));
      side.append(h('div', { class: 'grp-t' }, 'Параметры'),
        toggle('JavaScript для интерактива', o.js, v => { o.js = v; rebuild(); }),
        toggle('Минифицировать', o.minify, v => { o.minify = v; rebuild(); }),
        ...(o.mode === 'document' ? [toggle('Подключить telegram-web-app.js', o.tgScript, v => { o.tgScript = v; rebuild(); })] : []));
      const lintScr = scrs.length > 1 && o.screensMode === 'single' ? scrs : [screenById(this.P, o.screen) || this.P.root];
      const issues = [];
      for (const r of lintScr) for (const it of lintProject(projectForScreen(this.P, r), { js: o.js, screensMode: o.screensMode })) issues.push({ ...it, scr: r.scr.id, text: (lintScr.length > 1 ? r.scr.name + ': ' : '') + it.text });
      const order = { error: 0, warn: 1, info: 2 };
      issues.sort((a, b) => order[a.level] - order[b.level]);
      const errs = issues.filter(i => i.level === 'error').length, warns = issues.filter(i => i.level === 'warn').length;
      side.append(h('div', { class: 'grp-t' }, `Проверка · ошибок ${errs}, предупреждений ${warns}`));

      if (!issues.length) box.append(h('div', { class: 'issue info' }, ic('check', 15), h('span', null, 'Замечаний нет')));
      for (const it of issues.slice(0, 60)) {
        const icon = it.level === 'error' ? 'alert' : it.level === 'warn' ? 'info' : 'help';
        box.append(it.nodeId ? h('button', { class: 'issue ' + it.level, title: 'Показать блок', onclick: () => { d.close(); Editor.switchScreen(it.scr, it.nodeId); if (isMobile()) Editor.setMpane('props'); } }, ic(icon, 15), h('span', null, it.text)) : h('div', { class: 'issue ' + it.level }, ic(icon, 15), h('span', null, it.text)));
      }
      side.append(box);
      if (current.notes.length) side.append(h('div', { class: 'grp-t' }, 'Важно'), ...current.notes.map(t => h('div', { class: 'hint box' }, t)));
      side.append(h('div', { class: 'grp-t' }, 'Как разместить'), h('ol', { class: 'steps' }, (EXPORT_GUIDE[o.mode] || []).map(s => h('li', null, s))));
      side.append(h('div', { class: 'hint box warn' }, 'Способ вставки HTML в PuzzleBot не описан в открытой документации, которую удалось проверить. После вставки обязательно откройте страницу в Telegram на телефоне.'));
      side.append(h('div', { class: 'btn-row' },
        h('button', { class: 'btn sm', onclick: () => this.zip(current) }, ic('download', 14), 'ZIP-архив'),
        h('button', { class: 'btn sm', onclick: () => this.downloadProject(this.P) }, ic('file', 14), 'Проект JSON')),
        h('div', { class: 'hint' }, 'Скачивание может попросить подтверждение. Если файл не сохранился, используйте «Копировать».'));
    };
    const d = UI.dialog({ title: 'Экспорт: ' + this.P.name + (this.P !== S.project ? ' · последняя применённая версия' : ''), body: h('div', { class: 'exp' }, side, main), cls: 'wide', full: true });
    d.body.style.padding = '0';
    rebuild();
  },

  async download(text, name, type = 'text/plain') {
    saveMsg(await saveFile(new Blob([text], { type: type + ';charset=utf-8' }), name), name);
  },
  zip(current) {
    const base = slugName(this.P.name);
    const g = current.gen;
    const files = [];
    if (this.opts.mode === 'document') files.push({ name: 'index.html', data: current.single });
    else {
      const full = buildExport(this.P, { ...this.opts, mode: 'document' });
      files.push({ name: 'index.html', data: full.single });
      files.push({ name: 'puzzlebot-block.html', data: buildExport(this.P, { ...this.opts, mode: 'puzzlebot' }).single });
      files.push({ name: 'page.html', data: g.html });
      files.push({ name: 'style.css', data: (g.fontsHref ? `@import url("${g.fontsHref}");\n` : '') + g.css });
      if (g.js) files.push({ name: 'script.js', data: g.js });
    }
    const scrs = allScreens(this.P);
    if (scrs.length > 1) scrs.forEach((r, i) => files.push({ name: `screens/${i + 1}-${slugName(r.scr.name)}${r.scr.pbId ? '-' + r.scr.pbId : ''}.html`, data: buildExport(this.P, { ...this.opts, mode: 'puzzlebot', screensMode: 'pages', screen: r.scr.id }).single }));
    files.push({ name: 'project.json', data: projectFileJson(this.P) });
    files.push({ name: 'README.txt', data: `Puzzle Studio — ${this.P.name}\n\nindex.html — самостоятельная страница (хостинг / Mini App по ссылке)\npuzzlebot-block.html — один блок со стилями для вставки в PuzzleBot\npage.html, style.css, script.js — те же части по отдельности\nproject.json — исходный проект: его можно снова открыть в Puzzle Studio через «Импорт»\n\nПеременные вида {{ИМЯ}} сохранены как есть — значения подставляет бот.\n` });
    saveFile(makeZip(files), base + '.zip').then(st => saveMsg(st, base + '.zip'));
  },
  downloadProject(p) { this.download(projectFileJson(p), slugName(p.name) + '.puzzle.json', 'application/json'); },
  async backupAll() {

        let n = 0;

      title: 'AI-генерация страниц', cls: 'mid',
      body: [
        h('div', { class: 'hint box warn' }, h('b', null, 'Интеграция не настроена. '), 'В Puzzle Studio нет подключённого AI-сервиса, поэтому кнопка «Создать» недоступна. Готовые ответы не подставляются вместо генерации.'),
        field('Описание страницы', ta),
        h('button', { class: 'btn primary', disabled: true, title: 'Нужен подключённый AI API' }, ic('wand', 15), 'Создать (недоступно)'),
        h('div', { class: 'grp-t' }, 'Что можно сделать сейчас'),
        h('ol', { class: 'steps' },
          h('li', null, 'Опишите страницу в поле выше и нажмите «Скопировать запрос для AI».'),
          h('li', null, 'Вставьте запрос в любой чат с AI (например, Claude) и получите JSON.'),
          h('li', null, 'Вернитесь сюда, нажмите «Импорт JSON» и вставьте ответ — страница откроется в редакторе, её можно дальше править.')),
        h('div', { class: 'btn-row' },
          h('button', { class: 'btn', onclick: () => UI.copy(promptText + (ta.value.trim() || 'страница для Telegram-бота'), 'Запрос скопирован') }, ic('copy', 15), 'Скопировать запрос для AI'),
          h('button', { class: 'btn', onclick: () => { d.close(); this.importDialog(!!S.project && S.view === 'editor'); } }, ic('upload', 15), 'Импорт JSON')),
        h('div', { class: 'hint' }, 'Подготовленная архитектура: AI должен возвращать ту же JSON-модель проекта, что сохраняет редактор. Она проходит ту же проверку схемы, что и обычный импорт.'),
      ],
    });
  },
};

/* ===== 16-main.js ===== */
/* ============================================================
   16 · ЗАПУСК ПРИЛОЖЕНИЯ, НАСТРОЙКИ, TELEGRAM
   ============================================================ */
const App = {
  loadedFonts: new Set(),
  tg: null,

  ensureFonts(keys) {
    const fresh = (keys || []).filter(k => FONTS[k] && FONTS[k].g && !this.loadedFonts.has(k));
    if (!fresh.length) return;
    fresh.forEach(k => this.loadedFonts.add(k));
    const href = googleFontsHref(fresh);
    if (href) document.head.append(h('link', { rel: 'stylesheet', href }));
  },

  resolveUi() {
    const s = S.settings.ui;
    if (s === 'dark' || s === 'light') return s;
    if (this.tg && this.tg.colorScheme) return this.tg.colorScheme === 'light' ? 'light' : 'dark';
    const host = document.documentElement.getAttribute('data-theme');
    if (host === 'light' || host === 'dark') return host;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  },
  applyUi() {
    const v = this.resolveUi();
    document.documentElement.dataset.ui = v;
    try { if (this.tg && this.tg.setHeaderColor) this.tg.setHeaderColor(v === 'light' ? '#ffffff' : '#14161c'); if (this.tg && this.tg.setBackgroundColor) this.tg.setBackgroundColor(v === 'light' ? '#eef0f5' : '#0d0e12'); } catch (e) {}
  },
  toggleUi() { S.settings.ui = this.resolveUi() === 'light' ? 'dark' : 'light'; this.applyUi(); this.saveSettings(); },
  saveSettings() { Store.kvSet('settings', S.settings); },

  /* Переходы из статей базы знаний, чата Puzzlo и подсказок */
  go(route) {
    const r = String(route || '');
    const home = tab => { S.homeTab = tab; if (S.view === 'editor') Editor.close().then(() => Home.render()); else Home.render(); };
    const needProject = fn => {
      if (S.view === 'editor' && S.project) return fn();
      const last = S.projects.slice().sort((a, b) => (b.openedAt || 0) - (a.openedAt || 0))[0];
      if (last) { Editor.open(last); setTimeout(fn, 150); return; }
      UI.toast('Сначала создайте или откройте страницу');
      home('templates');
    };
    if (r.startsWith('kb:')) return KBView.open(r.slice(3));
    if (r.startsWith('url:')) { const u = r.slice(4); if (/^https:\/\/t\.me\//.test(u)) window.open(u, '_blank', 'noopener'); return; }
    switch (r) {
      case 'kb': KBView.art = null; KBView.cat = null; return home('kb');
      case 'templates': case 'projects': case 'mine': case 'media': case 'settings': return home(r);
      case 'new': return Home.newBlank();
      case 'mcp': return PBUI.mcpDialog();
      case 'pb': return PBUI.dialog(() => { if (S.view === 'home') Home.render(); Puzzlo.render(); });
      case 'ai': return Puzzlo.toggle(true);
      case 'export': return needProject(() => ExportUI.open());
      case 'preview': return needProject(() => Editor.preview());
      case 'undo': return S.view === 'editor' ? Editor.undo() : null;
      case 'vars': return needProject(() => { Editor.setRtab('add'); S.leftTab = 'vars'; Editor.renderLeft(); if (isMobile()) Editor.setMpane('add'); });
      case 'page': return needProject(() => { Editor.select(null); Editor.setRtab('props'); if (isMobile()) Editor.setMpane('props'); });
      default: UI.toast('Раздел не найден: ' + r);
    }
  },
  syncTelegramBack() {
    const bb = this.tg && this.tg.BackButton;
    if (!bb) return;
    try { if (S.view === 'editor') bb.show(); else bb.hide(); } catch (e) {}
  },

  async boot() {
    const app = $('#app');
    app.append(h('div', { class: 'empty', style: { margin: 'auto' } }, h('span', { class: 'logo-mark', html: iconSvg('logo', 18), style: { width: '40px', height: '40px', borderRadius: '12px' } }), h('p', null, 'Загрузка Puzzle Studio…')));
    // Telegram Mini App: используем только если действительно открыто внутри Telegram
    try {
      const w = window.Telegram && window.Telegram.WebApp;
      if (w && w.initData) {
        this.tg = w; w.ready(); w.expand();
        if (w.disableVerticalSwipes) w.disableVerticalSwipes();
        w.onEvent && w.onEvent('themeChanged', () => this.applyUi());
        w.BackButton && w.BackButton.onClick(() => { if (S.view === 'editor') Editor.close(); });
      }
    } catch (e) { console.warn('Telegram WebApp:', e); }
    this.applyUi();
    PB.load();
    VarSuggest.init();
    await Store.init();
    const [settings, projects, media, myComps, favTpl] = await Promise.all([
      Store.kvGet('settings', null), Store.all('projects').catch(() => []), Store.all('media').catch(() => []), Store.kvGet('myComps', []), Store.kvGet('favTpl', []),
    ]);
    if (settings) Object.assign(S.settings, settings, settings.v === 2 ? {} : { ui: 'light', v: 2 });
    // повреждённые записи не должны ронять приложение
    S.projects = (projects || []).filter(p => p && p.root && p.root.type === 'page' && p.id).map(p => { if (!p.pid) p.pid = uid(6); if (!p.page) p.page = { themeId: 'dark', tokens: {} }; return p; });
    S.media = (media || []).sort((a, b) => b.createdAt - a.createdAt);
    S.myComps = Array.isArray(myComps) ? myComps : [];
    S.favTpl = Array.isArray(favTpl) ? favTpl : [];
    this.applyUi();
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (S.settings.ui === 'system') this.applyUi(); });
    if (Store.mode === 'memory') UI.toast('Хранилище браузера недоступно — проекты не сохранятся после закрытия. Скачивайте JSON.', { err: true, ms: 7000 });
    S.flags = (await Store.kvGet('flags', {})) || {};
    await Puzzlo.load();
    Puzzlo.mount();
    if (!S.projects.length) S.homeTab = 'templates';
    Home.render();
    document.addEventListener('keydown', e => Editor.key(e));
    window.addEventListener('beforeunload', () => { if (S.project) Editor.saveNow(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S.project) Editor.saveNow(); });
    let lastMobile = isMobile();
    window.addEventListener('resize', debounce(() => {
      const m = isMobile();
      if (m !== lastMobile && S.view === 'editor') { lastMobile = m; Editor.setMpane(null); Editor.renderLeft(); Inspector.render(); }
      lastMobile = m;
    }, 150));
  },
};

window.addEventListener('error', e => { console.error(e.error || e.message); if (document.body) UI.toast('Внутренняя ошибка. Проект сохранён; если что-то пропало — нажмите «Отменить».', { err: true, ms: 5000 }); });
window.addEventListener('unhandledrejection', e => { console.error(e.reason); });

App.ensureFonts(['opensans', 'mono']);
App.boot();

})();
</script>
