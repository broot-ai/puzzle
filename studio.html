    if (depth > LIMITS.depth) { warnings.push('Слишком глубокая вложенность — часть блоков пропущена'); return null; }
    if (++count > LIMITS.nodes) { if (count === LIMITS.nodes + 1) warnings.push('Слишком много блоков — лишние пропущены'); return null; }
    const def = COMP[n.type];
    if (!def) { warnings.push('Пропущен неизвестный блок «' + String(n.type).slice(0, 30) + '»'); return null; }
    if (n.type === 'page' && depth > 0) return null;
    let id = n.type === 'page' ? 'page' : (typeof n.id === 'string' && /^[a-z][a-z0-9]{2,15}$/.test(n.id) && !seen.has(n.id) ? n.id : uid());

    if (typeof n.anchor === 'string' && /^[a-z0-9_-]{1,40}$/i.test(n.anchor)) out.anchor = n.anchor;
    if (n.locked) out.locked = true;
    if (n.hidden) out.hidden = true;

  if (pageIn.tokens && typeof pageIn.tokens === 'object') {
    for (const [k] of TOKEN_COLORS) if (pageIn.tokens[k] && CSS.color(pageIn.tokens[k])) page.tokens[k] = pageIn.tokens[k];
    for (const k of ['radius', 'btnRadius', 'gap', 'contentWidth']) if (isFinite(parseFloat(pageIn.tokens[k]))) page.tokens[k] = parseFloat(pageIn.tokens[k]);
    for (const k of ['font', 'headingFont']) if (FONTS[pageIn.tokens[k]]) page.tokens[k] = pageIn.tokens[k];
    if (SHADOWS[pageIn.tokens.shadow]) page.tokens.shadow = pageIn.tokens.shadow;

  }
  if (Array.isArray(pageIn.customVars)) page.customVars = pageIn.customVars.filter(v => v && /^[A-Za-z0-9_]{1,40}$/.test(v.key)).slice(0, 100).map(v => ({ key: v.key, desc: String(v.desc || '').slice(0, 120), sample: String(v.sample || '').slice(0, 200) }));

/* ---------- Проверка проекта перед экспортом ---------- */
function lintProject(project, opts = {}) {
  const issues = [];

      const c = checkUrl(p.src, { allowData: true, allowAnchor: false });

      else if (!c.ok) add('error', `«${L}»: адрес изображения некорректен (${c.reason})`, n.id);

    if (n.type === 'video') {

      else if (p.mode !== 'webhook') add('info', `«${L}»: форма только показывает сообщение — данные никуда не отправляются`, n.id);

  });
  if (empties) add('info', `Пустых контейнеров: ${empties}. В итоговом коде они займут место только за счёт отступов`);
  // переменные: свои (нужно создать в PuzzleBot) и варианты «ссылкой»
  const catalog = allVars(project);
  const ex = [...usedVars].filter(k => (catalog.find(v => v.key === k) || {}).example);
  if (ex.length) add('warn', `Создайте в PuzzleBot → Переменные: ${ex.map(k => '{{' + k + '}}').join(', ')}. Иначе вместо них останется текст в скобках`);
  const links = [...usedVars].filter(k => (catalog.find(v => v.key === k) || {}).link);
  if (links.length) add('info', `${links.map(k => '{{' + k + '}}').join(', ')} — вариант «ссылкой». Если в тексте появится лишняя разметка ссылки, замените на ${links.map(k => k + '_TEXT').join(', ')}`);
  // токен PuzzleBot не должен оказаться в странице
  const dump = JSON.stringify(project.root);
  if (PB.token && PB.token.length > 7 && dump.includes(PB.token)) add('error', 'В странице найден ваш API-токен PuzzleBot. Удалите его: код страницы видит любой пользователь');
  else if (/api\.puzzlebot\.top|[?&]token=/i.test(dump)) add('warn', 'В странице есть адрес API PuzzleBot или параметр token. Не размещайте токены в HTML — их может прочитать любой');
  for (const v of usedVars) if (!known.has(v)) add('info', `Переменная {{${v}}} не найдена в справочнике. Это не ошибка, если она есть в вашем боте`);
  if (usedVars.size) add('info', `Используется переменных: ${usedVars.size}. Синтаксис {{ИМЯ}} сохранён без изменений`);
  const tokens = themeTokens(project.page);
  const gf = googleFontsHref([tokens.font, tokens.headingFont]);
  if (gf) add('info', 'Шрифты загружаются с fonts.googleapis.com. Если хост заблокирует загрузку, браузер покажет системный шрифт');
  return issues;
}

/* ---------- ZIP без библиотек (метод STORE, без сжатия) ---------- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(buf) { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  for (const f of files) {
    const name = enc.encode(f.name);
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

/* ---------- Подсветка синтаксиса (лёгкая, без библиотек) ---------- */
function highlight(code, lang) {
  const out = [];
  let re;
  if (lang === 'css') re = /(\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*")|(@[a-z-]+)|([.#][a-zA-Z_][\w-]*)|([a-z-]+)(?=\s*:)|(#[0-9a-fA-F]{3,8}\b|-?\d*\.?\d+(?:px|%|rem|em|ms|s|vh|vw|dvh|deg)?)/g;
  else if (lang === 'js') re = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\b(var|function|return|if|else|for|new|typeof|true|false|null|document|window)\b|(\b\d+(?:\.\d+)?\b)/g;
  else re = /(<!--[\s\S]*?-->)|(<\/?[a-zA-Z][\w-]*)|(\s[\w-:]+)(?==)|("[^"]*")|(\/?>)|(\{\{[A-Za-z0-9_]+\}\})/g;
  const cls = lang === 'css' ? ['c', 's', 'k', 'sel', 'p', 'n'] : lang === 'js' ? ['c', 's', 'k', 'n'] : ['c', 't', 'a', 's', 't', 'v'];
  let last = 0, m;
  while ((m = re.exec(code))) {
    if (m.index > last) out.push(escHtml(code.slice(last, m.index)));
    let gi = 1; while (gi < m.length && m[gi] === undefined) gi++;
    out.push(`<span class="hl-${cls[gi - 1] || 'x'}">${escHtml(m[0])}</span>`);
    last = re.lastIndex;
    if (m[0] === '') re.lastIndex++;
  }
  out.push(escHtml(code.slice(last)));
  return out.join('');
}

/* ---------- Скачивание файлов ---------- */
function downloadBlob(blob, name) {
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) { console.error(e); return false; }
}
/* В артефакте Claude обычные ссылки на скачивание заблокированы — там используем
   разрешённую платформой возможность downloads (с подтверждением пользователя). */
let _dlCap;
async function dlCap() {
  if (_dlCap !== undefined) return _dlCap;
  try { _dlCap = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; } catch (e) { _dlCap = null; }
  return _dlCap;
}
async function saveFile(blob, name) {
  const dl = await dlCap();
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); return 'saved'; }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') return 'declined';
      if (c === 'rejected_extension' || c === 'extension_not_enabled') return 'ext';
      if (c === 'rate_limited') return 'busy';
      if (c !== 'unavailable' && c !== 'not_granted') return 'fail';
    }
  }
  return downloadBlob(blob, name) ? 'saved' : 'fail';
}
function saveMsg(st, name) {
  if (st === 'saved') return UI.toast('Скачивание: ' + name, { icon: 'download' });
  if (st === 'declined') return;
  if (st === 'ext') return UI.toast('Файл такого типа здесь не скачивается. Скопируйте код или скачайте ZIP-архив.', { err: true, ms: 5000 });
  if (st === 'busy') return UI.toast('Подтвердите предыдущее скачивание');
  UI.toast('Браузер заблокировал скачивание. Скопируйте код.', { err: true });
}

/* ============================================================
   08 · ХРАНИЛИЩЕ (IndexedDB с запасным режимом в памяти) и ИСТОРИЯ
   ============================================================ */
const Store = {
  db: null,
  mode: 'idb',
  error: '',
  mem: { projects: new Map(), media: new Map(), kv: new Map() },
  async init() {
    try {
      if (!('indexedDB' in window)) throw new Error('IndexedDB недоступен');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('puzzle-studio', 1);
        r.onupgradeneeded = () => {
          const db = r.result;
          if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('media')) db.createObjectStore('media', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'key' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error || new Error('Не удалось открыть базу'));
        r.onblocked = () => rej(new Error('База заблокирована другой вкладкой'));
        setTimeout(() => rej(new Error('Хранилище не ответило вовремя')), 4000);
      });
      // пробная запись — в некоторых встроенных окнах открытие проходит, а запись — нет
      await this.put('kv', { key: '_probe', value: Date.now() });
      this.mode = 'idb';
    } catch (e) {
      console.warn('Storage fallback:', e);
      this.mode = 'memory';
      this.error = e && e.message ? e.message : String(e);
      this.db = null;
    }
    return this.mode;
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode);
      const os = tx.objectStore(store);
      const req = fn(os);
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('Операция отменена'));
    });
  },
  async all(store) {
    if (this.mode === 'memory') return [...this.mem[store].values()].map(clone);
    return this._tx(store, 'readonly', os => os.getAll());
  },
  async get(store, id) {
    if (this.mode === 'memory') { const v = this.mem[store].get(id); return v ? clone(v) : undefined; }
    return this._tx(store, 'readonly', os => os.get(id));
  },
  async put(store, obj) {
    if (this.mode === 'memory') { this.mem[store].set(obj.id || obj.key, clone(obj)); return; }
    return this._tx(store, 'readwrite', os => os.put(obj));
  },
  async del(store, id) {
    if (this.mode === 'memory') { this.mem[store].delete(id); return; }
    return this._tx(store, 'readwrite', os => os.delete(id));
  },
  async kvGet(key, def) { try { const r = await this.get('kv', key); return r ? r.value : def; } catch (e) { return def; } },
  async kvSet(key, value) { try { await this.put('kv', { key, value }); } catch (e) { console.warn(e); } },
  async estimate() {
    try { if (navigator.storage && navigator.storage.estimate) return await navigator.storage.estimate(); } catch (e) {}
    return null;
  },
};

/* ---------- История изменений (Undo / Redo) ----------
   Хранит снимки {page, root}. Частые правки одного поля в течение
   ~0,9 с объединяются в один шаг, чтобы Undo не откатывал по букве. */
const History = {
  undo: [], redo: [], lastKey: null, lastTime: 0, limit: 120,
  reset() { this.undo = []; this.redo = []; this.lastKey = null; this.lastTime = 0; },
  snap(p) { return JSON.stringify({ page: p.page, root: p.root, name: p.name }); },
  before(project, label, key) {
    const now = Date.now();
    if (key && key === this.lastKey && now - this.lastTime < 900) { this.lastTime = now; return; }
    this.undo.push({ s: this.snap(project), label });
    if (this.undo.length > this.limit) this.undo.shift();
    this.redo = [];
    this.lastKey = key || null; this.lastTime = now;
  },
  breakGroup() { this.lastKey = null; },
  doUndo(project) {
    const e = this.undo.pop(); if (!e) return null;
    this.redo.push({ s: this.snap(project), label: e.label });
    this.lastKey = null;
    return { state: JSON.parse(e.s), label: e.label };
  },
  doRedo(project) {
    const e = this.redo.pop(); if (!e) return null;
    this.undo.push({ s: this.snap(project), label: e.label });
    this.lastKey = null;
    return { state: JSON.parse(e.s), label: e.label };
  },
};

function buildTemplateProject(tpl) {
  const root = newRoot(tpl.build());
  return newProject({ name: tpl.name, themeId: tpl.themeId, tokens: clone(tpl.tokens || {}), root, templateId: tpl.id });
}

      opts.action ? h('button', { onclick: () => { opts.action.fn(); t.remove(); } }, opts.action.label) : null);
    host.append(t);

  dialog({ title, body, foot, cls = '', onClose, full }) {

      h('div', { class: 'dlg-h' }, h('h2', null, title), h('button', { class: 'btn icon ghost', 'aria-label': 'Закрыть', onclick: () => close() }, ic('x'))),
      h('div', { class: 'dlg-b' }, body),
      foot ? h('div', { class: 'dlg-f' }, foot) : null);
    const ov = h('div', { class: 'overlay' + (full ? ' full-sm' : '') }, dlg);
    ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
    document.addEventListener('keydown', onKey, true);
    document.body.append(ov);
    setTimeout(() => { const f = dlg.querySelector('[autofocus], .dlg-b input, .dlg-b textarea, .dlg-f .btn.primary'); if (f) f.focus(); }, 30);
    return { close, el: dlg, body: dlg.querySelector('.dlg-b') };
  },

  confirm({ title, text, ok = 'Подтвердить', danger = false }) {
    return new Promise(res => {
      let done = false;
      const fin = v => { if (done) return; done = true; d.close(); res(v); };
      const d = UI.dialog({
        title, body: h('p', { class: 'muted' }, text),
        foot: [h('button', { class: 'btn', onclick: () => fin(false) }, 'Отмена'), h('button', { class: 'btn ' + (danger ? 'danger solid' : 'primary'), onclick: () => fin(true) }, ok)],

  prompt({ title, label, value = '', ok = 'Сохранить', placeholder = '' }) {
    return new Promise(res => {
      let done = false;
      const inp = h('input', { class: 'inp', value, placeholder, autofocus: true, maxlength: 120, 'data-novar': '' });
      const fin = v => { if (done) return; done = true; d.close(); res(v); };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') fin(inp.value.trim()); });
      const d = UI.dialog({
        title, body: h('div', { class: 'fld' }, label ? h('label', null, label) : null, inp),
        foot: [h('button', { class: 'btn', onclick: () => fin(null) }, 'Отмена'), h('button', { class: 'btn primary', onclick: () => fin(inp.value.trim()) }, ok)],
        onClose: () => { if (!done) { done = true; res(null); } },

    });
  },

  _pop: null,
  closePop() { if (UI._pop) { UI._pop.remove(); UI._pop = null; } },
  popover(anchor, content, { cls = '', align = 'start' } = {}) {
    UI.closePop();
    const p = h('div', { class: 'pop ' + cls }, content);
    document.body.append(p);
    const r = anchor.getBoundingClientRect();
    const pw = p.offsetWidth, ph = p.offsetHeight;
    let x = align === 'end' ? r.right - pw : r.left;
    let y = r.bottom + 6;
    if (y + ph > innerHeight - 8) y = Math.max(8, r.top - ph - 6);
    x = clamp(x, 8, innerWidth - pw - 8);
    p.style.left = x + 'px'; p.style.top = y + 'px';
    UI._pop = p;
    setTimeout(() => {
      const off = e => { if (!p.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) { UI.closePop(); document.removeEventListener('pointerdown', off, true); } };
      document.addEventListener('pointerdown', off, true);
    }, 0);
    return p;
  },
  menu(anchor, items, opts) {
    const content = items.filter(Boolean).map(it => it === '-' ? h('div', { class: 'menu-sep' }) :
      h('button', { class: 'menu-i' + (it.danger ? ' danger' : ''), disabled: it.disabled, onclick: () => { UI.closePop(); it.fn(); } }, it.icon ? ic(it.icon, 16) : null, h('span', null, it.label), it.kbd ? h('kbd', null, it.kbd) : null));
    return UI.popover(anchor, content, opts);
  },

  // Копирование, которое сообщает об успехе только после подтверждения браузера
  async copy(text, okMsg = 'Скопировано') {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        UI.toast(okMsg, { icon: 'check' });
        return true;
      }
    } catch (e) { /* пробуем запасной путь */ }
    try {
      const t = h('textarea', { style: { position: 'fixed', opacity: '0', top: '0' } });
      t.value = text; document.body.append(t); t.select();

    } catch (e) {}
    UI.toast('Браузер не разрешил копирование. Выделите код и скопируйте вручную (Ctrl+C / долгое нажатие)', { err: true, ms: 5000 });
    return false;
  },
};

/* ===== 10a-varsuggest.js ===== */
/* ============================================================
   10a · ПОДСКАЗКА ПЕРЕМЕННЫХ ПРИ ВВОДЕ «{{»
   Работает в любом текстовом поле редактора: свойства, пункты списков,
   действия, диалоги. Поля поиска помечены data-novar и не участвуют.
   ============================================================ */
const VarSuggest = {
  el: null, target: null, items: [], idx: 0, start: 0,

  match(text) {
    const m = text.match(/\{\{\s*([A-Za-z0-9_]*)$/);
    return m ? { q: m[1].toUpperCase(), len: m[0].length } : null;
  },
  find(q, project) {
    const all = allVars(project);
    if (!q) return all.slice(0, 50);
    const starts = all.filter(v => v.key.startsWith(q));
    const contains = all.filter(v => !v.key.startsWith(q) && (v.key.includes(q) || v.desc.toUpperCase().includes(q)));
    return [...starts, ...contains].slice(0, 50);
  },
  eligible(t) {
    if (!t || t.dataset.novar !== undefined) return false;
    if (t.tagName === 'TEXTAREA') return true;
    return t.tagName === 'INPUT' && (!t.type || t.type === 'text' || t.type === 'url');
  },
  onInput(e) {
    const t = e.target;
    if (!this.eligible(t)) return;
    const pos = t.selectionStart ?? t.value.length;
    const m = this.match(t.value.slice(0, pos));
    if (!m) return this.close();
    const list = this.find(m.q, S.project);
    if (!list.length) return this.close();
    this.target = t; this.items = list; this.idx = 0; this.start = pos - m.len;
    this.render();
  },
  render() {
    if (!this.el) {
      this.el = h('div', { class: 'var-sug', role: 'listbox', 'aria-label': 'Переменные' });
      this.el.addEventListener('mousedown', e => e.preventDefault()); // не терять фокус поля
      document.body.append(this.el);
    }
    this.el.innerHTML = '';
    this.items.forEach((v, i) => {
      const row = h('div', { class: 'var-sug-i' + (i === this.idx ? ' on' : ''), role: 'option', 'aria-selected': String(i === this.idx) },
        h('code', null, '{{' + v.key + '}}'),
        h('span', null, v.desc),
        v.link ? h('em', { title: 'PuzzleBot может подставить ссылку' }, 'ссылкой') : v.example ? h('em', { title: 'Такой переменной нет в PuzzleBot по умолчанию' }, 'своя') : null);
      row.addEventListener('click', () => { this.idx = i; this.pick(); });
      this.el.append(row);
    });
    const r = this.target.getBoundingClientRect();
    const w = Math.min(380, Math.max(260, r.width));
    this.el.style.width = w + 'px';
    let top = r.bottom + 4;
    const hgt = Math.min(280, this.items.length * 46 + 8);
    if (top + hgt > innerHeight - 8) top = Math.max(8, r.top - hgt - 4);
    this.el.style.top = top + 'px';
    this.el.style.left = clamp(r.left, 8, innerWidth - w - 8) + 'px';
    this.el.hidden = false;
    const on = this.el.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' });
  },
  onKey(e) {
    if (!this.el || this.el.hidden || e.target !== this.target) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); this.idx = (this.idx + 1) % this.items.length; this.render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); this.idx = (this.idx - 1 + this.items.length) % this.items.length; this.render(); }
    else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); this.pick(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); this.close(); }
  },
  pick() {
    const v = this.items[this.idx], t = this.target;
    if (!v || !t) return this.close();
    const pos = t.selectionStart ?? t.value.length;
    // если сразу после курсора уже стоят «}}», не дублируем их
    let after = t.value.slice(pos);
    after = after.replace(/^[A-Za-z0-9_]*\s*\}\}/, '');
    const ins = '{{' + v.key + '}}';
    t.value = t.value.slice(0, this.start) + ins + after;
    const c = this.start + ins.length;
    try { t.setSelectionRange(c, c); } catch (er) {}
    this.close();
    t.dispatchEvent(new Event('input', { bubbles: true }));
    t.dispatchEvent(new Event('change', { bubbles: true }));
    t.focus();
  },
  close() { if (this.el) this.el.hidden = true; this.target = null; },
  init() {
    document.addEventListener('input', e => this.onInput(e), true);
    document.addEventListener('keydown', e => this.onKey(e), true);
    document.addEventListener('focusout', e => { if (e.target === this.target) setTimeout(() => { if (document.activeElement !== this.target) this.close(); }, 120); }, true);
    window.addEventListener('resize', () => this.close());
    document.addEventListener('scroll', e => { if (this.target && !(this.el && this.el.contains(e.target))) this.close(); }, true);
  },
};

function fitDevice(wrap, dev, frame, device, info) {

  const chrome = device === 'desktop' ? 26 : 0;
  const width = narrow ? W : d.w;
  const scale = narrow ? 1 : Math.min(1, (W - 24) / (width + pad));
  const outerH = narrow ? H : H / scale - 4;
  dev.style.width = (width + pad) + 'px';
  dev.style.height = outerH + 'px';
  frame.style.height = (outerH - pad - chrome) + 'px';
  dev.style.transform = scale < 1 ? `scale(${scale})` : '';
  dev.style.marginBottom = scale < 1 ? `${-(outerH * (1 - scale))}px` : '';
  if (info) info.textContent = `${d.label} · ${narrow ? W : width}px${scale < 1 ? ' · масштаб ' + Math.round(scale * 100) + '%' : ''}`;
}
Canvas.layout = function () { if (this.wrap && this.dev) fitDevice(this.wrap, this.dev, this.frame, S.device, this.info); };

  /* ---------- дерево слоёв ---------- */

    body.innerHTML = '';
    body.append(h('div', { class: 'hint', style: { marginBottom: '8px' } }, isMobile() ? 'Нажмите на слой, чтобы выбрать. Порядок — кнопками ↑ ↓ или «Переместить в…».' : 'Перетаскивайте слои, чтобы менять порядок и вложенность.'));

    const row = (n, depth) => {
      const def = COMP[n.type];
      const hasKids = def.container && (n.children || []).length;
      const collapsed = S.collapsed.has(n.id);
      const r = h('div', { class: 'lyr' + (S.sel === n.id || (!S.sel && n.id === 'page') ? ' on' : '') + (n.hidden ? ' dim' : ''), role: 'treeitem', 'data-id': n.id, style: { paddingLeft: (4 + depth * 14) + 'px' }, draggable: n.id !== 'page' && !isMobile() ? 'true' : 'false' });

      const acts = h('span', { class: 'la' });
      if (n.id !== 'page') {
        acts.append(
          h('button', { class: n.hidden ? 'keep' : '', title: n.hidden ? 'Показать' : 'Скрыть', 'aria-label': n.hidden ? 'Показать' : 'Скрыть', onclick: e => { e.stopPropagation(); this.toggleFlag(n.id, 'hidden'); } }, ic(n.hidden ? 'eye-off' : 'eye', 14)),
          h('button', { class: n.locked ? 'keep' : '', title: n.locked ? 'Разблокировать' : 'Заблокировать', 'aria-label': n.locked ? 'Разблокировать' : 'Заблокировать', onclick: e => { e.stopPropagation(); this.toggleFlag(n.id, 'locked'); } }, ic(n.locked ? 'lock' : 'unlock', 14)),

      r.addEventListener('dragend', () => { S.layerDrag = null; $$('.lyr', list).forEach(x => x.classList.remove('drop-before', 'drop-after', 'drop-in')); });
      r.addEventListener('dragover', e => {
        if (!S.layerDrag || S.layerDrag === n.id) return;
        e.preventDefault();
        const rect = r.getBoundingClientRect(), y = e.clientY - rect.top;
        const zone = def.container && y > rect.height * 0.28 && y < rect.height * 0.72 ? 'in' : y < rect.height / 2 ? 'before' : 'after';
        r.classList.remove('drop-before', 'drop-after', 'drop-in');

/* ---------- Медиатека ---------- */
const Media = {
  MAX_INPUT: 15 * 1024 * 1024,
  async add(file) {
    if (!file) return null;
    if (!/^image\/(png|jpeg|webp|gif|svg\+xml)$/.test(file.type)) { UI.toast('Поддерживаются PNG, JPG, WEBP, GIF и SVG', { err: true }); return null; }
    if (file.size > this.MAX_INPUT) { UI.toast('Файл больше 15 МБ — уменьшите его перед загрузкой', { err: true }); return null; }
    try {
      let dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
      let w = 0, hgt = 0;
      if (!/gif|svg/.test(file.type)) {
        const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Не удалось прочитать изображение')); i.src = dataUrl; });
        w = img.naturalWidth; hgt = img.naturalHeight;
        // уменьшаем большие фото: они попадут в код страницы
        const maxSide = 1600;
        if (w > maxSide || hgt > maxSide || file.size > 450 * 1024) {
          const k = Math.min(1, maxSide / Math.max(w, hgt));
          const c = document.createElement('canvas');
          c.width = Math.round(w * k); c.height = Math.round(hgt * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          let out = c.toDataURL('image/webp', 0.84);
          if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/jpeg', 0.85);
          if (out.length < dataUrl.length) { dataUrl = out; w = c.width; hgt = c.height; }
        }
      }
      const item = { id: 'm' + uid(9), name: file.name.slice(0, 80), type: file.type, size: Math.round(dataUrl.length * 0.75), w, h: hgt, dataUrl, createdAt: Date.now() };
      await Store.put('media', item);
      S.media.unshift(item);
      if (item.size > 300 * 1024) UI.toast(`Изображение весит ${fmtBytes(item.size)} — оно увеличит размер кода страницы`, { ms: 4500 });
      else UI.toast('Изображение добавлено', { icon: 'check' });
      return item;
    } catch (e) {
      console.error(e);
      UI.toast(e && e.name === 'QuotaExceededError' ? 'Нет места в хранилище браузера' : 'Не удалось загрузить изображение', { err: true });
      return null;
    }
  },
  async remove(id) {
    await Store.del('media', id);
    S.media = S.media.filter(m => m.id !== id);
  },
};

/* ---------- Миниатюры: настоящая страница в Shadow DOM (стили изолированы) ---------- */
function thumbInto(host, project, width = 390) {
  host.innerHTML = '';
  const inner = h('div', { class: 'thumb-host', style: { width: width + 'px' } });
  host.append(inner);
  const sr = inner.attachShadow ? inner.attachShadow({ mode: 'open' }) : null;
  const g = safe(() => generate(project, { mode: 'export', js: false, varMode: 'sample', noAnim: true, pretty: false, embed: 'doc' }), null);
  if (!g) { host.append(h('div', { class: 'empty' }, ic('alert', 20))); return; }
  App.ensureFonts(g.fonts);
  const html = `<style>${g.css} .ps-root{min-height:0!important} .ps-bnav--sticky{position:static!important}</style>${g.html}`;
  if (sr) sr.innerHTML = html; else inner.innerHTML = html;
  const fit = () => { const k = host.clientWidth / width; inner.style.transform = `scale(${k || 0.5})`; };
  fit();
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(host);
}

/* ============================================================
   14a · ПОДКЛЮЧЕНИЕ PUZZLEBOT API (по желанию пользователя)
   Документация: https://help.puzzle.bot/vhodyaschie-zaprosy-api
   Адрес: https://api.puzzlebot.top/ , параметры token, method, platform.
   Токен запрашивается у пользователя, хранится только в этом браузере,
   отправляется только на api.puzzlebot.top и НИКОГДА не попадает в экспорт.
   ============================================================ */
const PB_ERR = {
  1: 'Неверный формат токена', 2: 'Неверный формат метода', 3: 'Токен не найден — проверьте ключ в PuzzleBot', 4: 'Неизвестный метод',
  40: 'Не передан ID чата или пользователя', 100: 'Внутренняя ошибка PuzzleBot', 102: 'Ошибка вычисления', 104: 'Переменная не найдена',
  200: 'Команда не найдена', 201: 'Пользователь не найден', 429: 'Превышен лимит запросов (120 в минуту)',
};
const PB = {
  token: '', platform: 'tg', remember: false, status: 'off', note: '',
  load() {
    try {
      const l = localStorage.getItem('ps-pb'), s = sessionStorage.getItem('ps-pb');
      const d = JSON.parse(s || l || 'null');
      if (d && d.token) { this.token = d.token; this.platform = d.platform === 'max' ? 'max' : 'tg'; this.remember = !!l; this.status = 'saved'; }
    } catch (e) {}
  },
  save() {
    const d = JSON.stringify({ token: this.token, platform: this.platform });
    try { sessionStorage.setItem('ps-pb', d); } catch (e) {}
    try { if (this.remember) localStorage.setItem('ps-pb', d); else localStorage.removeItem('ps-pb'); } catch (e) {}
  },
  forget() {
    this.token = ''; this.status = 'off'; this.note = '';
    try { sessionStorage.removeItem('ps-pb'); localStorage.removeItem('ps-pb'); } catch (e) {}
  },
  async call(method, params = {}) {
    if (!this.token) throw { code: 'no_token', message: 'Сначала подключите PuzzleBot (нужен API-токен)' };
    const body = new URLSearchParams({ token: this.token, method, platform: this.platform });
    for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== null && v !== '') body.set(k, String(v));
    let r;
    try {
      // POST с обычной формой: токен не попадает в адресную строку и журналы
      r = await fetch('https://api.puzzlebot.top/', { method: 'POST', body });
    } catch (e) {
      throw { code: 'network', message: 'Не удалось связаться с api.puzzlebot.top. Причины: нет интернета, сервер не разрешает запросы с веб-страниц (CORS) или окно, где открыт редактор, блокирует сеть (например, просмотр внутри Claude). Попробуйте открыть Puzzle Studio как отдельный файл.' };
    }
    if (r.status === 429) throw { code: 429, message: PB_ERR[429] };
    let j;
    try { j = await r.json(); } catch (e) { throw { code: 'bad', message: 'Ответ сервера не в формате JSON (HTTP ' + r.status + ')' }; }
    if (j && j.code !== undefined && j.code !== 0) throw { code: j.code, message: PB_ERR[j.code] || ('PuzzleBot вернул ошибку, код ' + j.code), raw: j };
    if (j && j.ok === false) throw { code: j.error_code || 'error', message: j.description || 'PuzzleBot вернул ошибку', raw: j };
    return j;
  },
};

function pbExtractItems(j) {
  const cand = [j && j.data, j && j.result, j];
  for (const c of cand) {
    if (Array.isArray(c)) return c;
    if (c && typeof c === 'object') for (const v of Object.values(c)) if (Array.isArray(v) && v.length && typeof v[0] === 'object') return v;
  }
  return [];
}

    if (PB.token) return true;

    return false;
  },
  async importShop() {
    if (!(await this.ensure())) return;
    UI.toast('Загружаю товары из PuzzleBot…');
    let j;
    try { j = await PB.call('getShop2ItemsList', { page: 1 }); }
    catch (e) {
      if (e.code === 4) { try { j = await PB.call('getShopItemsList', { page: 1 }); } catch (e2) { UI.toast(e2.message, { err: true, ms: 6000 }); return; } }
      else { UI.toast(e.message, { err: true, ms: 7000 }); return; }
    }
    const items = pbExtractItems(j).map(pbItemFields).filter(x => x.name);
    if (!items.length) {
      UI.dialog({ title: 'Товары не распознаны', cls: 'mid', body: [h('p', { class: 'hint' }, 'API ответил, но в ответе не нашлось списка товаров с названиями. Формат ответа в документации PuzzleBot не описан, поэтому показываю начало ответа как есть:'), h('pre', { class: 'code', style: { maxHeight: '300px', whiteSpace: 'pre-wrap' } }, JSON.stringify(j, null, 2).slice(0, 4000))] });
      return;
    }
    const cards = items.slice(0, 24).map((it, i) => {
      const c = checkUrl(it.image, { allowAnchor: false, allowData: false });
      const img = c.ok && c.url && /^https:/.test(c.url) ? c.url : artImage(30 + i, ['#5b7cfa', '#8a5cf6', '#1d2340'], 'product');
      return B.card({ pt: 10, pr: 10, pb: 12, pl: 10, gap: 8 }, [
        B.img(img, { ratio: '1/1', alt: it.name }, { radius: 'small' }),
        B.h(it.name, 5, { clamp: 2, fs: 14, fw: '600' }),
        it.price ? B.t(it.price, { fw: '700', fs: 16 }) : null,
      ].filter(Boolean), { name: 'Товар: ' + it.name.slice(0, 30) });
    });
    Editor.insert(B.box({ gap: 12 }, [B.h('Каталог', 3), B.grid(2, { gap: 10 }, cards)], { name: 'Товары PuzzleBot', anchor: 'catalog' }));
    UI.toast(`Добавлено товаров: ${cards.length}${items.length > 24 ? ' (первые 24)' : ''}`, { icon: 'check' });
  },
  async fetchVar(key) {
    if (!(await this.ensure())) return;
    try {
      const j = await PB.call('getVariableValue', { variable: key });
      let v = j.data;
      if (v && typeof v === 'object') v = v.value ?? v.variable_value ?? JSON.stringify(v);
      v = String(v ?? '');
      Editor.act('Значение переменной из PuzzleBot', pr => {
        const list = pr.page.customVars = pr.page.customVars || [];
        const ex = list.find(x => x.key === key);
        const desc = (allVars(pr).find(x => x.key === key) || {}).desc || 'Переменная PuzzleBot';
        if (ex) ex.sample = v.slice(0, 200); else list.push({ key, desc, sample: v.slice(0, 200) });
      }, { struct: false });
      Canvas.render();
      UI.toast(`{{${key}}} = ${v.slice(0, 60) || '(пусто)'}`, { icon: 'check', ms: 4000 });
      if (S.leftTab === 'vars') Editor.renderLeft();
    } catch (e) { UI.toast(e.code === 104 ? `Переменная ${key} не найдена в PuzzleBot (или она персональная — тогда нужен ID пользователя)` : e.message, { err: true, ms: 6000 }); }
  },
};

/* ===== 15-export-ui.js ===== */
/* ============================================================
   15 · ОКНА: экспорт кода, импорт JSON, AI-генерация
   ============================================================ */
const ExportUI = {
  opts: { mode: 'puzzlebot', js: true, minify: false, tgScript: true },

  open() {
    if (!S.project) return;
    Editor.saveNow();
    const o = this.opts;
    let current = null, tab = 0;
    const side = h('div', { class: 'exp-side' });
    const main = h('div', { class: 'exp-main' });
    const codeBar = h('div', { class: 'code-bar' });
    const pre = h('pre', { class: 'code', tabindex: '0', 'aria-label': 'Итоговый код' });
    main.append(codeBar, pre);
    const rebuild = () => {
      current = safe(() => buildExport(S.project, o), null);
      if (!current) { pre.textContent = 'Не удалось собрать код. Проверьте проект.'; return; }
      if (tab >= current.parts.length) tab = 0;
      drawSide(); drawCode();
    };
    const drawCode = () => {
      codeBar.innerHTML = '';
      const tabs = h('div', { class: 'tabs', role: 'tablist' });
      current.parts.forEach((p, i) => tabs.append(h('button', { class: i === tab ? 'on' : '', role: 'tab', onclick: () => { tab = i; drawCode(); } }, p.tab)));
      const part = current.parts[tab];
      const size = new Blob([part.code]).size;
      codeBar.append(tabs, h('span', { class: 'muted', style: { fontSize: '12px' } }, fmtBytes(size)),
        h('button', { class: 'btn sm', onclick: () => this.download(part.code, part.file, 'text/' + (part.lang === 'js' ? 'javascript' : part.lang)) }, ic('download', 14), 'Файл'),
        h('button', { class: 'btn sm primary', onclick: () => UI.copy(part.code, 'Код скопирован в буфер обмена') }, ic('copy', 14), current.parts.length > 1 ? 'Копировать ' + part.tab : 'Копировать код'));
      pre.innerHTML = part.code.length > 400000 ? escHtml(part.code) : highlight(part.code, part.lang);
      pre.scrollTop = 0;
    };
    const drawSide = () => {
      side.innerHTML = '';
      side.append(h('div', { class: 'grp-t' }, 'Куда вставлять'));
      for (const m of EXPORT_MODES) {
        side.append(h('button', { class: 'mode-opt' + (o.mode === m.id ? ' on' : ''), 'aria-pressed': String(o.mode === m.id), onclick: () => { o.mode = m.id; tab = 0; rebuild(); } }, h('b', null, h('i', null, m.short), m.label), h('span', null, m.desc)));
      }
      if (o.mode === 'puzzlebot' || o.mode === 'split' || o.mode === 'fragment') side.append(h('div', { class: 'grp-t' }, 'Фон в PuzzleBot'), ...Inspector.embedCtl(() => rebuild()));
      side.append(h('div', { class: 'grp-t' }, 'Параметры'),
        toggle('JavaScript для интерактива', o.js, v => { o.js = v; rebuild(); }),
        toggle('Минифицировать', o.minify, v => { o.minify = v; rebuild(); }),
        ...(o.mode === 'document' ? [toggle('Подключить telegram-web-app.js', o.tgScript, v => { o.tgScript = v; rebuild(); })] : []));
      const issues = lintProject(S.project, { js: o.js });
      const order = { error: 0, warn: 1, info: 2 };
      issues.sort((a, b) => order[a.level] - order[b.level]);
      const errs = issues.filter(i => i.level === 'error').length, warns = issues.filter(i => i.level === 'warn').length;
      side.append(h('div', { class: 'grp-t' }, `Проверка · ошибок ${errs}, предупреждений ${warns}`));
      const box = h('div', { class: 'issues' });
      if (!issues.length) box.append(h('div', { class: 'issue info' }, ic('check', 15), h('span', null, 'Замечаний нет')));
      for (const it of issues.slice(0, 60)) {
        const icon = it.level === 'error' ? 'alert' : it.level === 'warn' ? 'info' : 'help';
        box.append(it.nodeId ? h('button', { class: 'issue ' + it.level, title: 'Показать блок', onclick: () => { d.close(); Editor.select(it.nodeId); if (isMobile()) Editor.setMpane('props'); } }, ic(icon, 15), h('span', null, it.text)) : h('div', { class: 'issue ' + it.level }, ic(icon, 15), h('span', null, it.text)));
      }
      side.append(box);
      if (current.notes.length) side.append(h('div', { class: 'grp-t' }, 'Важно'), ...current.notes.map(t => h('div', { class: 'hint box' }, t)));
      side.append(h('div', { class: 'grp-t' }, 'Как разместить'), h('ol', { class: 'steps' }, (EXPORT_GUIDE[o.mode] || []).map(s => h('li', null, s))));
      side.append(h('div', { class: 'hint box warn' }, 'Способ вставки HTML в PuzzleBot не описан в открытой документации, которую удалось проверить. После вставки обязательно откройте страницу в Telegram на телефоне.'));
      side.append(h('div', { class: 'btn-row' },
        h('button', { class: 'btn sm', onclick: () => this.zip(current) }, ic('download', 14), 'ZIP-архив'),
        h('button', { class: 'btn sm', onclick: () => this.downloadProject(S.project) }, ic('file', 14), 'Проект JSON')),
        h('div', { class: 'hint' }, 'Скачивание может попросить подтверждение. Если файл не сохранился, используйте «Копировать».'));
    };
    const d = UI.dialog({ title: 'Экспорт: ' + S.project.name, body: h('div', { class: 'exp' }, side, main), cls: 'wide', full: true });
    d.body.style.padding = '0';
    rebuild();
  },

  async download(text, name, type = 'text/plain') {
    saveMsg(await saveFile(new Blob([text], { type: type + ';charset=utf-8' }), name), name);
  },
  zip(current) {
    const base = slugName(S.project.name);
    const g = current.gen;
    const files = [];
    if (this.opts.mode === 'document') files.push({ name: 'index.html', data: current.single });
    else {
      const full = buildExport(S.project, { ...this.opts, mode: 'document' });
      files.push({ name: 'index.html', data: full.single });
      files.push({ name: 'puzzlebot-block.html', data: buildExport(S.project, { ...this.opts, mode: 'puzzlebot' }).single });
      files.push({ name: 'page.html', data: g.html });
      files.push({ name: 'style.css', data: (g.fontsHref ? `@import url("${g.fontsHref}");\n` : '') + g.css });
      if (g.js) files.push({ name: 'script.js', data: g.js });
    }
    files.push({ name: 'project.json', data: projectFileJson(S.project) });
    files.push({ name: 'README.txt', data: `Puzzle Studio — ${S.project.name}\n\nindex.html — самостоятельная страница (хостинг / Mini App по ссылке)\npuzzlebot-block.html — один блок со стилями для вставки в PuzzleBot\npage.html, style.css, script.js — те же части по отдельности\nproject.json — исходный проект: его можно снова открыть в Puzzle Studio через «Импорт»\n\nПеременные вида {{ИМЯ}} сохранены как есть — значения подставляет бот.\n` });
    saveFile(makeZip(files), base + '.zip').then(st => saveMsg(st, base + '.zip'));
  },
  downloadProject(p) { this.download(projectFileJson(p), slugName(p.name) + '.puzzle.json', 'application/json'); },
  async backupAll() {
    const all = await Store.all('projects').catch(() => S.projects);
    this.download(JSON.stringify({ format: 'puzzle-studio-backup', version: PROJECT_VERSION, exportedAt: new Date().toISOString(), projects: all }, null, 1), 'puzzle-studio-backup.json', 'application/json');
  },

  importDialog(intoCurrent) {
    const ta = h('textarea', { class: 'ta mono', rows: 8, placeholder: 'Вставьте JSON проекта или выберите файл' });
    const file = h('input', { type: 'file', accept: '.json,application/json', hidden: true });
    const out = h('div', { class: 'issues' });
    file.addEventListener('change', async () => { const f = file.files[0]; if (!f) return; if (f.size > 25 * 1024 * 1024) { UI.toast('Файл больше 25 МБ', { err: true }); return; } ta.value = await f.text(); });
    const run = async () => {
      out.innerHTML = '';
      let data;
      try { data = JSON.parse(ta.value); } catch (e) { out.append(h('div', { class: 'issue error' }, ic('alert', 15), h('span', null, 'Это не JSON. Проверьте, что скопирован весь текст.'))); return; }
      if (data && data.format === 'puzzle-studio-backup' && Array.isArray(data.projects)) {
        if (intoCurrent) { out.append(h('div', { class: 'issue error' }, ic('alert', 15), h('span', null, 'Это резервная копия нескольких проектов. Импортируйте её с главного экрана.'))); return; }
        let n = 0;
        for (const raw of data.projects.slice(0, 500)) { const v = validateImport(raw); if (v.ok) { v.project.name = raw.name || v.project.name; await Home.persist(v.project); n++; } }
        d.close(); UI.toast(`Восстановлено проектов: ${n}`, { icon: 'check' }); Home.render(); return;
      }
      const v = validateImport(data);
      if (!v.ok) { v.errors.forEach(e => out.append(h('div', { class: 'issue error' }, ic('alert', 15), h('span', null, e)))); return; }
      v.warnings.forEach(w => out.append(h('div', { class: 'issue warn' }, ic('info', 15), h('span', null, w))));
      if (intoCurrent && S.project) {
        if (!(await UI.confirm({ title: 'Заменить содержимое?', text: 'Страница этого проекта будет заменена импортированной. Действие можно отменить через Undo.', ok: 'Заменить' }))) return;
        Editor.act('Импорт JSON', pr => { pr.root = v.project.root; pr.page = v.project.page; }, { panel: true });
        S.sel = null; Inspector.render();
        d.close(); UI.toast('Импортировано' + (v.warnings.length ? ' с замечаниями' : ''), { icon: 'check' });
      } else {
        await Home.persist(v.project);
        d.close(); UI.toast('Проект импортирован', { icon: 'check' });
        Editor.open(v.project);
      }
    };
    const d = UI.dialog({
      title: intoCurrent ? 'Импорт JSON в проект' : 'Импорт проекта', cls: 'mid',
      body: [h('p', { class: 'hint' }, 'Подходит файл, скачанный из Puzzle Studio (.puzzle.json), резервная копия или модель, созданная AI. JSON проверяется по схеме: неизвестные блоки и опасные значения отбрасываются.'),
        h('button', { class: 'btn', onclick: () => file.click() }, ic('upload', 15), 'Выбрать файл'), file, ta, out],
      foot: [h('button', { class: 'btn', onclick: () => d.close() }, 'Отмена'), h('button', { class: 'btn primary', onclick: run }, 'Импортировать')],
    });
  },

  ai() {
    const types = Object.entries(COMP).filter(([k]) => k !== 'page').map(([k, c]) => `${k} (${c.label}): ${(c.fields || []).map(f => f.k).join(', ')}`).join('\n');
    const promptText = `Ты генерируешь страницу для визуального редактора Puzzle Studio. Верни ТОЛЬКО JSON без пояснений.
Формат: {"name": "...", "page": {"themeId": "dark|light|minimal|neon|glass|gradient|ios|material|gaming|premium"}, "root": {"type": "page", "children": [ ...блоки... ]}}
Блок: {"type": "...", "props": {...}, "style": {...}, "action": {"type": "none|url|tg|bot|anchor|copy", "value": "..."}, "children": [...]} — children только у container и form.
container.style.layout: "stack" | "row" | "grid" (+ "cols": 2). Отступы: pt, pr, pb, pl, gap (числа в px). Цвета: "token:primary", "token:surface", "token:muted" или "#hex". Скругление: radius: "theme". Градиент: grad: {"on": true, "from": "token:primary", "to": "token:primary2", "angle": 135}.
Переменные бота пиши как {{FIRST_NAME}}, {{BALANCE}}, {{REF_LINK}}.
Типы блоков и их props:
${types}

Задача: `;
    const ta = h('textarea', { class: 'ta', rows: 4, placeholder: 'Например: премиальный магазин цифровых товаров в тёмном стиле с баннером, карточками, ценами, профилем и FAQ' });
    const d = UI.dialog({
      title: 'AI-генерация страниц', cls: 'mid',
      body: [
        h('div', { class: 'hint box warn' }, h('b', null, 'Интеграция не настроена. '), 'В Puzzle Studio нет подключённого AI-сервиса, поэтому кнопка «Создать» недоступна. Готовые ответы не подставляются вместо генерации.'),
        field('Описание страницы', ta),
        h('button', { class: 'btn primary', disabled: true, title: 'Нужен подключённый AI API' }, ic('wand', 15), 'Создать (недоступно)'),
        h('div', { class: 'grp-t' }, 'Что можно сделать сейчас'),
        h('ol', { class: 'steps' },
          h('li', null, 'Опишите страницу в поле выше и нажмите «Скопировать запрос для AI».'),
          h('li', null, 'Вставьте запрос в любой чат с AI (например, Claude) и получите JSON.'),
          h('li', null, 'Вернитесь сюда, нажмите «Импорт JSON» и вставьте ответ — страница откроется в редакторе, её можно дальше править.')),
        h('div', { class: 'btn-row' },
          h('button', { class: 'btn', onclick: () => UI.copy(promptText + (ta.value.trim() || 'страница для Telegram-бота'), 'Запрос скопирован') }, ic('copy', 15), 'Скопировать запрос для AI'),
          h('button', { class: 'btn', onclick: () => { d.close(); this.importDialog(!!S.project && S.view === 'editor'); } }, ic('upload', 15), 'Импорт JSON')),
        h('div', { class: 'hint' }, 'Подготовленная архитектура: AI должен возвращать ту же JSON-модель проекта, что сохраняет редактор. Она проходит ту же проверку схемы, что и обычный импорт.'),
      ],
    });
  },
};

/* ===== 16-main.js ===== */
/* ============================================================
   16 · ЗАПУСК ПРИЛОЖЕНИЯ, НАСТРОЙКИ, TELEGRAM
   ============================================================ */
const App = {
  loadedFonts: new Set(),
  tg: null,

  ensureFonts(keys) {
    const fresh = (keys || []).filter(k => FONTS[k] && FONTS[k].g && !this.loadedFonts.has(k));
    if (!fresh.length) return;
    fresh.forEach(k => this.loadedFonts.add(k));
    const href = googleFontsHref(fresh);
    if (href) document.head.append(h('link', { rel: 'stylesheet', href }));
  },

  resolveUi() {
    const s = S.settings.ui;
    if (s === 'dark' || s === 'light') return s;
    if (this.tg && this.tg.colorScheme) return this.tg.colorScheme === 'light' ? 'light' : 'dark';
    const host = document.documentElement.getAttribute('data-theme');
    if (host === 'light' || host === 'dark') return host;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  },
  applyUi() {
    const v = this.resolveUi();
    document.documentElement.dataset.ui = v;
    try { if (this.tg && this.tg.setHeaderColor) this.tg.setHeaderColor(v === 'light' ? '#ffffff' : '#14161c'); if (this.tg && this.tg.setBackgroundColor) this.tg.setBackgroundColor(v === 'light' ? '#eef0f5' : '#0d0e12'); } catch (e) {}
  },
  toggleUi() { S.settings.ui = this.resolveUi() === 'light' ? 'dark' : 'light'; this.applyUi(); this.saveSettings(); },
  saveSettings() { Store.kvSet('settings', S.settings); },

  syncTelegramBack() {
    const bb = this.tg && this.tg.BackButton;
    if (!bb) return;
    try { if (S.view === 'editor') bb.show(); else bb.hide(); } catch (e) {}
  },

  async boot() {
    const app = $('#app');
    app.append(h('div', { class: 'empty', style: { margin: 'auto' } }, h('span', { class: 'logo-mark', html: iconSvg('logo', 18), style: { width: '40px', height: '40px', borderRadius: '12px' } }), h('p', null, 'Загрузка Puzzle Studio…')));
    // Telegram Mini App: используем только если действительно открыто внутри Telegram
    try {
      const w = window.Telegram && window.Telegram.WebApp;
      if (w && w.initData) {
        this.tg = w; w.ready(); w.expand();
        if (w.disableVerticalSwipes) w.disableVerticalSwipes();
        w.onEvent && w.onEvent('themeChanged', () => this.applyUi());
        w.BackButton && w.BackButton.onClick(() => { if (S.view === 'editor') Editor.close(); });
      }
    } catch (e) { console.warn('Telegram WebApp:', e); }
    this.applyUi();
    PB.load();
    VarSuggest.init();
    await Store.init();
    const [settings, projects, media, myComps, favTpl] = await Promise.all([
      Store.kvGet('settings', null), Store.all('projects').catch(() => []), Store.all('media').catch(() => []), Store.kvGet('myComps', []), Store.kvGet('favTpl', []),
    ]);
    if (settings) Object.assign(S.settings, settings, settings.v === 2 ? {} : { ui: 'light', v: 2 });
    // повреждённые записи не должны ронять приложение
    S.projects = (projects || []).filter(p => p && p.root && p.root.type === 'page' && p.id).map(p => { if (!p.pid) p.pid = uid(6); if (!p.page) p.page = { themeId: 'dark', tokens: {} }; return p; });
    S.media = (media || []).sort((a, b) => b.createdAt - a.createdAt);
    S.myComps = Array.isArray(myComps) ? myComps : [];
    S.favTpl = Array.isArray(favTpl) ? favTpl : [];
    this.applyUi();
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (S.settings.ui === 'system') this.applyUi(); });
    if (Store.mode === 'memory') UI.toast('Хранилище браузера недоступно — проекты не сохранятся после закрытия. Скачивайте JSON.', { err: true, ms: 7000 });
    if (!S.projects.length) S.homeTab = 'templates';
    Home.render();
    document.addEventListener('keydown', e => Editor.key(e));
    window.addEventListener('beforeunload', () => { if (S.project) Editor.saveNow(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S.project) Editor.saveNow(); });
    let lastMobile = isMobile();
    window.addEventListener('resize', debounce(() => {
      const m = isMobile();
      if (m !== lastMobile && S.view === 'editor') { lastMobile = m; Editor.setMpane(null); Editor.renderLeft(); Inspector.render(); }
      lastMobile = m;
    }, 150));
  },
};

window.addEventListener('error', e => { console.error(e.error || e.message); if (document.body) UI.toast('Внутренняя ошибка. Проект сохранён; если что-то пропало — нажмите «Отменить».', { err: true, ms: 5000 }); });
window.addEventListener('unhandledrejection', e => { console.error(e.reason); });

App.ensureFonts(['opensans', 'mono']);
App.boot();

})();
